    <script>
        tailwind.config = {

</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-mint selection:text-black">

    <!-- CLEAN MINIMALIST TOP BAR -->
    <header class="border-b border-slate-800/80 bg-[#0b0e14]/90 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            
            <!-- Left: Brand -->
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-mint flex items-center justify-center text-black font-bold text-lg shadow-lg shadow-mint/20">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <span class="font-bold text-lg tracking-tight text-white">ChronoTrade</span>
            </div>

            <!-- Center: Simple Time Speed Controls (1 sec = X secs / mins / hours / days) -->
            <div class="flex flex-wrap items-center bg-carddark border border-slate-800 rounded-2xl px-3 py-1.5 gap-3">
                <div class="flex items-center space-x-2">
                    <span id="simDot" class="w-2 h-2 rounded-full bg-mint animate-pulse"></span>
                    <div class="text-xs font-mono">
                        <span id="simClockDisplay" class="text-white font-semibold">2026-11-08 09:30:00</span>
                        <span id="simRateLabel" class="ml-1.5 px-2 py-0.5 rounded-md bg-mint/15 text-mint font-bold text-[11px]">
                            1 sec = 1 min
                        </span>
                    </div>
                </div>

                <!-- Compact simulation controls -->
                <div class="flex items-center gap-2 text-xs font-mono">
                    <select id="speedSelect" onchange="window.setSpeed(Number(this.value))"
                        class="bg-bgdark border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-mint">
                        <option value="0">Paused</option>
                        <option value="1">1 sec = 1 sec</option>
                        <option value="60" selected>1 sec = 1 min</option>
                        <option value="3600">1 sec = 1 hour</option>
                        <option value="86400">1 sec = 1 day</option>
                    </select>
                    <button onclick="window.skipTime(86400 * 365)"
                        class="px-3 py-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition"
                        title="Fast-forward one year">+1 year</button>

            </div>

            <!-- Right: Firebase Google Auth Login / Profile -->
            <div id="authContainer" class="flex items-center space-x-2">
                <!-- Logged Out View -->
                <button id="googleLoginBtn" onclick="window.signInWithGoogle()" class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-900 font-semibold text-xs flex items-center space-x-2 shadow transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4" alt="Google">
                    <span>Sign in with Google</span>

                <!-- Logged In View (Hidden by default) -->
                <div id="userProfileBar" class="hidden items-center space-x-2.5 bg-carddark border border-slate-800 rounded-xl px-3 py-1.5">
                    <img id="userAvatar" src="https://placehold.co/32x32/151922/00d09c?text=U" class="w-6 h-6 rounded-full" alt="Avatar">
                    <div class="text-xs">
                        <div id="userName" class="font-semibold text-white leading-none">Trader</div>
                        <div id="cloudStatus" class="text-[10px] text-mint font-mono mt-0.5">● Cloud Saved</div>
                    </div>
                    <button onclick="window.signOutUser()" class="text-slate-400 hover:text-coral text-xs ml-2" title="Sign Out">
                        <i class="fa-solid fa-right-from-bracket"></i>

            </div>

        </div>
    </header>

    <!-- MAIN SIMPLE 2-COLUMN LAYOUT -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT COLUMN: PORTFOLIO VALUE + ASSET PILLS + CLEAN CHART (8 Cols) -->
        <div class="lg:col-span-8 flex flex-col space-y-6">

            <!-- Hero Portfolio Net Worth Banner -->
            <div class="bg-carddark border border-slate-800/90 rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <div class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1">Total Portfolio Value</div>
                    <div id="netWorthDisplay" class="text-3xl sm:text-4xl font-bold font-mono text-white">$100,000.00</div>
                    <div id="profitDisplay" class="text-xs font-mono font-semibold text-mint mt-1">
                        +$0.00 (0.00%) All Time

                </div>

                <div class="flex flex-col sm:items-end space-y-2">
                    <div class="text-xs text-slate-400">

            <div id="assetPillsRow" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5">

            <div class="bg-carddark border border-slate-800/90 rounded-3xl p-6 flex flex-col">
                <div class="flex items-center justify-between mb-4">

                        <div class="flex items-center space-x-2">

                            <span id="chartAssetChange" class="text-xs font-mono font-semibold text-mint">+0.00%</span>
                        </div>

                    <!-- Owned Badge on Chart -->

                <!-- Smooth Line Chart Canvas -->

                    <div id="chartHoverBox" class="hidden absolute top-2 left-2 bg-bgdark/90 border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-mono pointer-events-none"></div>

            <!-- Simple Trade Card -->
            <div class="bg-carddark border border-slate-800/90 rounded-3xl p-6">

                    <button onclick="window.setTradeSide('BUY')" id="tabBuy" class="py-2.5 rounded-xl font-bold text-xs bg-mint text-black transition">
                        Buy

                    <button onclick="window.setTradeSide('SELL')" id="tabSell" class="py-2.5 rounded-xl font-bold text-xs text-slate-400 hover:text-white transition">

                <!-- Dollar Amount Input -->

                        <span class="absolute left-4 top-3 font-mono text-slate-400 text-lg">$</span>
                        <input type="number" id="tradeDollarInput" value="1000" min="1" step="any" oninput="window.updateTradePreview()"

                    <button onclick="window.setQuickAmount(1000)" class="py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition">$1k</button>
                    <button onclick="window.setQuickAmount(10000)" class="py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition">$10k</button>
                    <button onclick="window.setMaxAmount()" class="py-2 rounded-xl bg-mint/15 hover:bg-mint/25 text-mint font-bold transition">Max</button>
                </div>

                <!-- Estimated Units Summary -->
                <div class="flex justify-between items-center text-xs text-slate-400 mb-5 px-1">
                    <span>Estimated Shares / Units</span>
                    <span id="estUnitsDisplay" class="font-mono text-white font-semibold">0.0000</span>

                <!-- Big Action Button -->

                    Buy BTC

            <!-- Your Investments List -->

                <h3 class="font-bold text-sm text-white mb-4">Your Investments</h3>

    </main>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toastBox" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- FIREBASE & SIMULATOR SCRIPT -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD47CV7A3CBN8WprDT190YBoja77HG6NJY",
            authDomain: "advait-bd3da.firebaseapp.com",
            databaseURL: "https://advait-bd3da-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "advait-bd3da",
            storageBucket: "advait-bd3da.firebasestorage.app",
            messagingSenderId: "816232706393",
            appId: "1:816232706393:web:5aaa150277498ce2591c48",
            measurementId: "G-KQ1MNHH754"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        isSupported().then(yes => { if (yes) getAnalytics(app); }).catch(() => {});
        const auth = getAuth(app);
        const db = getDatabase(app);
        const googleProvider = new GoogleAuthProvider();

        /********************************************************************
         * 1. CLEAN SIMULATOR STATE
         ********************************************************************/
        const INITIAL_CASH = 100000;

        const ASSETS = [
            { symbol: 'BTC', name: 'Bitcoin', type: 'CRYPTO', binance: 'BTCUSDT', gecko: 'bitcoin', price: 76400, drift: 0.25, vol: 0.60 },
            { symbol: 'ETH', name: 'Ethereum', type: 'CRYPTO', binance: 'ETHUSDT', gecko: 'ethereum', price: 2920, drift: 0.22, vol: 0.65 },
            { symbol: 'SOL', name: 'Solana', type: 'CRYPTO', binance: 'SOLUSDT', gecko: 'solana', price: 198.50, drift: 0.30, vol: 0.75 },
            { symbol: 'NVDA', name: 'NVIDIA', type: 'STOCK', price: 138.60, drift: 0.22, vol: 0.42 },
            { symbol: 'AAPL', name: 'Apple', type: 'STOCK', price: 228.50, drift: 0.14, vol: 0.24 },
            { symbol: 'TSLA', name: 'Tesla', type: 'STOCK', price: 254.20, drift: 0.18, vol: 0.52 }
        ];

        let state = {
            user: null,
            cash: INITIAL_CASH,
            initialDeposit: INITIAL_CASH,
            simTimeMs: new Date(2026, 10, 8, 9, 30, 0).getTime(),
            speed: 60, // Default: 1 real sec = 60 sim secs (1 min)
            selected: 'BTC',
            tradeSide: 'BUY',
            assets: {},
            holdings: {} // { BTC: { qty, avgCost } }
        };

        let lastFrame = performance.now();
        let lastRender = 0;
        let lastCloudSave = 0;
        let hoverIdx = null;

        /********************************************************************
         * 2. FIREBASE GOOGLE AUTH & CLOUD PORTFOLIO SYNC
         ********************************************************************/
        window.signInWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                toast(`Signed in as ${result.user.displayName || result.user.email}!`, 'mint');
            } catch (error) {
                console.warn("Firebase Auth Popup Notice:", error.code, error.message);
                if (error.code === 'auth/unauthorized-domain' || error.code === 'auth/operation-not-supported-in-this-environment' || error.code === 'auth/popup-blocked') {
                    // Activate seamless fallback profile so the user can test inside sandboxed preview iframes
                    const mockUser = {
                        uid: 'local_preview_user',
                        displayName: 'Advait (Preview Mode)',
                        photoURL: 'https://placehold.co/32x32/00d09c/000000?text=A',
                        isLocalFallback: true
                    };
                    applyUserSession(mockUser);
                    toast(`Signed in (Preview Mode). Tip: Add this domain to Firebase Console -> Auth -> Authorized Domains for live popup.`, 'mint');
                } else {
                    toast(`Login note: ${error.message}`, 'coral');
                }
            }
        };

        window.signOutUser = async function() {
            try {
                await signOut(auth);
            } catch (e) {}
            state.user = null;
            document.getElementById('googleLoginBtn').classList.remove('hidden');
            document.getElementById('userProfileBar').classList.add('hidden');
            document.getElementById('userProfileBar').classList.remove('flex');
            toast('Signed out.', 'slate');
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                applyUserSession(user);
                await loadCloudPortfolio(user.uid);
            }
        });

        function applyUserSession(user) {
            state.user = user;
            document.getElementById('googleLoginBtn').classList.add('hidden');
            const bar = document.getElementById('userProfileBar');
            bar.classList.remove('hidden');
            bar.classList.add('flex');
            document.getElementById('userName').textContent = user.displayName || 'Trader';
            if (user.photoURL) document.getElementById('userAvatar').src = user.photoURL;
        }

        async function saveCloudPortfolio() {
            // Save to localStorage first
            const payload = {
                cash: state.cash,
                initialDeposit: state.initialDeposit,
                simTimeMs: state.simTimeMs,
                holdings: state.holdings,
                updatedAt: Date.now()
            };
            localStorage.setItem('chronotrade_save_v2', JSON.stringify(payload));

            if (!state.user || state.user.isLocalFallback) return;
            try {
                const statusEl = document.getElementById('cloudStatus');
                statusEl.textContent = '● Syncing...';
                await set(ref(db, `users/${state.user.uid}/portfolio`), payload);
                statusEl.textContent = '● Cloud Saved';
            } catch (e) {
                console.warn("Realtime DB sync note:", e.message);
            }
        }

        async function loadCloudPortfolio(uid) {
            try {
                const snap = await get(ref(db, `users/${uid}/portfolio`));
                if (snap.exists()) {
                    const data = snap.val();
                    state.cash = data.cash ?? INITIAL_CASH;
                    state.initialDeposit = data.initialDeposit ?? INITIAL_CASH;
                    state.simTimeMs = data.simTimeMs ?? state.simTimeMs;
                    state.holdings = data.holdings || {};
                    renderUI();
                    toast('Loaded your cloud portfolio from Firebase!', 'mint');
                } else {
                    await saveCloudPortfolio();
                }
            } catch (e) {
                console.warn("Could not read Firebase RTDB, using local save:", e.message);
            }
        }

        /********************************************************************
         * 3. INITIALIZE ASSETS & LIVE CRYPTO API
         ********************************************************************/
        function initSimulator() {
            // Seed 90 points of smooth price history for each asset
            ASSETS.forEach(item => {
                const history = [];
                let p = item.price * 0.92;
                const dailyVol = item.vol / Math.sqrt(252);
                for (let i = 0; i < 90; i++) {
                    p = Math.max(0.5, p * (1 + (Math.random() - 0.48) * dailyVol));
                    history.push(i === 89 ? item.price : p);
                }
                state.assets[item.symbol] = {
                    ...item,
                    startPrice: history[0],
                    history: history
                };
            });

            // Restore local save if available
            try {
                const saved = JSON.parse(localStorage.getItem('chronotrade_save_v2'));
                if (saved && typeof saved.cash === 'number') {
                    state.cash = saved.cash;
                    state.initialDeposit = saved.initialDeposit || INITIAL_CASH;
                    state.simTimeMs = saved.simTimeMs || state.simTimeMs;
                    state.holdings = saved.holdings || {};
                }
            } catch (e) {}

            setupChartHover();
            window.setSpeed(60); // Default 1 sec = 1 min
            renderUI();
            window.syncLiveMarket();
            requestAnimationFrame(tickLoop);
        }

        window.syncLiveMarket = async function() {
            const icon = document.getElementById('syncSpinner');
            icon.classList.add('fa-spin');
            let count = 0;

            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT","SOLUSDT"]');
                if (res.ok) {
                    const list = await res.json();
                    list.forEach(row => {
                        const asset = Object.values(state.assets).find(a => a.binance === row.symbol);
                        if (asset) {
                            const liveP = parseFloat(row.price);
                            if (liveP > 0) {
                                rescaleHistory(asset, liveP);
                                count++;
                            }
                        }
                    });
                }
            } catch (e) {
                try {
                    const cg = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd');
                    if (cg.ok) {
                        const data = await cg.json();
                        Object.values(state.assets).forEach(asset => {
                            if (asset.gecko && data[asset.gecko]?.usd) {
                                rescaleHistory(asset, data[asset.gecko].usd);
                                count++;
                            }
                        });
                    }
                } catch (err) {}
            }

            icon.classList.remove('fa-spin');
            if (count > 0) {
                renderUI();
                toast(`Synced live prices for BTC, ETH & SOL!`, 'mint');
            }
        };

        function rescaleHistory(asset, newPrice) {
            const ratio = newPrice / asset.price;
            asset.history = asset.history.map(v => v * ratio);
            asset.startPrice *= ratio;
            asset.price = newPrice;
        }

        /********************************************************************
         * 4. TIME SIMULATION ENGINE (1 SEC = X SECS / MINS / HOURS / DAYS)
         ********************************************************************/
        const SPEED_LABELS = {
            0: 'Paused (1s = 0s)',
            1: '1 sec = 1 sec',
            60: '1 sec = 1 min',
            3600: '1 sec = 1 hour',
            86400: '1 sec = 1 day'
        };

        window.setSpeed = function(simSecsPerRealSec) {
            state.speed = simSecsPerRealSec;
            lastFrame = performance.now();

            document.getElementById('simRateLabel').textContent = SPEED_LABELS[simSecsPerRealSec] || `1 sec = ${simSecsPerRealSec}s`;
            document.getElementById('simDot').className = simSecsPerRealSec === 0
                ? 'w-2 h-2 rounded-full bg-amber-400'
                : 'w-2 h-2 rounded-full bg-mint animate-pulse';

            const speedSelect = document.getElementById('speedSelect');
            if (speedSelect) speedSelect.value = String(simSecsPerRealSec);
        };

        window.skipTime = function(simSeconds) {
            // Break large jumps into 60 steps so the chart evolves smoothly
            const steps = 60;
            const chunk = simSeconds / steps;
            for (let i = 0; i < steps; i++) {
                stepMarket(chunk, true);
            }
            renderUI();
            saveCloudPortfolio();
            toast('Fast-forwarded +1 Year!', 'mint');
        };

        function tickLoop(now) {
            const dtReal = Math.min(0.25, (now - lastFrame) / 1000);
            lastFrame = now;

            if (state.speed > 0 && dtReal > 0) {
                const simSecs = dtReal * state.speed;
                stepMarket(simSecs, false);
                updateClockText();

                if (now - lastRender > 120) {
                    lastRender = now;
                    renderUI();
                }
                if (now - lastCloudSave > 10000) {
                    lastCloudSave = now;
                    saveCloudPortfolio();
                }
            }
            requestAnimationFrame(tickLoop);
        }

        let pointAccumulator = 0;
        function stepMarket(simSeconds, forcePushPoint) {
            state.simTimeMs += simSeconds * 1000;
            pointAccumulator += simSeconds;

            const daysElapsed = simSeconds / 86400;
            const yearsElapsed = daysElapsed / 252;
            const pushNewChartPoint = forcePushPoint || pointAccumulator >= 3600; // Push a chart point every simulated hour or on jump
            if (pushNewChartPoint) pointAccumulator = 0;

            Object.values(state.assets).forEach(asset => {
                // Standard Geometric Brownian Motion step
                const z = (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;
                const pct = (asset.drift - 0.5 * asset.vol * asset.vol) * yearsElapsed + asset.vol * Math.sqrt(yearsElapsed) * z;
                asset.price = Math.max(0.05, asset.price * Math.exp(pct));

                if (pushNewChartPoint) {
                    asset.history.push(asset.price);
                    if (asset.history.length > 120) asset.history.shift();
                } else {
                    asset.history[asset.history.length - 1] = asset.price;
                }
            });
        }

        function updateClockText() {
            const d = new Date(state.simTimeMs);
            const pad = n => String(n).padStart(2, '0');
            const str = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; // Display only through seconds
            document.getElementById('simClockDisplay').textContent = str;
        }

        /********************************************************************
         * 5. SIMPLE BUY / SELL TRADING ACTIONS
         ********************************************************************/
        window.selectAsset = function(symbol) {
            state.selected = symbol;
            renderUI();
        };

        window.setTradeSide = function(side) {
            state.tradeSide = side;
            document.getElementById('tabBuy').className = side === 'BUY'
                ? "py-2.5 rounded-xl font-bold text-xs bg-mint text-black transition"
                : "py-2.5 rounded-xl font-bold text-xs text-slate-400 hover:text-white transition";
            document.getElementById('tabSell').className = side === 'SELL'
                ? "py-2.5 rounded-xl font-bold text-xs bg-coral text-white transition"
                : "py-2.5 rounded-xl font-bold text-xs text-slate-400 hover:text-white transition";

            const btn = document.getElementById('tradeSubmitBtn');
            btn.className = side === 'BUY'
                ? "w-full py-3.5 rounded-2xl font-bold text-sm bg-mint hover:opacity-95 text-black shadow-lg shadow-mint/20 transition"
                : "w-full py-3.5 rounded-2xl font-bold text-sm bg-coral hover:opacity-95 text-white shadow-lg shadow-coral/20 transition";

            window.updateTradePreview();
        };

        window.setQuickAmount = function(dollars) {
            document.getElementById('tradeDollarInput').value = dollars;
            window.updateTradePreview();
        };

        window.setMaxAmount = function() {
            const asset = state.assets[state.selected];
            if (state.tradeSide === 'BUY') {
                document.getElementById('tradeDollarInput').value = Math.floor(state.cash * 100) / 100;
            } else {
                const owned = state.holdings[asset.symbol]?.qty || 0;
                document.getElementById('tradeDollarInput').value = Math.floor(owned * asset.price * 100) / 100;
            }
            window.updateTradePreview();
        };

        window.updateTradePreview = function() {
            const asset = state.assets[state.selected];
            const dollars = Math.max(0, parseFloat(document.getElementById('tradeDollarInput').value) || 0);
            const units = dollars / asset.price;
            document.getElementById('estUnitsDisplay').textContent = `${units.toFixed(4)} ${asset.symbol}`;
            document.getElementById('tradeSubmitBtn').textContent = `${state.tradeSide === 'BUY' ? 'Buy' : 'Sell'} ${asset.symbol}`;
        };

        window.executeTrade = function() {
            const asset = state.assets[state.selected];
            const dollars = parseFloat(document.getElementById('tradeDollarInput').value);
            if (!dollars || dollars <= 0) {
                toast('Enter a valid dollar amount.', 'coral');
                return;
            }

            if (state.tradeSide === 'BUY') {
                if (dollars > state.cash + 0.01) {
                    toast('Not enough cash! Click +$10k Cash or Max.', 'coral');
                    return;
                }
                const spend = Math.min(state.cash, dollars);
                const units = spend / asset.price;
                state.cash -= spend;

                if (!state.holdings[asset.symbol]) {
                    state.holdings[asset.symbol] = { qty: 0, avgCost: 0 };
                }
                const h = state.holdings[asset.symbol];
                const totalQty = h.qty + units;
                h.avgCost = ((h.qty * h.avgCost) + spend) / totalQty;
                h.qty = totalQty;

                toast(`Bought ${fmtMoney(spend)} of ${asset.symbol}!`, 'mint');
            } else {
                const h = state.holdings[asset.symbol];
                const ownedVal = (h?.qty || 0) * asset.price;
                if (!h || ownedVal < 0.01) {
                    toast(`You don't own any ${asset.symbol} to sell.`, 'coral');
                    return;
                }
                const sellDollars = Math.min(ownedVal, dollars);
                const sellUnits = sellDollars / asset.price;
                h.qty -= sellUnits;
                state.cash += sellDollars;

                if (h.qty <= 1e-6) delete state.holdings[asset.symbol];
                toast(`Sold ${fmtMoney(sellDollars)} of ${asset.symbol}!`, 'mint');
            }

            renderUI();
            saveCloudPortfolio();
        };

        window.addFreeCash = function(amt) {
            state.cash += amt;
            state.initialDeposit += amt;
            renderUI();
            saveCloudPortfolio();
            toast(`Added +${fmtMoney(amt)} cash!`, 'mint');
        };

        window.resetAccount = function() {
            state.cash = INITIAL_CASH;
            state.initialDeposit = INITIAL_CASH;
            state.holdings = {};
            renderUI();
            saveCloudPortfolio();
            toast('Portfolio reset to $100,000.', 'mint');
        };

        /********************************************************************
         * 6. UI RENDERING & CLEAN LINE CHART
         ********************************************************************/
        function renderUI() {
            updateClockText();

            // 1. Net Worth & Profit
            let investedVal = 0;
            Object.entries(state.holdings).forEach(([sym, h]) => {
                if (state.assets[sym]) investedVal += h.qty * state.assets[sym].price;
            });
            const netWorth = state.cash + investedVal;
            const profit = netWorth - state.initialDeposit;
            const profitPct = (profit / state.initialDeposit) * 100;
            const isUp = profit >= 0;

            document.getElementById('netWorthDisplay').textContent = fmtMoney(netWorth);
            document.getElementById('cashDisplay').textContent = fmtMoney(state.cash);

            const profEl = document.getElementById('profitDisplay');
            profEl.textContent = `${isUp ? '+' : ''}${fmtMoney(profit)} (${isUp ? '+' : ''}${profitPct.toFixed(2)}%) All Time`;
            profEl.className = `text-xs font-mono font-semibold mt-1 ${isUp ? 'text-mint' : 'text-coral'}`;

            // 2. Render 6 Asset Pills
            const pillsRow = document.getElementById('assetPillsRow');
            pillsRow.innerHTML = Object.values(state.assets).map(a => {
                const changePct = ((a.price - a.startPrice) / a.startPrice) * 100;
                const up = changePct >= 0;
                const active = a.symbol === state.selected;
                return `
                <button onclick="window.selectAsset('${a.symbol}')" 
                    class="p-3 rounded-2xl border text-left transition ${active ? 'bg-slate-800/90 border-mint shadow-md' : 'bg-carddark border-slate-800/80 hover:border-slate-700'}">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-xs text-white">${a.symbol}</span>
                        <span class="text-[10px] font-mono ${up ? 'text-mint' : 'text-coral'}">${up ? '+' : ''}${changePct.toFixed(1)}%</span>
                    </div>
                    <div class="font-mono font-semibold text-sm text-white mt-1 truncate">${fmtMoney(a.price)}</div>
                </button>`;
            }).join('');

            // 3. Selected Asset Header
            const activeAsset = state.assets[state.selected];
            const activePct = ((activeAsset.price - activeAsset.startPrice) / activeAsset.startPrice) * 100;
            document.getElementById('chartAssetName').textContent = activeAsset.name;
            document.getElementById('chartAssetTicker').textContent = activeAsset.symbol;
            document.getElementById('chartAssetPrice').textContent = fmtMoney(activeAsset.price);

            const chgEl = document.getElementById('chartAssetChange');
            chgEl.textContent = `${activePct >= 0 ? '+' : ''}${activePct.toFixed(2)}%`;
            chgEl.className = `text-xs font-mono font-semibold ${activePct >= 0 ? 'text-mint' : 'text-coral'}`;

            const ownedQty = state.holdings[activeAsset.symbol]?.qty || 0;
            document.getElementById('chartOwnedBadge').innerHTML = `You own: <span class="text-white font-semibold">${ownedQty.toFixed(4)} ${activeAsset.symbol}</span> (${fmtMoney(ownedQty * activeAsset.price)})`;

            window.updateTradePreview();

            // 4. Render Holdings List
            const hList = document.getElementById('holdingsList');
            const entries = Object.entries(state.holdings);
            if (entries.length === 0) {
                hList.innerHTML = `<div class="text-xs text-slate-500 py-8 text-center">No investments yet. Pick an asset and click Buy!</div>`;
            } else {
                hList.innerHTML = entries.map(([sym, h]) => {
                    const a = state.assets[sym];
                    const val = h.qty * a.price;
                    const cost = h.qty * h.avgCost;
                    const pnl = val - cost;
                    const pnlPct = (pnl / cost) * 100;
                    const pos = pnl >= 0;
                    return `
                    <div onclick="window.selectAsset('${sym}')" class="p-3.5 rounded-2xl bg-bgdark border border-slate-800/80 hover:border-slate-700 flex items-center justify-between cursor-pointer transition">
                        <div>
                            <div class="font-bold text-sm text-white">${sym}</div>
                            <div class="text-[11px] font-mono text-slate-400">${h.qty.toFixed(4)} units</div>
                        </div>
                        <div class="text-right font-mono">
                            <div class="text-sm font-bold text-white">${fmtMoney(val)}</div>
                            <div class="text-[11px] ${pos ? 'text-mint' : 'text-coral'}">
                                ${pos ? '+' : ''}${fmtMoney(pnl)} (${pos ? '+' : ''}${pnlPct.toFixed(1)}%)
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }

            drawChart();
        }

        function setupChartHover() {
            const canvas = document.getElementById('priceChart');
            window.addEventListener('resize', drawChart);
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const hist = state.assets[state.selected].history;
                const idx = Math.round((x / rect.width) * (hist.length - 1));
                hoverIdx = Math.max(0, Math.min(hist.length - 1, idx));
                drawChart();
            });
            canvas.addEventListener('mouseleave', () => {
                hoverIdx = null;
                document.getElementById('chartHoverBox').classList.add('hidden');
                drawChart();
            });
        }

        function drawChart() {
            const canvas = document.getElementById('priceChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const W = rect.width;
            const H = rect.height;
            ctx.clearRect(0, 0, W, H);

            const asset = state.assets[state.selected];
            const data = asset.history;
            if (data.length < 2) return;

            let min = Math.min(...data);
            let max = Math.max(...data);
            if (max === min) { max *= 1.02; min *= 0.98; }
            const padY = 18;
            const plotH = H - padY * 2;

            const getX = i => (i / (data.length - 1)) * W;
            const getY = v => padY + plotH - ((v - min) / (max - min)) * plotH;

            const isUp = data[data.length - 1] >= data[0];
            const color = isUp ? '#00d09c' : '#ff5252';

            // Smooth Price Line
            ctx.beginPath();
            data.forEach((v, i) => {
                const x = getX(i), y = getY(v);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Subtle Area Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, isUp ? 'rgba(0, 208, 156, 0.22)' : 'rgba(255, 82, 82, 0.22)');
            grad.addColorStop(1, 'rgba(11, 14, 20, 0)');
            ctx.lineTo(W, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // Average Cost Line if owned
            const holding = state.holdings[asset.symbol];
            if (holding && holding.avgCost >= min && holding.avgCost <= max) {
                const cy = getY(holding.avgCost);
                ctx.save();
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = '#64748b';
                ctx.beginPath();
                ctx.moveTo(0, cy);
                ctx.lineTo(W, cy);
                ctx.stroke();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px "JetBrains Mono"';
                ctx.fillText(`Your Avg: ${fmtMoney(holding.avgCost)}`, 8, cy - 6);
                ctx.restore();
            }

            // Hover Crosshair
            if (hoverIdx !== null && data[hoverIdx] !== undefined) {
                const v = data[hoverIdx];
                const x = getX(hoverIdx);
                const y = getY(v);

                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x, y, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();

                const box = document.getElementById('chartHoverBox');
                box.classList.remove('hidden');
                box.innerHTML = `<span class="text-slate-400">${asset.symbol}:</span> <span class="text-white font-bold">${fmtMoney(v)}</span>`;
            }
        }

        function fmtMoney(v) {
            const abs = Math.abs(v || 0);
            return (v < 0 ? '-' : '') + '$' + abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function toast(msg, type = 'mint') {
            const box = document.getElementById('toastBox');
            const el = document.createElement('div');
            const bg = type === 'coral' ? 'border-coral/50 text-coral' : 'border-mint/50 text-mint';
            el.className = `px-4 py-2.5 rounded-2xl bg-carddark border ${bg} text-xs font-medium shadow-xl`;
            el.textContent = msg;
            box.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        window.addEventListener('DOMContentLoaded', initSimulator);
    </script>
