<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover">

<title>H.I.D.E.A.</title>


<style>

/* ==================================================
   THEME
================================================== */

:root {

    --background: #D3D3D3;

    --primary: #282828;

    --panel:
        rgba(255,255,255,.72);

    --map:
        #c7c7c7;
}


@media (prefers-color-scheme: dark) {

    :root {

        --background: #282828;

        --primary: #D3D3D3;

        --panel:
            rgba(40,40,40,.82);

        --map:
            #333333;
    }
}


/* ==================================================
   RESET
================================================== */

* {

    box-sizing:
        border-box;

    -webkit-tap-highlight-color:
        transparent;
}


html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background:
        var(--background);

    color:
        var(--primary);

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* ==================================================
   SPLASH SCREEN
================================================== */

#splash {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        var(--background);

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        splashOut
        .65s
        ease
        4.8s
        forwards;

    transition:
        background .25s ease;
}


.logo {

    width: 72vw;

    max-width: 300px;

    overflow: visible;

    animation:
        logoZoomOut
        .8s
        cubic-bezier(.16,1,.3,1)
        3.1s
        forwards;
}


@keyframes logoZoomOut {

    0% {

        transform:
            scale(1);
    }

    100% {

        transform:
            scale(.72);
    }
}


/* ==================================================
   GLOBE
================================================== */

.globe {

    opacity: 0;

    transform-origin:
        250px 225px;

    animation:

        globeIn
        1s
        cubic-bezier(.16,1,.3,1)
        .15s
        forwards,

        globeFloat
        2.5s
        ease-in-out
        1.2s
        infinite;
}


@keyframes globeIn {

    0% {

        opacity: 0;

        transform:
            scale(.55)
            rotate(-15deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.05)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes globeFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-4px);
    }
}


/* ==================================================
   GLOBE LINES
================================================== */

.globeLines {

    opacity: 0;

    stroke-dasharray:
        500;

    animation:
        linesIn
        .8s
        ease
        .65s
        forwards;
}


@keyframes linesIn {

    from {

        opacity: 0;

        stroke-dashoffset:
            500;
    }

    to {

        opacity: 1;

        stroke-dashoffset:
            0;
    }
}


/* ==================================================
   CARDINAL MARKERS
================================================== */

.cardinal {

    opacity: 0;

    transform-origin:
        center;

    animation:
        cardinalIn
        .65s
        cubic-bezier(.16,1,.3,1)
        forwards;

    stroke:
        var(--primary);
}


.cardinal.east {

    animation-delay:
        1.08s;
}


.cardinal.south {

    animation-delay:
        1.21s;
}


.cardinal.west {

    animation-delay:
        1.34s;
}


@keyframes cardinalIn {

    0% {

        opacity: 0;

        transform:
            scale(.3);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.12);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* ==================================================
   NAVIGATION ARROW
================================================== */

.navArrow {

    opacity: 0;

    transform-origin:
        250px 210px;

    animation:

        arrowIn
        .8s
        cubic-bezier(.16,1,.3,1)
        .85s
        forwards,

        arrowFloat
        2.5s
        ease-in-out
        1.5s
        infinite;
}


@keyframes arrowIn {

    0% {

        opacity: 0;

        transform:
            scale(.35)
            rotate(-35deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.07)
            rotate(3deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes arrowFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-5px);
    }
}


/* ==================================================
   H.I.D.E.A. LETTERS
================================================== */

.letter {

    opacity: 0;

    filter:
        blur(7px);

    fill:
        var(--primary);

    animation:
        letterFloatIn
        .9s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


.l1 { animation-delay: 1.45s; }

.l2 { animation-delay: 1.58s; }

.l3 { animation-delay: 1.71s; }

.l4 { animation-delay: 1.84s; }

.l5 { animation-delay: 1.97s; }

.l6 { animation-delay: 2.10s; }

.l7 { animation-delay: 2.23s; }

.l8 { animation-delay: 2.36s; }

.l9 { animation-delay: 2.49s; }


@keyframes letterFloatIn {

    0% {

        opacity: 0;

        filter:
            blur(7px);

        transform:
            translateY(20px)
            scale(.82);
    }

    55% {

        opacity: 1;

        filter:
            blur(1px);

        transform:
            translateY(-4px)
            scale(1.04);
    }

    100% {

        opacity: 1;

        filter:
            blur(0);

        transform:
            translateY(0)
            scale(1);
    }
}


/* ==================================================
   SPLASH EXIT
================================================== */

@keyframes splashOut {

    to {

        opacity: 0;

        visibility: hidden;
    }
}


/* ==================================================
   MAIN APP
================================================== */

#app {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    background:
        var(--background);

    opacity: 0;
}


#map {

    position: relative;

    flex: 1;

    overflow: hidden;

    background:
        var(--map);
}


/* ==================================================
   MAP GRID
================================================== */

#map::before {

    content: "";

    position: absolute;

    inset: -100%;

    background-image:

        linear-gradient(
            rgba(0,0,0,.07)
            1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,0,0,.07)
            1px,
            transparent 1px
        );

    background-size:
        55px 55px;

    transform:
        rotate(-8deg);

    pointer-events:
        none;
}


/* ==================================================
   PLAYER INFORMATION
================================================== */

#playerInfo {

    position: absolute;

    top:
        calc(
            env(safe-area-inset-top)
            + 18px
        );

    left:
        50%;

    transform:
        translateX(-50%);

    z-index:
        10;

    min-width:
        190px;

    padding:
        9px 15px;

    border-radius:
        14px;

    background:
        var(--panel);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    text-align:
        center;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.12);
}


#usernameDisplay {

    font-size:
        16px;

    font-weight:
        700;

    margin-bottom:
        3px;
}


#coordinates {

    font-size:
        11px;

    opacity:
        .72;

    white-space:
        nowrap;
}


/* ==================================================
   PLAYER
================================================== */

#player {

    position: absolute;

    left:
        50%;

    top:
        50%;

    width:
        28px;

    height:
        40px;

    transform:
        translate(-50%,-50%);

    z-index:
        8;

    --playerColor:
        #1976D2;
}


/* ==================================================
   EXPLORER ARROW
================================================== */

#playerArrow {

    position: absolute;

    left:
        50%;

    top:
        50%;

    width:
        0;

    height:
        0;

    transform:
        translate(-50%,-50%);

    border-left:
        7px solid transparent;

    border-right:
        7px solid transparent;

    border-bottom:
        25px solid
        var(--playerColor);

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,.25)
        );
}


/* ==================================================
   PLAYER DOT
================================================== */

#playerDot {

    position: absolute;

    left:
        50%;

    top:
        50%;

    width:
        6px;

    height:
        6px;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    background:
        var(--playerColor);

    border:
        1.5px solid white;

    z-index:
        2;
}


/* ==================================================
   ERROR SCREEN
================================================== */

#errorScreen {

    position: fixed;

    inset: 0;

    z-index:
        500;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    padding:
        30px;

    text-align:
        center;

    background:
        var(--background);

    color:
        var(--primary);
}


#wifiIcon {

    font-size:
        88px;

    line-height:
        1;

    color:
        #e53935;

    margin-bottom:
        22px;
}


#errorTitle {

    font-size:
        26px;

    font-weight:
        800;

    margin-bottom:
        10px;
}


#errorText {

    max-width:
        310px;

    font-size:
        15px;

    line-height:
        1.5;

    opacity:
        .75;

    margin-bottom:
        25px;
}


#errorButton {

    border:
        none;

    padding:
        14px 22px;

    border-radius:
        14px;

    background:
        var(--primary);

    color:
        var(--background);

    font-size:
        15px;

    font-weight:
        700;
}


/* ==================================================
   COLOUR CONTROLS
================================================== */

#settings {

    position: absolute;

    bottom:
        calc(
            env(safe-area-inset-bottom)
            + 18px
        );

    left:
        50%;

    transform:
        translateX(-50%);

    z-index:
        20;

    padding:
        10px 14px;

    border-radius:
        16px;

    background:
        var(--panel);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    display:
        flex;

    align-items:
        center;

    gap:
        9px;
}


.color {

    width:
        22px;

    height:
        22px;

    border-radius:
        50%;

    border:
        2px solid
        rgba(255,255,255,.8);
}


#customColor {

    width:
        25px;

    height:
        25px;

    border:
        none;

    padding:
        0;

    background:
        none;
}

</style>

</head>


<body>


<!-- ==================================================
     SPLASH
================================================== -->

<div id="splash">

<svg
    class="logo"
    viewBox="0 0 500 500"
    xmlns="http://www.w3.org/2000/svg">


    <g
        class="globe"
        fill="none"
        stroke="var(--primary)"
        stroke-width="5">


        <circle
            cx="250"
            cy="225"
            r="105"/>


        <g
            class="globeLines"
            stroke-width="1.5"
            opacity=".55">


            <ellipse
                cx="250"
                cy="225"
                rx="105"
                ry="25"/>


            <ellipse
                cx="250"
                cy="225"
                rx="42"
                ry="105"/>


            <ellipse
                cx="250"
                cy="225"
                rx="18"
                ry="105"/>


        </g>


        <line
            class="cardinal"
            x1="250"
            y1="111"
            x2="250"
            y2="121"/>


        <line
            class="cardinal east"
            x1="364"
            y1="225"
            x2="354"
            y2="225"/>


        <line
            class="cardinal south"
            x1="250"
            y1="339"
            x2="250"
            y2="329"/>


        <line
            class="cardinal west"
            x1="136"
            y1="225"
            x2="146"
            y2="225"/>


    </g>


    <path
        class="cardinal"
        d="
        M250 92
        L258 111
        L250 106
        L242 111
        Z"
        fill="var(--primary)"
        stroke="none"/>


    <g class="navArrow">

        <path
            d="
            M250 145
            L214 285
            L250 262
            L286 285
            Z"
            fill="#4AA8F0"/>


        <path
            d="
            M250 145
            L250 262
            L286 285
            Z"
            fill="#1668B5"/>

    </g>


    <text
        class="letter l1"
        x="110"
        y="410"
        font-size="30"
        text-anchor="middle">
        H
    </text>


    <text
        class="letter l2"
        x="142"
        y="410"
        font-size="30"
        text-anchor="middle">
        .
    </text>


    <text
        class="letter l3"
        x="168"
        y="410"
        font-size="30"
        text-anchor="middle">
        I
    </text>


    <text
        class="letter l4"
        x="195"
        y="410"
        font-size="30"
        text-anchor="middle">
        .
    </text>


    <text
        class="letter l5"
        x="226"
        y="410"
        font-size="30"
        text-anchor="middle">
        D
    </text>


    <text
        class="letter l6"
        x="260"
        y="410"
        font-size="30"
        text-anchor="middle">
        .
    </text>


    <text
        class="letter l7"
        x="292"
        y="410"
        font-size="30"
        text-anchor="middle">
        E
    </text>


    <text
        class="letter l8"
        x="326"
        y="410"
        font-size="30"
        text-anchor="middle">
        .
    </text>


    <text
        class="letter l9"
        x="358"
        y="410"
        font-size="30"
        text-anchor="middle">
        A
    </text>


</svg>

</div>


<!-- ==================================================
     MAIN APP
================================================== -->

<div id="app">

    <div id="map">


        <div id="playerInfo">

            <div id="usernameDisplay">
                Player
            </div>

            <div id="coordinates">
                Waiting for location...
            </div>

        </div>


        <div id="player">

            <div id="playerArrow"></div>

            <div id="playerDot"></div>

        </div>


        <div id="settings">


            <div
                class="color"
                data-color="#1976D2"
                style="background:#1976D2">
            </div>


            <div
                class="color"
                data-color="#E53935"
                style="background:#E53935">
            </div>


            <div
                class="color"
                data-color="#43A047"
                style="background:#43A047">
            </div>


            <div
                class="color"
                data-color="#FB8C00"
                style="background:#FB8C00">
            </div>


            <div
                class="color"
                data-color="#8E24AA"
                style="background:#8E24AA">
            </div>


            <input
                id="customColor"
                type="color"
                value="#1976D2">


        </div>


    </div>

</div>


<!-- ==================================================
     LOCATION ERROR
================================================== -->

<div id="errorScreen">


    <div id="wifiIcon">
        ◔
    </div>


    <div id="errorTitle">
        Location unavailable
    </div>


    <div id="errorText">
        H.I.D.E.A. needs your phone's
        location to place you on the map.
    </div>


    <button id="errorButton">
        Open Location Settings
    </button>


</div>


<script>

/* ==================================================
   ELEMENTS
================================================== */

const splash =
    document.getElementById("splash");

const app =
    document.getElementById("app");

const player =
    document.getElementById("player");

const playerArrow =
    document.getElementById("playerArrow");

const coordinates =
    document.getElementById("coordinates");

const errorScreen =
    document.getElementById("errorScreen");


/* ==================================================
   USERNAME
================================================== */

let username =
    localStorage.getItem(
        "hidea_username"
    );


if (!username) {

    username =
        "Player";

}


document
.getElementById("usernameDisplay")
.textContent =
    username;


/* ==================================================
   LOCATION
   IMPORTANT:
   THIS DOES NOT RUN DURING SPLASH.
================================================== */

function requestLocation() {

    if (!navigator.geolocation) {

        showLocationError();

        return;
    }


    navigator.geolocation.watchPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            coordinates.textContent =
                lat.toFixed(6) +
                "°, " +
                lon.toFixed(6) +
                "°";


            errorScreen.style.display =
                "none";

        },


        function(error) {

            showLocationError();

        },


        {

            enableHighAccuracy:
                true,

            maximumAge:
                1000,

            timeout:
                10000

        }

    );

}


/* ==================================================
   LOCATION ERROR
================================================== */

function showLocationError() {

    errorScreen.style.display =
        "flex";

}


/* ==================================================
   LOCATION SETTINGS
================================================== */

document
.getElementById("errorButton")
.addEventListener(
    "click",
    function() {

        window.location.href =
            "intent:#Intent;" +
            "action=android.settings.LOCATION_SOURCE_SETTINGS;" +
            "end";

    }
);


/* ==================================================
   START APP AFTER SPLASH
================================================== */

setTimeout(

    function() {

        /*
           Splash is now finished.
        */

        app.style.opacity =
            "1";


        /*
           ONLY NOW do we ask for
           location access.
        */

        requestLocation();

    },

    5000

);


/* ==================================================
   PLAYER COLOUR
================================================== */

function setPlayerColor(color) {

    player.style.setProperty(
        "--playerColor",
        color
    );


    localStorage.setItem(
        "hidea_color",
        color
    );

}


const savedColor =
    localStorage.getItem(
        "hidea_color"
    );


if (savedColor) {

    setPlayerColor(
        savedColor
    );

}


document
.querySelectorAll(".color")
.forEach(

    function(button) {

        button.addEventListener(
            "click",
            function() {

                setPlayerColor(
                    button.dataset.color
                );

            }
        );

    }

);


document
.getElementById("customColor")
.addEventListener(
    "input",
    function(event) {

        setPlayerColor(
            event.target.value
        );

    }
);


/* ==================================================
   PHONE ORIENTATION
================================================== */

function updateHeading(event) {

    let heading =
        null;


    if (
        typeof event.webkitCompassHeading
        === "number"
    ) {

        heading =
            event.webkitCompassHeading;

    }


    else if (
        typeof event.alpha
        === "number"
    ) {

        heading =
            360 - event.alpha;

    }


    if (heading === null)
        return;


    playerArrow.style.transform =
        "translate(-50%, -50%) " +
        "rotate(" +
        heading +
        "deg)";

}


/* ==================================================
   ORIENTATION
================================================== */

function startOrientation() {

    window.addEventListener(
        "deviceorientation",
        updateHeading,
        true
    );

}


startOrientation();


/* ==================================================
   SAVE COLOUR
================================================== */

if (!savedColor) {

    setPlayerColor(
        "#1976D2"
    );

}

</script>

</body>

</html>
