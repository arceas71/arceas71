name: Render Video Short

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy scipy opencv-python-headless

      - name: Simulate and Render
        run: |
          python generate.py

      - name: Encode to H.264
        run: |
          ffmpeg -y -i short_chaos.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart magnetic_gravity_short.mp4

      - name: Publish Direct Raw MP4 (No Zips)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Magnetic Pendulum Render"
          files: magnetic_gravity_short.mp4
