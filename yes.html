<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>H.I.D.E.A.</title>

<style>

/* ==================================================
   BASIC PHONE LAYOUT
================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* ==================================================
   SPLASH SCREEN
================================================== */

#splash {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        splashOut
        0.7s
        ease
        4.4s
        forwards;
}


.logo {

    width: 72vw;

    max-width: 300px;

    overflow: visible;
}


/* ==================================================
   GLOBE ANIMATION
================================================== */

.globe {

    opacity: 0;

    transform-origin:
        250px 225px;

    animation:

        globeIn
        1s
        cubic-bezier(.16,1,.3,1)
        .15s
        forwards,

        globeFloat
        2.5s
        ease-in-out
        1.2s
        infinite;
}


@keyframes globeIn {

    0% {

        opacity: 0;

        transform:
            scale(.55)
            rotate(-15deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.05)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes globeFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-4px);
    }
}


/* ==================================================
   GLOBE LINES
================================================== */

.globeLines {

    opacity: 0;

    stroke-dasharray: 500;

    animation:

        linesIn
        .8s
        ease
        .65s
        forwards;
}


@keyframes linesIn {

    from {

        opacity: 0;

        stroke-dashoffset: 500;
    }

    to {

        opacity: 1;

        stroke-dashoffset: 0;
    }
}


/* ==================================================
   NAVIGATION ARROW
================================================== */

.navArrow {

    opacity: 0;

    transform-origin:
        250px 210px;

    animation:

        arrowIn
        .8s
        cubic-bezier(.16,1,.3,1)
        .85s
        forwards,

        arrowFloat
        2.5s
        ease-in-out
        1.5s
        infinite;
}


@keyframes arrowIn {

    0% {

        opacity: 0;

        transform:
            scale(.35)
            rotate(-35deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.07)
            rotate(3deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes arrowFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-5px);
    }
}


/* ==================================================
   LETTERS
================================================== */

.letter {

    opacity: 0;

    filter:
        blur(7px);

    animation:

        letterFloatIn
        .9s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


.l1 {
    animation-delay: 1.25s;
}

.l2 {
    animation-delay: 1.38s;
}

.l3 {
    animation-delay: 1.51s;
}

.l4 {
    animation-delay: 1.64s;
}

.l5 {
    animation-delay: 1.77s;
}

.l6 {
    animation-delay: 1.90s;
}

.l7 {
    animation-delay: 2.03s;
}

.l8 {
    animation-delay: 2.16s;
}

.l9 {
    animation-delay: 2.29s;
}


@keyframes letterFloatIn {

    0% {

        opacity: 0;

        filter:
            blur(7px);

        transform:
            translateY(20px)
            scale(.82);
    }

    55% {

        opacity: 1;

        filter:
            blur(1px);

        transform:
            translateY(-4px)
            scale(1.04);
    }

    100% {

        opacity: 1;

        filter:
            blur(0);

        transform:
            translateY(0)
            scale(1);
    }
}


/* ==================================================
   SPLASH EXIT
================================================== */

@keyframes splashOut {

    to {

        opacity: 0;

        visibility: hidden;
    }
}


/* ==================================================
   MAIN APP
================================================== */

#app {

    position: relative;

    width: 100vw;
    height: 100vh;

    background: #ffffff;

    opacity: 0;

    animation:

        appIn
        .7s
        ease
        4.45s
        forwards;
}


@keyframes appIn {

    to {

        opacity: 1;
    }
}


/* ==================================================
   COORDINATES
================================================== */

.coordinates {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -72px);

    text-align: center;

    color: #202b3c;

    font-size: 14px;

    line-height: 1.7;

    font-weight: 500;

    white-space: nowrap;
}


/* ==================================================
   LOCATION INDICATOR
================================================== */

.location-marker {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 64px;

    height: 64px;

    transform:
        translate(-50%, -50%);
}


/* ==================================================
   ACCURACY CIRCLE
================================================== */

.accuracy {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        rgba(66,133,244,.06);

    border:
        1px solid
        rgba(66,133,244,.13);
}


/* ==================================================
   DIRECTION TRIANGLE
================================================== */

.heading {

    position: absolute;

    left: 50%;

    top: 4px;

    width: 0;

    height: 0;

    transform:
        translateX(-50%);

    transform-origin:
        50% 50%;

    border-left:
        6px solid transparent;

    border-right:
        6px solid transparent;

    border-bottom:
        21px solid #4285f4;

    filter:
        drop-shadow(
            0 1px 2px
            rgba(0,0,0,.15)
        );

    transition:
        transform .12s linear;
}


/* ==================================================
   TRIANGLE CENTER
================================================== */

.heading::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 7px;

    width: 0;

    height: 0;

    transform:
        translateX(-50%);

    border-left:
        2px solid transparent;

    border-right:
        2px solid transparent;

    border-bottom:
        8px solid white;
}


/* ==================================================
   BLUE LOCATION DOT
================================================== */

.dot {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 13px;

    height: 13px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        #4285f4;

    border:
        2px solid white;

    box-shadow:
        0 1px 4px
        rgba(0,0,0,.25);

    z-index: 2;
}


/* ==================================================
   ALTITUDE
================================================== */

.altitude {

    position: absolute;

    top: 18px;

    right: 18px;

    text-align: right;
}


.altitude-label {

    font-size: 9px;

    letter-spacing: .8px;

    color: #9ca3af;
}


.altitude-value {

    margin-top: 2px;

    font-size: 18px;

    font-weight: 600;

    color: #1e3a5f;
}


/* ==================================================
   LOCATION ERROR
================================================== */

#error {

    position: absolute;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: #ffffff;

    text-align: center;
}


.wifi {

    width: 100px;

    height: 100px;

    margin-bottom: 25px;
}


#errorText {

    color:
        #c62828;

    font-size:
        32px;

    font-weight: 600;
}

</style>

</head>


<body>

        "

<!-- Cardinal marks -->

>


    <line

<!-- ==================================================
     MAIN APP
================================================== -->

<div id="app">

<script>

/* ==================================================
   LOCATION
================================================== */


function showLocationError() {

    document.getElementById(
        "error"
    ).style.display = "flex";

}


function updateLocation(position) {

    const coordinates =
        position.coords;


    document.getElementById(
        "latitude"
    ).textContent =

        coordinates.latitude.toFixed(6)
        + "°";


    document.getElementById(
        "longitude"
    ).textContent =

        coordinates.longitude.toFixed(6)
        + "°";


    if (

        coordinates.altitude !== null &&

        Number.isFinite(
            coordinates.altitude
        )

    ) {

        document.getElementById(
            "altitude"
        ).textContent =

            coordinates.altitude.toFixed(1)
            + " m";

    }

    else {

        document.getElementById(
            "altitude"
        ).textContent =
            "--";
    }


    document.getElementById(
        "error"
    ).style.display =
        "none";
}



/* ==================================================
   ASK FOR LOCATION PERMISSION
================================================== */

function startGPS() {


    if (
        !navigator.geolocation
    ) {

        showLocationError();

        return;
    }


    /*
       This first call explicitly causes
       the phone/browser to request
       location permission.
    */

    navigator.geolocation.getCurrentPosition(

        function(position) {

            updateLocation(position);


            /*
               Once permission has been granted,
               continuously monitor the position.
            */

            navigator.geolocation.watchPosition(

                updateLocation,

                function() {

                    showLocationError();

                },

                {

                    enableHighAccuracy:
                        true,

                    maximumAge:
                        1000,

                    timeout:
                        10000

                }

            );

        },


        function() {

            showLocationError();

        },


        {

            enableHighAccuracy:
                true,

            maximumAge:
                0,

            timeout:
                10000

        }

    );

}



/* ==================================================
   COMPASS
================================================== */


function handleCompass(event) {

    let heading;


    /*
       iPhone / iPad
    */

    if (

        event.webkitCompassHeading
        !== undefined

    ) {

        heading =
            event.webkitCompassHeading;

    }


    /*
       Android / other devices
    */

    else if (

        event.alpha !== null

    ) {

        heading =
            360 - event.alpha;

    }


    else {

        return;

    }


    heading =
        (heading + 360) % 360;


    document.getElementById(
        "heading"
    ).style.transform =

        "translateX(-50%) rotate("
        + heading
        + "deg)";
}



/* ==================================================
   ASK FOR SENSOR PERMISSION
================================================== */

function startCompass() {


    /*
       iOS requires explicit permission
       for motion/orientation sensors.
    */

    if (

        typeof DeviceOrientationEvent
        !== "undefined"

        &&

        typeof DeviceOrientationEvent
        .requestPermission
        === "function"

    ) {


        DeviceOrientationEvent
            .requestPermission()

            .then(

                function(permission) {


                    if (

                        permission
                        === "granted"

                    ) {


                        window.addEventListener(

                            "deviceorientation",

                            handleCompass,

                            true

                        );

                    }

                }

            )

            .catch(

                function() {}

            );

    }


    else {


        /*
           Android browsers normally
           don't require this extra prompt.
        */

        window.addEventListener(

            "deviceorientationabsolute",

            handleCompass,

            true

        );


        window.addEventListener(

            "deviceorientation",

            handleCompass,

            true

        );

    }

}



/* ==================================================
   START
================================================== */


/*
   Location starts immediately.
   The phone should show its location
   permission prompt if permission has
   not already been granted.
*/

startGPS();


/*
   Sensor permission is requested
   after the first user interaction.
*/

document.addEventListener(

    "click",

    startCompass,

    {
        once: true
    }

);


document.addEventListener(

    "touchstart",

    startCompass,

    {
        once: true
    }

);

</script>
