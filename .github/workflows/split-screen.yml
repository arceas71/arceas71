name: Build Split Screen APK

on:
  push:
    paths:
      - 'split-screen/**'
      - '.github/workflows/split-screen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: split-screen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SplitScreen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: split-screen-debug-apk
          path: split-screen/SplitScreen.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: split-screen-v${{ github.run_number }}
          name: Split Screen v${{ github.run_number }}
          files: split-screen/SplitScreen.apk
