<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>H.I.D.E.A.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
>

<style>

/* ==================================================
   H.I.D.E.A. COLOUR SYSTEM
================================================== */

:root {

    --background: #D3D3D3;
    --primary: #282828;
    --secondary: #282828;
    --text: #282828;
    --muted: #666666;
    --globe-line: #8f8f8f;
    --border: #aaaaaa;
    --button-background: #D3D3D3;

    --blue: #4285f4;
    --blue-light: #4da9ed;
    --blue-dark: #174f9c;

    --error: #b51f1f;

    --player-color: #4285f4;

    --font-heading:
        "Space Grotesk",
        Arial,
        Helvetica,
        sans-serif;

    --font-mono:
        "JetBrains Mono",
        "Courier New",
        monospace;
}


@media (prefers-color-scheme: dark) {

    :root {

        --background: #282828;
        --primary: #D3D3D3;
        --secondary: #D3D3D3;
        --text: #D3D3D3;
        --muted: #999999;
        --globe-line: #686868;
        --border: #555555;
        --button-background: #282828;

        --blue: #5b9df9;
        --blue-light: #67b5f4;
        --blue-dark: #2865b5;

        --error: #ff5c5c;
    }
}


/* ==================================================
   BASE
================================================== */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

    user-select: none;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        var(--background);

    color:
        var(--text);

    font-family:
        var(--font-heading);

    transition:
        background .25s ease,
        color .25s ease;
}


body {

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}


/* ==================================================
   SPLASH SCREEN
================================================== */

#splash {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        var(--background);

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        splashOut
        .65s
        ease
        4.8s
        forwards;

    transition:
        background .25s ease;
}


.logo {

    width: 72vw;

    max-width: 300px;

    overflow: visible;

    animation:
        logoZoomOut
        .8s
        cubic-bezier(.16,1,.3,1)
        3.1s
        forwards;
}


@keyframes logoZoomOut {

    0% {

        transform:
            scale(1);
    }

    100% {

        transform:
            scale(.72);
    }
}


/* ==================================================
   GLOBE
================================================== */

.globe {

    opacity: 0;

    transform-origin:
        250px 225px;

    animation:

        globeIn
        1s
        cubic-bezier(.16,1,.3,1)
        .15s
        forwards,

        globeFloat
        2.5s
        ease-in-out
        1.2s
        infinite;
}


@keyframes globeIn {

    0% {

        opacity: 0;

        transform:
            scale(.55)
            rotate(-15deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.05)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes globeFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-4px);
    }
}


/* ==================================================
   GLOBE LINES
================================================== */

.globeLines {

    opacity: 0;

    stroke-dasharray: 500;

    animation:
        linesIn
        .8s
        ease
        .65s
        forwards;
}


@keyframes linesIn {

    from {

        opacity: 0;

        stroke-dashoffset:
            500;
    }

    to {

        opacity: 1;

        stroke-dashoffset:
            0;
    }
}


/* ==================================================
   CARDINAL MARKERS
================================================== */

.cardinal {

    opacity: 0;

    transform-origin:
        center;

    animation:
        cardinalIn
        .65s
        cubic-bezier(.16,1,.3,1)
        forwards;

    stroke:
        var(--primary);
}


.cardinal.east {

    animation-delay:
        1.08s;
}


.cardinal.south {

    animation-delay:
        1.21s;
}


.cardinal.west {

    animation-delay:
        1.34s;
}


@keyframes cardinalIn {

    0% {

        opacity: 0;

        transform:
            scale(.3);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.12);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* ==================================================
   NAVIGATION ARROW
================================================== */

.navArrow {

    opacity: 0;

    transform-origin:
        250px 210px;

    animation:

        arrowIn
        .8s
        cubic-bezier(.16,1,.3,1)
        .85s
        forwards,

        arrowFloat
        2.5s
        ease-in-out
        1.5s
        infinite;
}


@keyframes arrowIn {

    0% {

        opacity: 0;

        transform:
            scale(.35)
            rotate(-35deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.07)
            rotate(3deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes arrowFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-5px);
    }
}


/* ==================================================
   H.I.D.E.A. LETTERS
================================================== */

.letter {

    opacity: 0;

    filter:
        blur(7px);

    fill:
        var(--primary);

    animation:
        letterFloatIn
        .9s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


.l1 { animation-delay: 1.45s; }
.l2 { animation-delay: 1.58s; }
.l3 { animation-delay: 1.71s; }
.l4 { animation-delay: 1.84s; }
.l5 { animation-delay: 1.97s; }
.l6 { animation-delay: 2.10s; }
.l7 { animation-delay: 2.23s; }
.l8 { animation-delay: 2.36s; }
.l9 { animation-delay: 2.49s; }


@keyframes letterFloatIn {

    0% {

        opacity: 0;

        filter:
            blur(7px);

        transform:
            translateY(20px)
            scale(.82);
    }

    55% {

        opacity: 1;

        filter:
            blur(1px);

        transform:
            translateY(-4px)
            scale(1.04);
    }

    100% {

        opacity: 1;

        filter:
            blur(0);

        transform:
            translateY(0)
            scale(1);
    }
}


/* ==================================================
   SPLASH EXIT
================================================== */

@keyframes splashOut {

    to {

        opacity: 0;

        visibility: hidden;
    }
}


/* ==================================================
   MAIN APP
================================================== */

#app {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background:
        var(--background);

    opacity: 0;

    animation:
        appIn
        .7s
        ease
        4.85s
        forwards;

    transition:
        background .25s ease;
}


@keyframes appIn {

    to {

        opacity: 1;
    }
}


/* ==================================================
   GRID BACKDROP (default — no network tile fetching,
   just a panning grid that proves you're moving)
================================================== */

#grid {

    position: absolute;

    inset: 0;

    z-index: 0;

    background-color:
        var(--background);

    background-image:
        linear-gradient(
            var(--border) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            var(--border) 1px,
            transparent 1px
        );

    background-size:
        44px 44px;

    background-position:
        0px 0px;

    opacity: .45;

    transition:
        opacity .2s ease;
}


/* ==================================================
   LIVE MAP (optional — real OpenStreetMap tiles,
   only fetched once the user switches it on)
================================================== */

#map {

    position: absolute;

    inset: 0;

    z-index: 0;

    background:
        var(--background);

    display: none;
}


#app.map-mode #map {

    display: block;
}


#app.map-mode #grid {

    display: none;
}


/* mono-tone the tiles so the map matches the
   grayscale H.I.D.E.A. look */
#map .leaflet-tile-pane {

    filter:
        grayscale(1)
        contrast(1.05)
        brightness(1.02);
}


@media (prefers-color-scheme: dark) {

    #map .leaflet-tile-pane {

        filter:
            grayscale(1)
            contrast(1.05)
            brightness(.55)
            invert(1)
            hue-rotate(180deg);
    }
}


/* ==================================================
   MAP TOGGLE BUTTON
================================================== */

.map-toggle {

    position: absolute;

    top:
        calc(
            18px +
            env(safe-area-inset-top)
        );

    left:
        calc(
            18px +
            env(safe-area-inset-left)
        );

    z-index: 3;

    height: 34px;

    padding: 0 14px;

    border-radius: 17px;

    border:
        1px solid
        var(--border);

    background:
        var(--button-background);

    color:
        var(--text);

    font-family:
        var(--font-heading);

    font-size: 11px;

    font-weight: 600;

    letter-spacing: .4px;

    cursor: pointer;
}


#app > *:not(#map):not(#grid) {

    position: absolute;

    z-index: 1;
}


.location-marker,
.coordinates,
.player-name,
.altitude,
.map-toggle {

    z-index: 2;
}


/* ==================================================
   OTHER PLAYERS (rendered as Leaflet markers,
   styled to match the local player's dot/heading)
================================================== */

.other-player {

    position: relative;

    width: 34px;
    height: 34px;

    transform:
        translate(-50%, -50%);
}


.other-player .op-dot {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 11px;
    height: 11px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        var(--op-color, var(--blue));

    border:
        2px solid
        var(--background);

    box-shadow:
        0 1px 4px
        rgba(0,0,0,.22);
}


.other-player .op-name {

    position: absolute;

    left: 50%;

    top: -14px;

    transform:
        translate(-50%, -100%);

    color:
        var(--text);

    font-size: 11px;

    font-weight: 600;

    white-space: nowrap;

    background:
        color-mix(
            in srgb,
            var(--background) 78%,
            transparent
        );

    padding: 1px 5px;

    border-radius: 6px;
}


/* ==================================================
   GAME CODE (join / create a shared session)
================================================== */

.gamecode-row {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 22px;
}


#gameCode {

    width: 176px;

    height: 44px;

    border:
        1px solid
        var(--border);

    border-radius: 11px;

    outline: none;

    background:
        var(--button-background);

    color:
        var(--text);

    text-align: center;

    text-transform: uppercase;

    letter-spacing: 2px;

    font-size: 15px;
}


#newCodeButton {

    height: 44px;

    padding: 0 14px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background:
        var(--button-background);

    color:
        var(--text);

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;
}


.gamecode-hint {

    color:
        var(--muted);

    font-size: 11px;

    margin-top: -14px;

    margin-bottom: 22px;
    text-align: center;
    max-width: 280px;
}


/* ==================================================
   SETUP
================================================== */

#setup {

    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        var(--background);

    transition:
        background .25s ease;
}


.setup-title {

    font-size: 29px;

    font-weight: 600;

    letter-spacing: 1px;

    margin-bottom: 7px;
}


.setup-subtitle {

    color:
        var(--muted);

    font-size: 13px;

    margin-bottom: 25px;
}


#username {

    width: 280px;

    height: 48px;

    border:
        1px solid
        var(--border);

    border-radius: 11px;

    outline: none;

    background:
        var(--button-background);

    color:
        var(--text);

    text-align: center;

    font-size: 16px;

    margin-bottom: 22px;
}


/* ==================================================
   COLOUR CHOOSER
================================================== */

.colors {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    margin-bottom: 25px;
}


.color {

    width: 27px;
    height: 27px;

    padding: 0;

    border-radius: 50%;

    border:
        2px solid
        transparent;

    cursor: pointer;
}


.color.selected {

    border-color:
        var(--text);

    transform:
        scale(1.12);
}


.color1 {
    background: #4285f4;
}

.color2 {
    background: #e53935;
}

.color3 {
    background: #43a047;
}

.color4 {
    background: #8e44ad;
}

.color5 {
    background: #f39c12;
}

.color6 {
    background: #00acc1;
}


.custom-color {

    position: relative;

    width: 27px;
    height: 27px;

    border-radius: 50%;

    border:
        2px solid
        var(--muted);

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        var(--text);

    font-size: 20px;

    cursor: pointer;
}


.custom-color input {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    opacity: 0;

    cursor: pointer;
}


/* ==================================================
   START BUTTON
================================================== */

#startButton {

    width: 280px;

    height: 48px;

    border: none;

    border-radius: 11px;

    background:
        var(--secondary);

    color:
        var(--background);

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;
}


#startButton:active {

    transform:
        scale(.97);
}


/* ==================================================
   COORDINATES
================================================== */

.coordinates {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -92px);

    text-align: center;

    color:
        var(--text);

    font-family:
        var(--font-mono);

    font-size: 13px;

    line-height: 1.5;

    font-weight: 500;

    white-space: nowrap;

    transition:
        color .25s ease;
}


/* ==================================================
   LOCATION MARKER
================================================== */

.location-marker {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 56px;
    height: 56px;

    transform:
        translate(-50%, -50%);
}


/* ==================================================
   ACCURACY CIRCLE
================================================== */

.accuracy {

    position: absolute;

    inset: 0;

    border-radius:
        50%;

    background:
        color-mix(
            in srgb,
            var(--player-color) 6%,
            transparent
        );

    border:
        1px solid
        color-mix(
            in srgb,
            var(--player-color) 15%,
            transparent
        );
}


/* ==================================================
   EXPLORER ARROW
================================================== */

.heading {

    position: absolute;

    left: 50%;

    top: 3px;

    width: 0;
    height: 0;

    transform:
        translateX(-50%);

    transform-origin:
        50% 50%;

    border-left:
        5px solid transparent;

    border-right:
        5px solid transparent;

    border-bottom:
        18px solid
        var(--player-color);

    filter:
        drop-shadow(
            0 1px 2px
            rgba(0,0,0,.15)
        );

    transition:
        transform .12s linear;
}


.heading::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 6px;

    width: 0;
    height: 0;

    transform:
        translateX(-50%);

    border-left:
        1.5px solid transparent;

    border-right:
        1.5px solid transparent;

    border-bottom:
        7px solid
        var(--background);
}


/* ==================================================
   CENTRE DOT
================================================== */

.dot {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 11px;
    height: 11px;

    transform:
        translate(-50%, -50%);

    border-radius:
        50%;

    background:
        var(--player-color);

    border:
        2px solid
        var(--background);

    box-shadow:
        0 1px 4px
        rgba(0,0,0,.22);

    z-index: 2;
}


/* ==================================================
   USERNAME
================================================== */

.player-name {

    position: absolute;

    left: 50%;

    top: calc(50% - 125px);

    transform:
        translate(-50%, -100%);

    color:
        var(--text);

    font-family:
        var(--font-heading);

    font-size: 13px;

    font-weight: 600;

    letter-spacing: .3px;

    white-space: nowrap;

    text-align: center;

    z-index: 10;
}


/* ==================================================
   ALTITUDE
================================================== */

.altitude {

    position: absolute;

    top:
        calc(
            18px +
            env(safe-area-inset-top)
        );

    right:
        calc(
            18px +
            env(safe-area-inset-right)
        );

    text-align:
        right;
}


.altitude-label {

    font-size:
        9px;

    letter-spacing:
        .9px;

    color:
        var(--muted);
}


.altitude-value {

    margin-top:
        2px;

    font-size:
        18px;

    font-weight:
        600;

    color:
        var(--secondary);
}


/* ==================================================
   ERROR SCREEN
================================================== */

#error {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    background:
        var(--background);

    text-align:
        center;

    padding:
        30px;
}


.wifi {

    width:
        96px;

    height:
        96px;

    margin-bottom:
        22px;
}


#errorText {

    color:
        var(--error);

    font-size:
        30px;

    font-weight:
        600;

    margin-bottom:
        26px;
}


.error-buttons {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

    width:
        min(280px, 82vw);
}


.error-button {

    width:
        100%;

    min-height:
        50px;

    padding:
        0 16px;

    border-radius:
        12px;

    border:
        1px solid
        var(--border);

    background:
        var(--button-background);

    color:
        var(--secondary);

    font-size:
        16px;

    font-weight:
        600;

    cursor:
        pointer;
}


.error-button.primary {

    background:
        var(--secondary);

    color:
        var(--background);

    border:
        none;
}


#errorHelp {

    margin-top:
        17px;

    max-width:
        300px;

    color:
        var(--muted);

    font-size:
        12px;

    line-height:
        1.5;
}

</style>


<!-- Leaflet (map tiles) -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase (shared multiplayer positions) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head>


<body>


<!-- ==================================================
     SPLASH SCREEN
================================================== -->

<div id="splash">

<svg
    class="logo"
    viewBox="0 0 500 570"
    xmlns="http://www.w3.org/2000/svg"
>


<!-- GLOBE -->

<g class="globe">

    <circle
        cx="250"
        cy="225"
        r="150"
        fill="var(--background)"
        stroke="var(--primary)"
        stroke-width="7"
    />

</g>


<!-- GLOBE LINES -->

<g
    class="globeLines"
    fill="none"
    stroke="var(--globe-line)"
    stroke-width="2"
>

    <ellipse
        cx="250"
        cy="285"
        rx="105"
        ry="35"
    />

    <ellipse
        cx="250"
        cy="285"
        rx="50"
        ry="35"
    />

    <path
        d="M145 285 Q250 250 355 285"
    />

    <path
        d="M150 300 Q250 330 350 300"
    />

    <path
        d="M250 250 Q215 285 250 320"
    />

    <path
        d="M250 250 Q285 285 250 320"
    />

</g>


<!-- EAST -->

<g
    class="cardinal east"
    stroke-width="5"
    stroke-linecap="round"
>

    <line
        x1="405"
        y1="225"
        x2="387"
        y2="225"
    />

</g>


<!-- SOUTH -->

<g
    class="cardinal south"
    stroke-width="5"
    stroke-linecap="round"
>

    <line
        x1="250"
        y1="380"
        x2="250"
        y2="362"
    />

</g>


<!-- WEST -->

<g
    class="cardinal west"
    stroke-width="5"
    stroke-linecap="round"
>

    <line
        x1="95"
        y1="225"
        x2="113"
        y2="225"
    />

</g>


<!-- NORTH ARROW -->

<g class="navArrow">

    <path
        d="
        M250 125
        L315 300
        L250 260
        L185 300
        Z
        "
        fill="var(--blue-light)"
    />

    <path
        d="
        M250 125
        L315 300
        L250 260
        Z
        "
        fill="var(--blue-dark)"
    />

    <path
        d="
        M250 55
        L261 92
        L250 108
        L239 92
        Z
        "
        fill="var(--primary)"

<!-- H.I.D.E.A. -->

<g
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="62"
    font-weight="500"
>

        class="letter l1"

</svg>

</div>


<!-- ==================================================
     SETUP
================================================== -->

<div id="setup">

    <div class="setup-title">
        H.I.D.E.A.
    </div>

    <div class="setup-subtitle">
        Choose your explorer
    </div>


    <input
        id="username"
        type="text"
        maxlength="16"
        placeholder="Username"
        autocomplete="off"
    >


    <div class="gamecode-row">

        <input
            id="gameCode"
            type="text"
            maxlength="6"
            placeholder="GAME CODE"
            autocomplete="off"
        >

        <button id="newCodeButton">
            NEW
        </button>

    </div>

    <div class="gamecode-hint">
        Share this code with friends so
        they join the same map. Leave it
        as-is to create a fresh game.
    </div>


    <div class="colors">

        <button
            class="color color1 selected"
            data-color="#4285F4">
        </button>

        <button
            class="color color2"
            data-color="#E53935">
        </button>

        <button
            class="color color3"
            data-color="#43A047">
        </button>

        <button
            class="color color4"
            data-color="#8E44AD">
        </button>

        <button
            class="color color5"
            data-color="#F39C12">
        </button>

        <button
            class="color color6"
            data-color="#00ACC1">
        </button>


        <label
            class="custom-color"
            id="customColor">

            +

            <input
                id="colorPicker"
                type="color"
                value="#4285F4"
            >

        </label>

    </div>


    <button id="startButton">
        Continue
    </button>

</div>


<!-- ==================================================
     MAIN APP
================================================== -->

<div id="app">


    <div id="grid"></div>

    <div id="map"></div>

    <button
        class="map-toggle"
        id="mapToggle">
        SHOW MAP
    </button>


    <div class="player-name"
         id="playerName">
    </div>


    <div class="coordinates">

        <div id="latitude">
            --
        </div>

        <div id="longitude">
            --
        </div>

    </div>


    <div class="location-marker">

        <div class="accuracy"></div>

        <div
            class="heading"
            id="heading">
        </div>

        <div class="dot"></div>

    </div>


    <div class="altitude">

        <div class="altitude-label">
            ALT
        </div>

        <div
            class="altitude-value"
            id="altitude">
            --
        </div>

    </div>


</div>


<!-- ==================================================
     LOCATION ERROR
================================================== -->

<div id="error">


<svg
    class="wifi"
    viewBox="0 0 100 100"
    xmlns="http://www.w3.org/2000/svg"
>

    <path
        d="M10 35 Q50 5 90 35"
        fill="none"
        stroke="var(--error)"
        stroke-width="10"
        stroke-linecap="round"
    />

    <path
        d="M23 52 Q50 30 77 52"
        fill="none"
        stroke="var(--error)"
        stroke-width="10"
        stroke-linecap="round"
    />

    <path
        d="M37 69 Q50 58 63 69"
        fill="none"
        stroke="var(--error)"
        stroke-width="10"
        stroke-linecap="round"
    />

    <circle
        cx="50"
        cy="84"
        r="6"
        fill="var(--error)"
    />

    <line
        x1="18"
        y1="15"
        x2="82"
        y2="85"
        stroke="var(--error)"
        stroke-width="9"
        stroke-linecap="round"
    />

</svg>


<div id="errorText">
    Location unavailable
</div>


<div class="error-buttons">

    <button
        class="error-button primary"
        id="allowButton">
        Allow Location
    </button>

    <button
        class="error-button"
        id="settingsButton">
        Open Location Settings
    </button>

</div>


<div id="errorHelp">
    Location permission is required
    for H.I.D.E.A. to determine your
    position.
</div>


</div>


<script>

/* ==================================================
   VARIABLES
================================================== */

let locationWatch = null;

let compassStarted = false;

let lastHeadingDeg = 0;

let selectedColor =
    localStorage.getItem(
        "hidea_color"
    ) || "#4285F4";


/* multiplayer state */

let leafletMap = null;

let mapReady = false;

let mapModeOn = false;

let othersLayer = {};

let db = null;

let playersRef = null;

let myGameCode = "";


/* grid-panning state (dead-reckoning, no network) */

let gridOriginLat = null;

let gridOriginLng = null;

const GRID_PX_PER_METER = 3;


const myUid =
    localStorage.getItem("hidea_uid")
    ||
    (function() {

        const id =
            "p_" +
            Math.random()
                .toString(36)
                .slice(2, 10);

        localStorage.setItem(
            "hidea_uid",
            id
        );

        return id;

    })();


/* ==================================================
   FIREBASE CONFIG
   Replace with YOUR OWN Firebase project's config
   (Firebase console > Project settings > General).
   A free "Spark plan" project is enough.
================================================== */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    appId: "YOUR_APP_ID"

};


try {

    firebase.initializeApp(firebaseConfig);

    db = firebase.database();

}

catch (e) {

    console.warn(
        "Firebase not configured yet — multiplayer disabled.",
        e
    );

}


/* ==================================================
   ELEMENTS
================================================== */

const setup =
    document.getElementById("setup");

const app =
    document.getElementById("app");

const error =
    document.getElementById("error");

const username =
    document.getElementById("username");

const playerName =
    document.getElementById("playerName");

const heading =
    document.getElementById("heading");

const gameCodeInput =
    document.getElementById("gameCode");

const newCodeButton =
    document.getElementById("newCodeButton");

const mapToggle =
    document.getElementById("mapToggle");


/* ==================================================
   LOAD SAVED USERNAME / GAME CODE
================================================== */

username.value =
    localStorage.getItem(
        "hidea_username"
    ) || "";


gameCodeInput.value =
    localStorage.getItem(
        "hidea_gamecode"
    ) || makeGameCode();


mapModeOn =
    localStorage.getItem(
        "hidea_mapmode"
    ) === "1";

app.classList.toggle(
    "map-mode",
    mapModeOn
);

mapToggle.textContent =
    mapModeOn ? "HIDE MAP" : "SHOW MAP";


/* ==================================================
   GAME CODE HELPERS
================================================== */

function makeGameCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 5; i++) {

        code +=
            chars[
                Math.floor(
                    Math.random() * chars.length
                )
            ];
    }

    return code;
}


newCodeButton.addEventListener(
    "click",
    function() {

        gameCodeInput.value =
            makeGameCode();

    }
);


/* ==================================================
   APPLY COLOUR
================================================== */

function applyColor() {

    document.documentElement
        .style
        .setProperty(
            "--player-color",
            selectedColor
        );


    document
        .querySelectorAll(".color")
        .forEach(
            button => {

                button.classList.toggle(
                    "selected",
                    button.dataset.color
                    .toUpperCase()
                    ===
                    selectedColor.toUpperCase()
                );

            }
        );


    document
        .getElementById("customColor")
        .style
        .borderColor =
            selectedColor;
}


applyColor();


/* ==================================================
   PRESET COLOURS
================================================== */

document
    .querySelectorAll(".color")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    selectedColor =
                        this.dataset.color;

                    localStorage.setItem(
                        "hidea_color",
                        selectedColor
                    );

                    applyColor();

                }
            );

        }
    );


/* ==================================================
   CUSTOM COLOUR
================================================== */

document
    .getElementById("colorPicker")
    .addEventListener(
        "input",
        function() {

            selectedColor =
                this.value.toUpperCase();

            localStorage.setItem(
                "hidea_color",
                selectedColor
            );

            applyColor();

        }
    );


/* ==================================================
   START
================================================== */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        function() {

            const name =
                username.value.trim();


            if (!name) {

                username.focus();

                return;
            }


            localStorage.setItem(
                "hidea_username",
                name
            );


            myGameCode =
                (
                    gameCodeInput.value.trim()
                    ||
                    makeGameCode()
                )
                .toUpperCase();

            localStorage.setItem(
                "hidea_gamecode",
                myGameCode
            );


            playerName.textContent =
                name;


            setup.style.display =
                "none";


            joinGame();


            requestLocation();

        }
    );


/* ==================================================
   SHOW ERROR
================================================== */

function showLocationError() {

    error.style.display =
        "flex";
}


/* ==================================================
   HIDE ERROR
================================================== */

function hideLocationError() {

    error.style.display =
        "none";
}


/* ==================================================
   UPDATE LOCATION
================================================== */

function updateLocation(position) {

    const c =
        position.coords;


    document.getElementById(
        "latitude"
    ).textContent =

        c.latitude.toFixed(6)
        + "°";


    document.getElementById(
        "longitude"
    ).textContent =

        c.longitude.toFixed(6)
        + "°";


    if (
        c.altitude !== null
        &&
        Number.isFinite(
            c.altitude
        )
    ) {

        document.getElementById(
            "altitude"
        ).textContent =

            c.altitude.toFixed(1)
            + " m";

    }

    else {

        document.getElementById(
            "altitude"
        ).textContent =
            "--";

    }


    hideLocationError();


    /* ---- move the backdrop so it looks like the
       world scrolls under you. Grid mode needs no
       network fetch at all; map mode (opt-in) uses
       real tiles. ---- */

    if (mapModeOn) {

        if (!mapReady) {

            initMap(c.latitude, c.longitude);

        }

        else {

            leafletMap.panTo(
                [c.latitude, c.longitude],
                { animate: true, duration: .4 }
            );
        }
    }

    else {

        panGrid(c.latitude, c.longitude);
    }


    /* ---- push my position to the shared game ---- */

    sendMyPosition(c);
}


/* ==================================================
   GRID BACKDROP (default, no tile fetching)
================================================== */

function panGrid(lat, lng) {

    const grid =
        document.getElementById("grid");

    if (!grid) {

        return;
    }

    if (gridOriginLat === null) {

        gridOriginLat = lat;

        gridOriginLng = lng;

        return;
    }

    const dx =
        metersEastWest(
            gridOriginLat,
            gridOriginLng,
            lng
        );

    const dy =
        metersNorthSouth(
            gridOriginLat,
            lat
        );

    /* moving north/east should scroll the grid
       south/west beneath the fixed centre dot */
    const px =
        -dx * GRID_PX_PER_METER;

    const py =
        dy * GRID_PX_PER_METER;

    grid.style.backgroundPosition =
        px + "px " + py + "px";
}


function metersEastWest(lat, lng1, lng2) {

    const R = 6371000;

    const rad =
        lat * Math.PI / 180;

    return (
        (lng2 - lng1) * Math.PI / 180
    ) * R * Math.cos(rad);
}


function metersNorthSouth(lat1, lat2) {

    const R = 6371000;

    return (
        (lat2 - lat1) * Math.PI / 180
    ) * R;
}


/* ==================================================
   MAP TOGGLE (turns real tile fetching on/off)
================================================== */

function setMapMode(on) {

    mapModeOn = on;

    app.classList.toggle(
        "map-mode",
        on
    );

    mapToggle.textContent =
        on ? "HIDE MAP" : "SHOW MAP";

    localStorage.setItem(
        "hidea_mapmode",
        on ? "1" : "0"
    );

    if (on && !mapReady) {

        const lat =
            gridOriginLat;

        const lng =
            gridOriginLng;

        if (lat !== null) {

            initMap(lat, lng);
        }
    }
}


mapToggle.addEventListener(
    "click",
    function() {

        setMapMode(!mapModeOn);

    }
);


/* ==================================================
   LIVE MAP INIT
================================================== */

function initMap(lat, lng) {

    if (
        typeof L === "undefined"
        ||
        !document.getElementById("map")
    ) {

        return;
    }

    leafletMap = L.map(
        "map",
        {
            zoomControl: false,
            attributionControl: false,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            touchZoom: false,
            boxZoom: false,
            keyboard: false
        }
    ).setView([lat, lng], 18);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        { maxZoom: 19 }
    ).addTo(leafletMap);

    mapReady = true;
}


/* ==================================================
   MULTIPLAYER — JOIN / SEND / RECEIVE
================================================== */

function joinGame() {

    if (!db || !myGameCode) {

        return;
    }

    playersRef =
        db.ref(
            "games/" + myGameCode + "/players"
        );

    const myRef =
        playersRef.child(myUid);

    /* remove me automatically if I close the tab */
    myRef.onDisconnect().remove();

    /* listen for everyone else's positions */
    playersRef.on(
        "value",
        function(snapshot) {

            renderOtherPlayers(
                snapshot.val() || {}
            );
        }
    );
}


function sendMyPosition(coords) {

    if (!db || !myGameCode) {

        return;
    }

    db.ref(
        "games/" + myGameCode +
        "/players/" + myUid
    ).set({

        name: playerName.textContent,
        color: selectedColor,
        lat: coords.latitude,
        lng: coords.longitude,
        heading: lastHeadingDeg,
        updatedAt:
            firebase.database.ServerValue
                .TIMESTAMP

    });
}


function renderOtherPlayers(players) {

    if (!mapReady) {

        return;
    }

    const staleAfter = 30000; // 30s
    const now = Date.now();
    const seen = {};

    Object.keys(players).forEach(
        function(uid) {

            if (uid === myUid) {

                return;
            }

            const p = players[uid];

            if (
                !p ||
                typeof p.lat !== "number" ||
                typeof p.lng !== "number"
            ) {

                return;
            }

            if (
                p.updatedAt &&
                (now - p.updatedAt) > staleAfter
            ) {

                return;
            }

            seen[uid] = true;

            const html =
                '<div class="other-player" style="--op-color:' +
                (p.color || "#4285f4") +
                '"><div class="op-name">' +
                escapeHtml(p.name || "Explorer") +
                '</div><div class="op-dot"></div></div>';

            if (othersLayer[uid]) {

                othersLayer[uid].setLatLng(
                    [p.lat, p.lng]
                );

                othersLayer[uid]
                    .setIcon(
                        L.divIcon({
                            html: html,
                            className: "",
                            iconSize: [34, 34]
                        })
                    );

            }

            else {

                othersLayer[uid] =
                    L.marker(
                        [p.lat, p.lng],
                        {
                            icon: L.divIcon({
                                html: html,
                                className: "",
                                iconSize: [34, 34]
                            })
                        }
                    ).addTo(leafletMap);
            }
        }
    );

    /* drop markers for players who left / went stale */
    Object.keys(othersLayer).forEach(
        function(uid) {

            if (!seen[uid]) {

                leafletMap.removeLayer(
                    othersLayer[uid]
                );

                delete othersLayer[uid];
            }
        }
    );
}


function escapeHtml(str) {

    const div =
        document.createElement("div");

    div.textContent = str;

    return div.innerHTML;
}


/* ==================================================
   GPS WATCH
================================================== */

function startLocationWatch() {

    if (
        locationWatch !== null
    ) {

        navigator.geolocation
            .clearWatch(
                locationWatch
            );

    }


    locationWatch =
        navigator.geolocation
            .watchPosition(

                updateLocation,

                function() {

                    showLocationError();

                },

                {

                    enableHighAccuracy:
                        true,

                    maximumAge:
                        1000,

                    timeout:
                        15000

                }

            );
}


/* ==================================================
   REQUEST LOCATION
================================================== */

function requestLocation() {

    if (
        !navigator.geolocation
    ) {

        showLocationError();

        return;
    }


    navigator.geolocation
        .getCurrentPosition(

            function(position) {

                updateLocation(
                    position
                );

                startLocationWatch();

                startCompass();

            },

            function() {

                showLocationError();

            },

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    0,

                timeout:
                    15000

            }

        );
}


/* ==================================================
   OPEN ANDROID LOCATION SETTINGS
================================================== */

function openLocationSettings() {

    const intent =
        "intent://settings/location" +
        "#Intent;" +
        "scheme=android-app;" +
        "package=com.android.settings;" +
        "end";


    try {

        window.location.href =
            intent;

    }

    catch (error) {

        requestLocation();

    }
}


/* ==================================================
   COMPASS
================================================== */

function handleCompass(event) {

    let direction;


    if (
        event.webkitCompassHeading
        !== undefined
    ) {

        direction =
            event.webkitCompassHeading;

    }

    else if (
        event.alpha !== null
    ) {

        direction =
            360 - event.alpha;

    }

    else {

        return;

    }


    direction =
        (direction + 360) % 360;


    lastHeadingDeg = direction;


    heading.style.transform =

        "translateX(-50%) rotate("
        +
        direction
        +
        "deg)";
}


/* ==================================================
   START COMPASS
================================================== */

function startCompass() {

    if (
        compassStarted
    ) {

        return;
    }


    compassStarted = true;


    if (

        typeof DeviceOrientationEvent
        !== "undefined"

        &&

        typeof DeviceOrientationEvent
            .requestPermission
        === "function"

    ) {

        DeviceOrientationEvent
            .requestPermission()
            .then(

                function(permission) {

                    if (
                        permission ===
                        "granted"
                    ) {

                        window
                            .addEventListener(
                                "deviceorientation",
                                handleCompass,
                                true
                            );

                    }

                }

            )
            .catch(
                function() {}
            );

    }

    else {

        window
            .addEventListener(
                "deviceorientationabsolute",
                handleCompass,
                true
            );


        window
            .addEventListener(
                "deviceorientation",
                handleCompass,
                true
            );

    }
}


/* ==================================================
   ALLOW LOCATION BUTTON
================================================== */

document
    .getElementById("allowButton")
    .addEventListener(
        "click",
        function() {

            requestLocation();

        }
    );


/* ==================================================
   SETTINGS BUTTON
================================================== */

document
    .getElementById("settingsButton")
    .addEventListener(
        "click",
        function() {

            openLocationSettings();

        }
    );


/* ==================================================
   START COMPASS ON TOUCH
================================================== */

document.addEventListener(

    "touchstart",

    function() {

        startCompass();

    },

    {

        once: true,

        passive: true

    }

);

</script>
