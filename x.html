function add(i){(D[i].c||[]).forEach((_,j)=>{const k=i+'.'+j;if(!S.box[k]){S.box[k]=1;S.due[k]=Math.max(today,0)+1}});save()}
function head(){const d=Object.keys(S.done).length,left=Math.max(0,Math.round((new Date(2026,11,13)-new Date(new Date().toDateString()))/864e5));
$('#meta').textContent=d+' of '+N+' days done · '+left+' days until 13 Dec · aim for 10–30 min a day';$('#pb').style.width=100*d/N+'%';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view))}
function render(){head();const a=$('#app');a.innerHTML=view=='today'?vToday():view=='rev'?vRev():vPlan()}
function vToday(){const d=D[cur],late=cur<today&&!S.done[cur];
let h='<div class="row"><button class="btn" onclick="go(-1)">‹</button><div style="flex:1"><div class="tag">Day '+(cur+1)+' of '+N+' · '+dl(cur)+(S.done[cur]?' · <span class="done">done ✓</span>':'')+'</div><h2>'+d.t+'</h2></div><button class="btn" onclick="go(1)">›</button></div>';
if(late)h+='<div class="box">You are behind plan. Do this day now; do not double up. Skipping a day costs less than a rushed day.</div>';
if(quiz)return h+vQuiz();
if(d.mix)return h+'<div class="box">Mixed questions from earlier days, with no new material. This is where retention is built: answer before you read the options carefully.<br><br><button class="btn pri" onclick="startQ()">Start quiz ('+d.n+' questions)</button></div>';
h+='<div class="box"><b>Step 1 · Recall (5–10 min).</b> Read each prompt, say or write the answer, then open it. Mistakes are useful.';
d.c.forEach(c=>h+='<details><summary>'+c[0]+'</summary><p>'+c[1]+'</p></details>');
h+='<div style="margin-top:8px"><button class="btn" onclick="add('+cur+');this.textContent=\'Added to review ✓\'">Add these cards to my review deck</button></div></div>';
return h+'<div class="box"><b>Step 2 · Quiz (3–5 min).</b> '+d.q.length+' questions.<br><br><button class="btn pri" onclick="startQ()">Start quiz</button></div>'}
function go(x){cur=Math.min(N-1,Math.max(0,cur+x));quiz=null;render()}
function startQ(){const d=D[cur];let qs;
if(d.mix){qs=[];d.mix.forEach(i=>D[i].q.forEach(q=>qs.push(q)));qs.sort(()=>Math.random()-.5);qs=qs.slice(0,d.n)}else qs=d.q.slice();
quiz={qs,i:0,s:0,a:-1};render()}
function vQuiz(){const q=quiz.qs[quiz.i];
if(!q)return'<div class="box"><h2>Score: '+quiz.s+' / '+quiz.qs.length+'</h2><p>'+(quiz.s==quiz.qs.length?'Perfect. Come back tomorrow for the review cards.':'Retake it tomorrow after reviewing the cards. Retrieval after a gap is what makes it stick.')+'</p><button class="btn pri" onclick="quiz=null;cur=Math.min(N-1,cur+1);render()">Next day</button> <button class="btn" onclick="startQ()">Retry</button></div>';
let h='<div class="box"><div class="tag">Question '+(quiz.i+1)+' / '+quiz.qs.length+'</div><div class="big">'+q[0]+'</div>';
q[1].forEach((o,k)=>{let c='opt';if(quiz.a>=0){if(k==q[2])c+=' ok';else if(k==quiz.a)c+=' no'}h+='<button class="'+c+'" '+(quiz.a>=0?'disabled':'onclick="pick('+k+')"')+'>'+o+'</button>'});
if(quiz.a>=0)h+='<div class="why">'+q[3]+'</div><button class="btn pri" onclick="quiz.i++;quiz.a=-1;render()">'+(quiz.i+1<quiz.qs.length?'Next':'Finish')+'</button>';
return h+'</div>'}
function pick(k){const q=quiz.qs[quiz.i];quiz.a=k;if(k==q[2])quiz.s++;
if(quiz.i+1>=quiz.qs.length){S.done[cur]=1;add(cur)}save();render()}
function dueIds(){return Object.keys(S.box).filter(k=>S.due[k]<=today)}
function vRev(){const tot=Object.keys(S.box).length;
if(!rq)rq=dueIds().sort(()=>Math.random()-.5);
if(!tot)return'<div class="box">Your review deck is empty. Finish a day, or press "Add these cards", and cards will show up here on a schedule (1, 2, 4, 7, 12 days).</div>';
if(!rq.length)return'<div class="box"><h2>Nothing due 🎉</h2>'+tot+' cards in your deck. Cards you miss come back tomorrow; cards you get right come back later.</div>';
const k=rq[0],[i,j]=k.split('.'),c=D[i].c[j];
return'<div class="box"><div class="tag">'+rq.length+' left · from Day '+(+i+1)+'</div><div class="big">'+c[0]+'</div><details><summary>Show answer</summary><p>'+c[1]+'</p><div class="row" style="margin-top:10px"><button class="btn" onclick="rate(0)">Missed it</button><button class="btn pri" onclick="rate(1)">Got it</button></div></details></div>'}
function rate(g){const k=rq.shift();if(g){S.box[k]=Math.min(5,S.box[k]+1);S.due[k]=today+INT[S.box[k]]}else{S.box[k]=1;S.due[k]=today+1;}save();render()}
function vPlan(){let h='<div class="box">';for(let i=0;i<N;i++)h+='<div class="pl'+(i==cur?' cur':'')+'" onclick="cur='+i+';view=\'today\';quiz=null;render()"><span>'+(i+1)+'. '+D[i].t+'</span><span class="tag">'+dl(i)+(S.done[i]?' <span class="done">✓</span>':i<today?' missed':'')+'</span></div>';
return h+'</div><div class="box tag">Syllabus covered: ODEs (first/second/higher order, systems, stability), Fourier series & transforms, Laplace & transfer functions, wave/heat/Laplace PDEs. Skipped: long derivations, MATLAB work, case studies. Add those from Kreyszig after Dec 13 if time allows.</div><button class="btn" onclick="if(confirm(\'Erase all progress?\')){S={done:{},box:{},due:{}};save();cur=0;rq=null;render()}">Reset progress</button>'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;quiz=null;rq=null;render()});
render();
</script></body></html>
