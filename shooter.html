<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberStrike 2D Shooter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0d0f18;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #gameCanvas {
      background: radial-gradient(circle at center, #151828 0%, #08090f 100%);
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.15);
      border-radius: 4px;
      cursor: crosshair;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
// --- CANVAS & SETUP ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = 1024;
const HEIGHT = 720;
canvas.width = WIDTH;
canvas.height = HEIGHT;

// --- AUDIO SYNTHESIZER (Web Audio API) ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'shoot') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(450, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'hit') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
    osc.start(now);
    osc.stop(now + 0.08);
  } else if (type === 'explode') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(100, now);
    osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'powerup') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
    osc.start(now);
    osc.stop(now + 0.25);
  }
}

// --- INPUT TRACKING ---
const keys = {};
const mouse = { x: WIDTH / 2, y: HEIGHT / 2, down: false };

window.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (gameState === 'START' || gameState === 'GAMEOVER') {
    if (e.key === ' ' || e.key === 'Enter') startGame();
  }
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    mouse.down = true;
    if (gameState === 'START' || gameState === 'GAMEOVER') {
      startGame();
    }
  }
});
canvas.addEventListener('mouseup', (e) => {
  if (e.button === 0) mouse.down = false;
});

// --- GAME STATE & VARIABLES ---
let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
let score = 0;
let highScore = parseInt(localStorage.getItem('cyber_highscore') || '0', 10);
let wave = 1;
let waveTimer = 0;
let shakeTime = 0;
let shakeIntensity = 0;

function screenShake(intensity, duration) {
  shakeIntensity = intensity;
  shakeTime = duration;
}

// --- CLASSES ---

class Player {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 18;
    this.speed = 4.2;
    this.hp = 100;
    this.maxHp = 100;
    this.angle = 0;
    this.fireCooldown = 0;
    this.fireRate = 12; // lower is faster
    this.weaponType = 'NORMAL'; // 'NORMAL', 'RAPID', 'SPREAD'
    this.weaponTimer = 0;
  }

  update() {
    let dx = 0;
    let dy = 0;

    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    // Normalize diagonal movement
    if (dx !== 0 && dy !== 0) {
      dx *= 0.7071;
      dy *= 0.7071;
    }

    this.x += dx * this.speed;
    this.y += dy * this.speed;

    // Boundaries
    this.x = Math.max(this.radius, Math.min(WIDTH - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(HEIGHT - this.radius, this.y));

    // Aim toward mouse
    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

    // Powerup expiry
    if (this.weaponType !== 'NORMAL') {
      this.weaponTimer--;
      if (this.weaponTimer <= 0) {
        this.weaponType = 'NORMAL';
        this.fireRate = 12;
      }
    }

    // Firing
    if (this.fireCooldown > 0) this.fireCooldown--;
    if (mouse.down && this.fireCooldown <= 0) {
      this.shoot();
      this.fireCooldown = this.fireRate;
    }
  }

  shoot() {
    initAudio();
    playSound('shoot');

    const spawnDist = this.radius + 6;
    const startX = this.x + Math.cos(this.angle) * spawnDist;
    const startY = this.y + Math.sin(this.angle) * spawnDist;

    if (this.weaponType === 'SPREAD') {
      const spreadAngles = [-0.22, -0.1, 0, 0.1, 0.22];
      spreadAngles.forEach(offset => {
        bullets.push(new Bullet(startX, startY, this.angle + offset, 11, 15, '#ffdf00'));
      });
      screenShake(2, 6);
    } else if (this.weaponType === 'RAPID') {
      bullets.push(new Bullet(startX, startY, this.angle + (Math.random() - 0.5) * 0.08, 14, 18, '#ff3366'));
      screenShake(1.5, 4);
    } else {
      bullets.push(new Bullet(startX, startY, this.angle, 12, 25, '#00e5ff'));
      screenShake(1, 4);
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // Glow effect
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#00e5ff';

    // Body
    ctx.fillStyle = '#102a45';
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Weapon barrel
    ctx.fillStyle = '#00e5ff';
    ctx.fillRect(8, -4, 14, 8);

    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, angle, speed, damage, color) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.radius = 4;
    this.damage = damage;
    this.color = color;
    this.life = 75;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }

  draw() {
    ctx.save();
    ctx.shadowBlur = 8;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Enemy {
  constructor(type, x, y) {
    this.type = type;
    this.x = x;
    this.y = y;

    if (type === 'FAST') {
      this.radius = 12;
      this.speed = 3.6;
      this.hp = 25;
      this.maxHp = 25;
      this.color = '#ff9100';
      this.scoreVal = 60;
    } else if (type === 'TANK') {
      this.radius = 26;
      this.speed = 1.3;
      this.hp = 160;
      this.maxHp = 160;
      this.color = '#ff1744';
      this.scoreVal = 150;
    } else {
      // STANDARD
      this.radius = 16;
      this.speed = 2.4;
      this.hp = 50;
      this.maxHp = 50;
      this.color = '#76ff03';
      this.scoreVal = 100;
    }
  }

  update() {
    const angle = Math.atan2(player.y - this.y, player.x - this.x);
    this.x += Math.cos(angle) * this.speed;
    this.y += Math.sin(angle) * this.speed;

    // Contact with player
    const dist = Math.hypot(player.x - this.x, player.y - this.y);
    if (dist < player.radius + this.radius) {
      player.hp -= (this.type === 'TANK' ? 0.8 : 0.4);
      screenShake(3, 4);
      playSound('hit');
      if (player.hp <= 0) gameOver();
    }
  }

  draw() {
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.fillStyle = '#1c2128';
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Health indicator bar
    if (this.hp < this.maxHp) {
      const barW = this.radius * 2;
      const barH = 4;
      const hpPercent = Math.max(0, this.hp / this.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(this.x - this.radius, this.y - this.radius - 8, barW, barH);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.radius, this.y - this.radius - 8, barW * hpPercent, barH);
    }
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4.5 + 1;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = color;
    this.life = 25 + Math.random() * 15;
    this.maxLife = this.life;
    this.size = Math.random() * 3 + 1.5;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.94;
    this.vy *= 0.94;
    this.life--;
  }

  draw() {
    const alpha = Math.max(0, this.life / this.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class PowerUp {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 'HEALTH', 'RAPID', 'SPREAD'
    this.radius = 12;
    this.life = 600; // 10 seconds before blinking out
  }

  draw() {
    ctx.save();
    ctx.lineWidth = 2;
    if (this.type === 'HEALTH') {
      ctx.strokeStyle = '#00ff66';
      ctx.fillStyle = '#00ff66';
    } else if (this.type === 'RAPID') {
      ctx.strokeStyle = '#ff3366';
      ctx.fillStyle = '#ff3366';
    } else {
      ctx.strokeStyle = '#ffdf00';
      ctx.fillStyle = '#ffdf00';
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.type[0], this.x, this.y);
    ctx.restore();
  }
}

class FloatingText {
  constructor(x, y, text, color) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.life = 35;
  }

  update() {
    this.y -= 0.8;
    this.life--;
  }

  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life / 35);
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = this.color;
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

// --- GAME COLLECTIONS ---
let player;
let bullets = [];
let enemies = [];
let particles = [];
let powerups = [];
let floatingTexts = [];
let spawnInterval = 90;
let spawnTimer = 0;

function spawnEnemy() {
  let x, y;
  // Pick an edge off-screen
  if (Math.random() < 0.5) {
    x = Math.random() < 0.5 ? -30 : WIDTH + 30;
    y = Math.random() * HEIGHT;
  } else {
    x = Math.random() * WIDTH;
    y = Math.random() < 0.5 ? -30 : HEIGHT + 30;
  }

  const roll = Math.random();
  let type = 'STANDARD';
  if (roll > 0.82) type = 'TANK';
  else if (roll > 0.55) type = 'FAST';

  enemies.push(new Enemy(type, x, y));
}

function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function startGame() {
  initAudio();
  player = new Player(WIDTH / 2, HEIGHT / 2);
  bullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  floatingTexts = [];
  score = 0;
  wave = 1;
  waveTimer = 0;
  spawnInterval = 90;
  gameState = 'PLAYING';
}

function gameOver() {
  gameState = 'GAMEOVER';
  playSound('explode');
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('cyber_highscore', highScore.toString());
  }
}

// --- UPDATE & RENDER LOOP ---

function update() {
  if (gameState !== 'PLAYING') return;

  // Wave & Spawning
  waveTimer++;
  if (waveTimer % 600 === 0) { // Every 10 seconds, increase wave & difficulty
    wave++;
    spawnInterval = Math.max(25, 90 - wave * 7);
    floatingTexts.push(new FloatingText(WIDTH / 2 - 40, HEIGHT / 2, `WAVE ${wave}`, '#00e5ff'));
  }

  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnEnemy();
    spawnTimer = 0;
  }

  player.update();

  // Update Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.update();
    if (b.life <= 0 || b.x < 0 || b.x > WIDTH || b.y < 0 || b.y > HEIGHT) {
      bullets.splice(i, 1);
    }
  }

  // Update Enemies & Bullet Collisions
  for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
    const enemy = enemies[eIdx];
    enemy.update();

    for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
      const b = bullets[bIdx];
      const dist = Math.hypot(b.x - enemy.x, b.y - enemy.y);

      if (dist < enemy.radius + b.radius) {
        enemy.hp -= b.damage;
        bullets.splice(bIdx, 1);
        spawnParticles(b.x, b.y, b.color, 4);
        playSound('hit');

        if (enemy.hp <= 0) {
          playSound('explode');
          screenShake(4, 8);
          score += enemy.scoreVal;
          spawnParticles(enemy.x, enemy.y, enemy.color, 20);
          floatingTexts.push(new FloatingText(enemy.x, enemy.y, `+${enemy.scoreVal}`, '#fff'));

          // Drop powerups (15% chance)
          if (Math.random() < 0.15) {
            const types = ['HEALTH', 'RAPID', 'SPREAD'];
            const pType = types[Math.floor(Math.random() * types.length)];
            powerups.push(new PowerUp(enemy.x, enemy.y, pType));
          }

          enemies.splice(eIdx, 1);
          break;
        }
      }
    }
  }

  // Powerups pickup
  for (let pIdx = powerups.length - 1; pIdx >= 0; pIdx--) {
    const p = powerups[pIdx];
    p.life--;
    if (p.life <= 0) {
      powerups.splice(pIdx, 1);
      continue;
    }

    const dist = Math.hypot(player.x - p.x, player.y - p.y);
    if (dist < player.radius + p.radius) {
      playSound('powerup');
      if (p.type === 'HEALTH') {
        player.hp = Math.min(player.maxHp, player.hp + 35);
        floatingTexts.push(new FloatingText(player.x, player.y - 15, '+HP', '#00ff66'));
      } else if (p.type === 'RAPID') {
        player.weaponType = 'RAPID';
        player.fireRate = 5;
        player.weaponTimer = 450; // 7.5s
        floatingTexts.push(new FloatingText(player.x, player.y - 15, 'RAPID FIRE!', '#ff3366'));
      } else if (p.type === 'SPREAD') {
        player.weaponType = 'SPREAD';
        player.fireRate = 18;
        player.weaponTimer = 450;
        floatingTexts.push(new FloatingText(player.x, player.y - 15, 'SPREAD SHOT!', '#ffdf00'));
      }
      powerups.splice(pIdx, 1);
    }
  }

  // Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Update Floating Texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].update();
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawHUD() {
  ctx.save();
  // Health Bar
  ctx.fillStyle = 'rgba(15, 20, 30, 0.7)';
  ctx.fillRect(20, 20, 204, 20);
  const hpWidth = Math.max(0, (player.hp / player.maxHp) * 200);
  ctx.fillStyle = player.hp > 30 ? '#00e5ff' : '#ff1744';
  ctx.fillRect(22, 22, hpWidth, 16);

  ctx.strokeStyle = '#334155';
  ctx.strokeRect(20, 20, 204, 20);

  ctx.font = '12px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(`HP: ${Math.ceil(player.hp)} / ${player.maxHp}`, 26, 35);

  // Score & Wave
  ctx.font = '16px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`SCORE: ${score}`, WIDTH - 20, 35);
  ctx.fillText(`HIGH: ${highScore}`, WIDTH - 20, 55);
  ctx.fillText(`WAVE: ${wave}`, WIDTH - 20, 75);

  // Weapon Status
  if (player.weaponType !== 'NORMAL') {
    ctx.textAlign = 'left';
    ctx.fillStyle = player.weaponType === 'RAPID' ? '#ff3366' : '#ffdf00';
    const remainingSec = (player.weaponTimer / 60).toFixed(1);
    ctx.fillText(`${player.weaponType} [${remainingSec}s]`, 20, 60);
  }
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  ctx.save();
  // Apply Screen Shake
  if (shakeTime > 0) {
    const offsetX = (Math.random() - 0.5) * shakeIntensity;
    const offsetY = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(offsetX, offsetY);
    shakeTime--;
  }

  // Subtle Background Grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = 0; x < WIDTH; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, HEIGHT);
    ctx.stroke();
  }
  for (let y = 0; y < HEIGHT; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(WIDTH, y);
    ctx.stroke();
  }

  if (gameState === 'PLAYING') {
    powerups.forEach(p => p.draw());
    bullets.forEach(b => b.draw());
    enemies.forEach(e => e.draw());
    player.draw();
    particles.forEach(p => p.draw());
    floatingTexts.forEach(t => t.draw());
    drawHUD();
  } else if (gameState === 'START') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText('CYBERSTRIKE 2D', WIDTH / 2, HEIGHT / 2 - 60);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('WASD / ARROWS : Move', WIDTH / 2, HEIGHT / 2);
    ctx.fillText('MOUSE : Aim & Shoot', WIDTH / 2, HEIGHT / 2 + 25);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('CLICK OR PRESS SPACE TO START', WIDTH / 2, HEIGHT / 2 + 90);
  } else if (gameState === 'GAMEOVER') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff1744';
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText('SYSTEM COMPROMISED', WIDTH / 2, HEIGHT / 2 - 60);

    ctx.font = '20px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`FINAL SCORE: ${score}`, WIDTH / 2, HEIGHT / 2);
    ctx.fillText(`BEST SCORE: ${highScore}`, WIDTH / 2, HEIGHT / 2 + 30);

    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('CLICK OR PRESS SPACE TO RETRY', WIDTH / 2, HEIGHT / 2 + 90);
  }

  ctx.restore();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// Start Main Loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
