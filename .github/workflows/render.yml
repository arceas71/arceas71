name: Render Video Short

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy scipy opencv-python-headless matplotlib

      - name: Run script
        run: |
          python life_game.py

      - name: Transcode to H.264 MP4
        run: |
          # If your script outputs a raw mp4 or video, this converts it to playable web format
          # If your life_game.py already produces 'final_chaos.mp4', you can adjust the filenames below
          if [ -f circle_escape.mp4 ]; then
            ffmpeg -y -i circle_escape.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart final_video.mp4
          elif [ -f short_chaos.mp4 ]; then
            ffmpeg -y -i short_chaos.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart final_video.mp4
          fi

      - name: Publish Direct Release (No Zips)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          name: "Latest Render"
          files: |
            *.mp4
