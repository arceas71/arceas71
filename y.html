<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.</title>
<style>html,body{margin:0;height:100%;background:#000}</style>
</head>
<body>
<script>
(function () {
  // Topic comes from the URL hash (y.html#TOPIC) and is remembered locally.
  var topic = decodeURIComponent(location.hash.slice(1));
  try {
    if (topic) localStorage.setItem('nf_topic', topic);
    else topic = localStorage.getItem('nf_topic') || '';
  } catch (e) {}

  var es = null;

  // The tab title is the only status indicator (the page itself stays blank).
  function status() {
    var perm = ('Notification' in window) ? Notification.permission : 'denied';
    if (!topic) document.title = 'click: set topic';
    else if (perm === 'default') document.title = 'click: allow';
    else if (perm === 'denied') document.title = 'blocked';
    else document.title = 'on';
  }

  function show(title, body) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try { new Notification(title || 'Instagram', { body: body || '' }); } catch (e) {}
  }

  function connect() {
    if (!topic) return;
    if (es) es.close();
    es = new EventSource('https://ntfy.sh/' + encodeURIComponent(topic) + '/sse');
    es.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.event !== 'message') return;
      show(m.title, m.message);
    };
  }

  // Browsers only allow the permission prompt after a click, so click once anywhere.
  document.addEventListener('click', function () {
    if (!topic) {
      var t = prompt('Topic?');
      if (t) {
        topic = t.trim();
        try { localStorage.setItem('nf_topic', topic); } catch (e) {}
        connect();
      }
    }
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().then(status);
    }
    status();
  });

  status();
  connect();
})();
</script>
</body>
</html>
