<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>World Financial Football</title>
<style>
/* =====================================================================
   WORLD FINANCIAL FOOTBALL - PART 1 OF 3  (foundation, menus, setup, settings)
   Theme: deep navy + gold + pitch green. No emoji or images are required,
   so it renders on old browsers / old Windows too.
   ===================================================================== */
:root{
  --navy:#0a1233; --navy2:#111b4a; --blue:#1a1f71; --blue2:#2a35a8;
  --gold:#f7b600; --gold2:#ffd35a; --green:#1f9d4a; --pitch:#2e7d32;
  --red:#e0344a; --ink:#eef1ff; --mute:#9aa6d6; --card:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.12); --radius:14px;
  --font:"Trebuchet MS","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:var(--font);overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#app{position:fixed;left:0;top:0;right:0;bottom:0;
  background:radial-gradient(1200px 700px at 50% -10%,#27348f 0%,var(--navy2) 45%,var(--navy) 100%)}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:none;overflow-y:auto;overflow-x:hidden;padding:18px 16px 40px}
.screen.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{margin:0}
.muted{color:var(--mute)}
.small{font-size:.85rem}

/* buttons */
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;
  background:var(--card);border:1px solid var(--line);transition:transform .08s,background .15s,opacity .15s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2b2100;border-color:#c99100;
  box-shadow:0 4px 0 #a97800,0 8px 18px rgba(0,0,0,.35)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:active{box-shadow:0 1px 0 #a97800;transform:translateY(3px)}
.btn.danger{background:rgba(224,52,74,.18);border-color:rgba(224,52,74,.6)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:9px}
.btn.big{padding:16px 26px;font-size:1.15rem}
.row{display:flex;flex-wrap:wrap;align-items:center}
.row.gap>*{margin:0 8px 8px 0}
.spread{justify-content:space-between}
.grow{flex:1 1 auto}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.topbar h2{font-size:1.35rem}

/* menu */
.hero{text-align:center;padding:34px 0 18px}
.logo-ball{width:92px;height:92px;border-radius:50%;margin:0 auto 14px;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#e9e9e9 55%,#bdbdbd 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:bob 2.4s ease-in-out infinite}
.logo-ball:before,.logo-ball:after{content:"";position:absolute;background:#222;opacity:.85}
.logo-ball:before{left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;
  clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.logo-ball:after{left:6px;top:20px;width:16px;height:16px;border-radius:50%;box-shadow:58px 4px 0 #222,28px 56px 0 #222}
@keyframes bob{50%{transform:translateY(-8px)}}
.title{font-size:2.3rem;font-weight:900;letter-spacing:.03em;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.title span{color:var(--gold)}
.tagline{color:var(--mute);margin-top:6px}
.menu-list{max-width:420px;margin:22px auto 0}
.menu-list .btn{display:block;width:100%;margin-bottom:12px;text-align:center}
.warn{background:rgba(247,182,0,.12);border:1px solid rgba(247,182,0,.5);color:var(--gold2);
  border-radius:12px;padding:10px 14px;margin:0 auto 6px;max-width:420px;font-size:.9rem;text-align:center}

/* segmented control */
.seg{display:flex;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:90px;margin:0 6px 6px 0;padding:10px 12px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:700;text-align:center}
.seg button small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.seg button.on{background:linear-gradient(180deg,var(--blue2),var(--blue));border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}

/* team badge + slots */
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:900;
  letter-spacing:.03em;border:2px solid rgba(255,255,255,.7);flex:0 0 auto;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.slots{display:flex;flex-wrap:wrap}
.slot{flex:1 1 240px;margin:0 8px 8px 0;display:flex;align-items:center;padding:12px;border-radius:12px;cursor:pointer;
  background:rgba(0,0,0,.25);border:2px dashed var(--line);text-align:left}
.slot.filled{border-style:solid;border-color:var(--gold)}
.slot .badge{margin-right:12px}
.slot .nm{font-weight:800}
.slot .sb{font-size:.78rem;color:var(--mute)}

/* settings */
.tabs{display:flex;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 16px;cursor:pointer;font-weight:700;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .lbl b{display:block}
.setrow .lbl span{font-size:.8rem;color:var(--mute)}
.switch{position:relative;width:48px;height:26px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;left:0;top:0;right:0;bottom:0;background:#3a4170;border-radius:26px;cursor:pointer;transition:.2s}
.switch i:before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i:before{transform:translateX(22px)}
select,input[type=text],input[type=number],textarea{background:rgba(0,0,0,.3);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;width:100%;outline:none}
select{width:auto;min-width:130px}
select option{background:#111b4a;color:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.field>label{display:block;font-size:.78rem;color:var(--mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
.optrow{display:flex;align-items:center;margin-bottom:8px}
.optrow input[type=radio]{margin:0 10px 0 0;width:20px;height:20px;accent-color:var(--green);flex:0 0 auto}
.optrow .btn{margin-left:8px}
.errors{background:rgba(224,52,74,.15);border:1px solid rgba(224,52,74,.6);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:.88rem}
.errors div+div{margin-top:3px}
.qitem{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:rgba(0,0,0,.2)}
.qitem .qt{font-weight:700;margin-bottom:6px}
.chip{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.1);margin-right:5px;letter-spacing:.04em}
.chip.gold{background:rgba(247,182,0,.2);color:var(--gold2)}
.qitem ol{margin:6px 0 8px 20px;padding:0;font-size:.9rem;color:var(--mute)}
.qitem li.ok{color:#6ff0a0;font-weight:700}
.matrix{border-collapse:collapse;width:100%;font-size:.85rem}
.matrix td,.matrix th{border:1px solid var(--line);padding:6px 8px;text-align:center}
.matrix th{color:var(--mute);font-weight:600}
.matrix td.zero{color:var(--red)}

/* modal + toast */
#modal-root{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;pointer-events:none}
.overlay{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(3,6,20,.78);display:flex;align-items:center;
  justify-content:center;padding:14px;pointer-events:auto;animation:fadein .18s}
.modal{background:linear-gradient(180deg,#1c2766,#10184a);border:1px solid var(--gold);border-radius:16px;width:100%;
  max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal header{padding:14px 18px;font-weight:800;font-size:1.1rem;border-bottom:1px solid var(--line)}
.modal .mbody{padding:16px 18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;flex-wrap:wrap}
.modal footer .btn{margin-left:8px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-gap:8px;margin-top:10px}
.teamcell{display:flex;align-items:center;padding:8px;border-radius:10px;background:rgba(0,0,0,.25);
  border:1px solid var(--line);cursor:pointer;font-size:.82rem;font-weight:700;text-align:left}
.teamcell:hover{border-color:var(--gold);background:rgba(247,182,0,.1)}
.teamcell .badge{margin-right:8px}
.prevopt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.07);border:2px solid var(--line);font-weight:700}
.prevopt.right{border-color:#38d97a;background:rgba(56,217,122,.18)}
.prevopt.wrong{border-color:var(--red);background:rgba(224,52,74,.2)}
#toast-root{position:fixed;left:0;right:0;bottom:22px;z-index:60;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.toast{background:#0c1340;border:1px solid var(--gold);padding:10px 18px;border-radius:30px;margin-top:8px;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fadein .2s}
.stub{border:2px dashed var(--gold);border-radius:14px;padding:18px;background:rgba(247,182,0,.07)}
pre.dump{background:rgba(0,0,0,.35);border-radius:10px;padding:12px;overflow:auto;font-size:.8rem;max-height:260px}
@media (max-width:520px){.title{font-size:1.7rem}.seg button{min-width:70px}}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="screen-menu"></section>
  <section class="screen" id="screen-setup"></section>
  <section class="screen" id="screen-settings"></section>
  <section class="screen" id="screen-match"></section>      <!-- PART 2 renders the pitch + HUD here -->
  <section class="screen" id="screen-tournament"></section> <!-- PART 3 renders the bracket here -->
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>

    e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }); })(kids);
  return e;
}
function $(s, r){ return (r||document).querySelector(s); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function uid(){ return 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function hashStr(s){ var x=2166136261; for(var i=0;i<s.length;i++){ x^=s.charCodeAt(i); x=Math.imul(x,16777619); } return x>>>0; }

/* ---------------- persistent store (localStorage with memory fallback) ---------------- */

/* =====================================================================
   TOPICS  -  there are NO built-in topics. Users create their own in Settings > Topics
   (or while importing a PDF). A question's `category` field holds its topic id.
   ===================================================================== */
WFF.Topics = {
  _t:null,
  all:function(){
    if(!this._t){
      this._t = WFF.Store.get('topics', null);
      if(!Array.isArray(this._t)){          // first run of this version: keep any older questions reachable
        var qs = WFF.Store.get('questions', []), legacy = {personal:'Personal Finance', business:'Small Business'}, t = [];
        ['personal','business'].forEach(function(k){ if(qs.some(function(q){ return q.category===k; })) t.push({id:k, name:legacy[k]}); });
        this._t = t; WFF.Store.set('topics', t);
      }
    }
    return this._t;
  },
  _save:function(){ WFF.Store.set('topics', this._t); WFF.Bus.emit('topics'); WFF.Bus.emit('questions'); },
  get:function(id){ return this.all().filter(function(t){ return t.id===id; })[0] || null; },
  name:function(id){ var t = this.get(id); return t ? t.name : 'Unknown topic'; },
  byName:function(n){ n = String(n||'').trim().toLowerCase(); return this.all().filter(function(t){ return t.name.toLowerCase()===n; })[0] || null; },
  add:function(name){
    name = String(name||'').trim().replace(/\s+/g,' ');
    if(!name) return {ok:false, error:'Give the topic a name.'};
    if(name.length>60) return {ok:false, error:'Topic names can be at most 60 characters.'};
    if(this.byName(name)) return {ok:false, error:'You already have a topic with that name.'};
    var t = {id:'t'+uid(), name:name}; this.all().push(t); this._save(); return {ok:true, topic:t};
  },
  rename:function(id, name){
    name = String(name||'').trim().replace(/\s+/g,' ');
    var t = this.get(id); if(!t) return {ok:false, error:'Topic not found.'};
    if(!name) return {ok:false, error:'Give the topic a name.'};
    var d = this.byName(name); if(d && d.id!==id) return {ok:false, error:'You already have a topic with that name.'};
    t.name = name.slice(0,60); this._save(); return {ok:true};
  },
  remove:function(id){ this._t = this.all().filter(function(t){ return t.id!==id; }); WFF.Questions.removeTopic(id); this._save(); }
};
Object.defineProperty(WFF.Const, 'CATEGORIES', { configurable:true, enumerable:true, get:function(){
  return WFF.Topics.all().map(function(t){ var n = WFF.Questions.count({category:t.id}); return {id:t.id, label:t.name, sub:n+' question'+(n===1?'':'s')}; }); } });

/* ---------------- image store (IndexedDB with an in-memory cache) ----------------
   Question images (diagrams cropped from PDFs, or uploaded by hand) live here as data URLs;
   a question only keeps the image id in q.img. */
WFF.ImgStore = {
  cache:{}, _db:null, _ready:null,
  _open:function(){
    var self = this; if(this._ready) return this._ready;
    this._ready = new Promise(function(res){
      try{ var rq = indexedDB.open('wff-images', 1);
        rq.onupgradeneeded = function(){ rq.result.createObjectStore('img'); };
        rq.onsuccess = function(){ self._db = rq.result; res(self._db); }; rq.onerror = function(){ res(null); }; rq.onblocked = function(){ res(null); };
      }catch(e){ res(null); } });
    return this._ready;
  },
  _tx:function(mode, fn){ return this._open().then(function(db){ if(!db) return null; return new Promise(function(res){
    try{ var tx = db.transaction('img', mode), st = tx.objectStore('img'), out = fn(st); tx.oncomplete = function(){ res(out && out.result!==undefined ? out.result : true); }; tx.onerror = function(){ res(null); }; tx.onabort = function(){ res(null); }; }catch(e){ res(null); } }); }); },
  put:function(id, dataUrl){ this.cache[id] = dataUrl; return this._tx('readwrite', function(st){ return st.put(dataUrl, id); }).then(function(r){ return r!==null; }); },
  get:function(id){ var self = this; if(!id) return Promise.resolve(''); if(id in this.cache) return Promise.resolve(this.cache[id]);
    return this._tx('readonly', function(st){ return st.get(id); }).then(function(v){ if(typeof v==='string'){ self.cache[id] = v; return v; } return ''; }); },
  del:function(id){ delete this.cache[id]; return this._tx('readwrite', function(st){ return st.delete(id); }); },
  loadAll:function(){ var self = this; return this._open().then(function(db){ if(!db) return 0; return new Promise(function(res){
    try{ var n = 0, rq = db.transaction('img','readonly').objectStore('img').openCursor();
      rq.onsuccess = function(){ var c = rq.result; if(c){ if(typeof c.value==='string'){ self.cache[c.key] = c.value; n++; } c.continue(); } else res(n); }; rq.onerror = function(){ res(n); };
    }catch(e){ res(0); } }); }); },
  newId:function(){ return 'i'+uid(); }
};
WFF.ImgStore.loadAll();

/* =====================================================================
   QUESTIONS  -  ships EMPTY on purpose. Users add their own in Settings.
   Question object:
   { id, type:'mc'|'tf', category:<topic id>, difficulty:'easy'|'medium'|'hard',
     text, options:[string,...2..4] (tf is always ['True','False']), correct:index,
     hint:'', explanation:'', img:<optional image id in WFF.ImgStore>, src:<optional source note> }
   ===================================================================== */
WFF.Questions = {
  _q:null,
  all:function(){ if(!this._q) this._q = WFF.Store.get('questions', []); return this._q; },
  _save:function(){ WFF.Store.set('questions', this._q); WFF.Bus.emit('questions'); },
  get:function(id){ return this.all().filter(function(q){return q.id===id;})[0] || null; },
  /* returns array of error strings (empty = valid) */
  validate:function(q){
    var e = [];
    if(!q || typeof q!=='object') return ['Not a question object'];
    if(!q.text || !String(q.text).trim()) e.push('Question text is empty.');
    if(['mc','tf'].indexOf(q.type)<0) e.push('Type must be multiple choice or true/false.');
    if(!WFF.Topics.get(q.category)) e.push('Pick a topic (create one in Settings > Topics first).');
    if(['easy','medium','hard'].indexOf(q.difficulty)<0) e.push('Pick a difficulty.');
    if(q.type==='mc'){
      var o = (q.options||[]).map(function(x){return String(x).trim();});
      if(o.length<2 || o.length>4) e.push('Multiple choice needs 2 to 4 options.');
      if(o.some(function(x){return !x;})) e.push('Every option needs text.');
      if(new Set(o.map(function(x){return x.toLowerCase();})).size!==o.length) e.push('Options must be different from each other.');
      if(!(q.correct>=0 && q.correct<o.length)) e.push('Mark which option is correct.');
    } else if(q.type==='tf'){
      if(!(q.correct===0 || q.correct===1)) e.push('Choose True or False as the correct answer.');
    }
    return e;
  },
  normalize:function(q){
    var n = { id:q.id || uid(), type:q.type, category:q.category, difficulty:q.difficulty, text:String(q.text).trim(),
              options: q.type==='tf' ? ['True','False'] : q.options.map(function(x){return String(x).trim();}),
              correct:q.correct|0, hint:String(q.hint||'').trim(), explanation:String(q.explanation||'').trim() };
    if(q.img) n.img = String(q.img); if(q.src) n.src = String(q.src).slice(0,120);
    return n;
  },
  add:function(q){ var err=this.validate(q); if(err.length) return {ok:false, errors:err};
    var n=this.normalize(Object.assign({}, q, {id:uid()})); this.all().push(n); this._save(); return {ok:true, q:n}; },
  update:function(id,q){ var err=this.validate(q); if(err.length) return {ok:false, errors:err};
    var list=this.all(), i=list.findIndex(function(x){return x.id===id;}); if(i<0) return {ok:false, errors:['Question not found.']};
    list[i]=this.normalize(Object.assign({}, q, {id:id})); this._save(); return {ok:true, q:list[i]}; },
  _free:function(list){ var keep = {}; this._q.forEach(function(q){ if(q.img) keep[q.img] = 1; }); list.forEach(function(q){ if(q.img && !keep[q.img]) WFF.ImgStore.del(q.img); }); },
  remove:function(id){ var gone = this.all().filter(function(q){return q.id===id;}); this._q = this.all().filter(function(q){return q.id!==id;}); this._free(gone); this._save(); },
  removeTopic:function(tid){ var gone = this.all().filter(function(q){return q.category===tid;}); this._q = this.all().filter(function(q){return q.category!==tid;}); this._free(gone); this._save(); },
  clear:function(){ var gone = this.all().slice(); this._q = []; this._free(gone); this._save(); },
  /* add many at once (used by the PDF importer): returns {added, skipped} */
  addMany:function(list){ var self = this, added = 0, skipped = 0, seen = {};
    this.all().forEach(function(q){ seen[(q.category+'|'+q.text).toLowerCase()] = 1; });
    list.forEach(function(q){ if(self.validate(q).length){ skipped++; return; } var k = (q.category+'|'+String(q.text).trim()).toLowerCase();
      if(seen[k]){ skipped++; return; } seen[k] = 1; self._q.push(self.normalize(Object.assign({}, q, {id:uid()}))); added++; });
    this._save(); return {added:added, skipped:skipped}; },
  count:function(f){ f=f||{}; return this.all().filter(function(q){
    return (!f.category||q.category===f.category) && (!f.difficulty||q.difficulty===f.difficulty) && (!f.type||q.type===f.type); }).length; },
  exportJSON:function(){
    var imgs = {}; this.all().forEach(function(q){ if(q.img && WFF.ImgStore.cache[q.img]) imgs[q.img] = WFF.ImgStore.cache[q.img]; });
    return JSON.stringify({ app:'world-financial-football', version:2, topics:WFF.Topics.all(), questions:this.all(), images:imgs }, null, 2); },
  /* mode: 'merge' (default) or 'replace'. returns {added, skipped, errors:[]} */
  importJSON:function(text, mode){
    var data; try{ data = JSON.parse(text); }catch(e){ return {added:0, skipped:0, errors:['That is not valid JSON.']}; }
    var arr = Array.isArray(data) ? data : (data && data.questions);
    if(!Array.isArray(arr)) return {added:0, skipped:0, errors:['Expected an array of questions or {"questions":[...]}.']};
    var added=0, skipped=0, self=this, seen = {}, remap = {}, legacy = {personal:'Personal Finance', business:'Small Business'};
    if(mode==='replace'){ this._free(this.all().slice()); this._q = []; WFF.Topics._t = []; }
    if(data && Array.isArray(data.topics)) data.topics.forEach(function(t){ if(!t || !t.name) return;
      var ex = WFF.Topics.byName(t.name); if(!ex){ var id = (t.id && !WFF.Topics.get(String(t.id))) ? String(t.id) : 't'+uid(); ex = {id:id, name:String(t.name).slice(0,60)}; WFF.Topics.all().push(ex); } remap[t.id] = ex.id; });
    arr = arr.map(function(q){ if(!q) return q; q = Object.assign({}, q);
      if(remap[q.category]) q.category = remap[q.category];
      else if(!WFF.Topics.get(q.category) && legacy[q.category]){ var ex = WFF.Topics.byName(legacy[q.category]); if(!ex){ ex = {id:'t'+uid(), name:legacy[q.category]}; WFF.Topics.all().push(ex); } remap[q.category] = ex.id; q.category = ex.id; }
      return q; });
    WFF.Store.set('topics', WFF.Topics.all());
    if(data && data.images && typeof data.images==='object') Object.keys(data.images).forEach(function(k){ if(typeof data.images[k]==='string' && data.images[k].indexOf('data:image/')===0) WFF.ImgStore.put(k, data.images[k]); });
    this.all().forEach(function(q){ seen[(q.category+'|'+q.text).toLowerCase()] = 1; });
    arr.forEach(function(q){
      if(self.validate(q).length){ skipped++; return; }
      var key=(q.category+'|'+String(q.text).trim()).toLowerCase();
      if(seen[key]){ skipped++; return; } seen[key]=1;
      self._q.push(self.normalize(Object.assign({}, q, {id:uid()}))); added++;
    });
    WFF.Bus.emit('topics'); this._save(); return {added:added, skipped:skipped, errors:[]};
  },
  /* createPool: the object the match engine should use. It never repeats a question until the
     candidate set is exhausted, shuffles MC options, and falls back to the nearest difficulty. */
  createPool:function(opts){
    opts = opts || {}; var self = this, used = {}, shuffleOpts = opts.shuffleOptions!==false;
    var order = ['easy','medium','hard'];
    function candidates(diff){ return self.all().filter(function(q){
      return (!opts.category || q.category===opts.category) && (!diff || q.difficulty===diff); }); }
    function prep(q){ var c = JSON.parse(JSON.stringify(q));
      if(c.type==='mc' && shuffleOpts){ var idx = shuffle(c.options.map(function(_,i){return i;}));
        c.options = idx.map(function(i){return q.options[i];}); c.correct = idx.indexOf(q.correct); }
      c.correctText = c.options[c.correct]; return c; }
    return {
      /* next('easy'|'medium'|'hard'|undefined) -> prepared question or null when the bank has nothing for this category */
      next:function(diff){
        var tries = diff ? order.slice().sort(function(a,b){ return Math.abs(order.indexOf(a)-order.indexOf(diff)) - Math.abs(order.indexOf(b)-order.indexOf(diff)); }) : [undefined];
        for(var t=0;t<tries.length;t++){
          var list = candidates(tries[t]); if(!list.length) continue;
          var fresh = list.filter(function(q){return !used[q.id];});
          if(!fresh.length){ list.forEach(function(q){ delete used[q.id]; }); fresh = list; }
          var pick = fresh[Math.floor(Math.random()*fresh.length)]; used[pick.id]=1; return prep(pick);
        }
        return null;
      },
      size:function(){ return candidates().length; },
      reset:function(){ used = {}; }
    };
  }
};

var UI = WFF.UI = {};
UI.toast = function(msg){ var t=h('div',{class:'toast',text:msg}); $('#toast-root').appendChild(t);

UI.modal = function(o){
  var root = $('#modal-root'), ov = h('div',{class:'overlay'}), closed=false;
  function close(){ if(closed) return; closed=true; document.removeEventListener('keydown', onKey); if(ov.parentNode) ov.parentNode.removeChild(ov); if(o.onClose) o.onClose(); }
  function onKey(e){ if(e.key==='Escape') close(); }
  var foot = h('footer');
  (o.actions||[]).forEach(function(a){
    foot.appendChild(h('button',{class:'btn '+(a.kind||''), text:a.label, onClick:function(){ var r = a.onClick ? a.onClick(close) : undefined; if(r!==false && !a.keep) close(); }}));
  });
  var m = h('div',{class:'modal'}, o.title ? h('header',{text:o.title}) : null, h('div',{class:'mbody'}, o.body), (o.actions&&o.actions.length)?foot:null);
  ov.appendChild(m);
  ov.addEventListener('mousedown', function(e){ if(e.target===ov && o.dismissable!==false) close(); });
  document.addEventListener('keydown', onKey); root.appendChild(ov);
  return close;
};

/* seg(options[{id,label,sub}], value, onChange) -> element with .set(value) */

  options.forEach(function(o){
    el.appendChild(h('button',{type:'button','data-id':o.id, onClick:function(){ cur=o.id; paint(); onChange(o.id); }}, o.label, o.sub ? h('small',{text:o.sub}) : null));

        t ? UI.badge(t,44) : h('span',{class:'badge',style:'width:44px;height:44px;border-style:dashed;color:var(--mute)',text:'?'}),

var ZONE_EDGE  = [0,0.16,0.34,0.56,0.74,0.86,1];    // zone band edges, same measure
var DEF_CHANCE = [0.2,0.3,0.4,0.55,0.7];      // chance a defensive question follows a correct attacking answer, by current zone

var BASE = [{x:.2,y:.5},{x:.38,y:.25},{x:.38,y:.75},{x:.55,y:.5}];   // outfield formation, own perspective; index 3 = ball carrier

  setText(e.half, m.pen ? 'Penalty shootout' : (m.half===1?'1st half':'2nd half'));
  setText(e.poss, (m.over||m.phase==='intro'||m.phase==='walkout'||m.phase==='replay') ? '' : (m.pen ? m.teams[m.poss].code+' to kick' : m.teams[m.poss].code+' ball: '+ZONE_NAMES[m.zone]));
  for(var s=0;s<2;s++){ var mt = e['meter'+s]; if(!mt.parentNode) continue;
    for(var k=0;k<SUPER_MAX;k++) mt.children[k].className = k<m.meter[s] ? 'on' : '';
    mt.className = 'ms-meter'+(m.meter[s]>=SUPER_MAX?' full':''); }
  if(m.timerEl && m.qMax>0){ var r = U.clamp(m.qLeft/m.qMax,0,1); m.timerEl.style.width = (r*100).toFixed(1)+'%'; m.timerEl.className = r<.25?'low':''; }
}

/* ---------------- overlays ---------------- */
function showOverlay(title, nodes, btns){
  hideOverlay();
  var foot = h('div',{class:'mbtns'}, btns.map(function(b){ return h('button',{class:'btn '+(b.kind||''),text:b.label,onClick:b.fn}); }));
  m.overlay = h('div',{class:'mover'}, h('div',{class:'mcard'}, h('h2',{text:title}), nodes, foot));
  m.root.appendChild(m.overlay);
}
function hideOverlay(){ if(m && m.overlay){ if(m.overlay.parentNode) m.overlay.parentNode.removeChild(m.overlay); m.overlay = null; } }
function gate(side, then){            // two-player "pass the device" screen
  if(m.cfg.players!==2 || m.lastViewer===side){ m.lastViewer = side; then(); return; }
  m.phase = 'gate'; m.lastViewer = side; renderPanel();
  showOverlay('Pass the device', [ h('div',{class:'vs'}, UI.badge(m.teams[side],64)),
    h('p',{style:'font-size:1.2rem;font-weight:800',text:'Pass the device to '+m.teams[side].label}), h('p',{class:'muted small',text:'Do not let the other player see the next question.'}) ],
    [{label:'I am ready', kind:'primary', fn:function(){ hideOverlay(); then(); }}]);
}

/* ---------------- pause ---------------- */
function togglePause(){
  if(!m || m.over) return;
  if(m.paused){ m.paused = false; hideOverlay(); return; }
  if(m.overlay) return;
  m.paused = true;
  var btns = [{label:'Resume', kind:'primary', fn:function(){ m.paused=false; hideOverlay(); }}];
  if(!m.cfg.onEnd) btns.push({label:'Restart', fn:function(){ UI.confirm('Restart match','Start this match again from 0-0?','Restart',function(){ var c=m.cfg; Match.start(c); }, true); }});
  btns.push({label:'Settings', fn:function(){ UI.toast('Settings are available from the main menu.'); }});
  btns.push({label:'Quit to menu', kind:'danger', fn:function(){ UI.confirm('Quit match','Leave this match? Progress will be lost.','Quit',function(){ Match.stop(); WFF.Menu.render(); WFF.Router.show('menu'); }, true); }});
  showOverlay('Paused', [h('p',{class:'muted',text:m.teams[0].label+' '+m.score[0]+' - '+m.score[1]+' '+m.teams[1].label})], btns);
}
function onKey(e){
  if(!m || WFF.Router.current!=='match') return;
  if($('#modal-root').children.length) return;
  if(e.key==='Escape'){ togglePause(); return; }
  if(m.phase!=='question' || m.overlay || m.paused || !human(m.qSide)) return;
  var k = String(e.key).toLowerCase(), q = m.q, i = -1;
  if(k>='1' && k<='4') i = +k-1; else if(q.type==='tf'){ if(k==='t') i = 0; else if(k==='f') i = 1; }
  if(i>=0 && i<q.options.length && m.elim.indexOf(i)<0) answer(i);
}

/* =====================================================================
   QUESTION PANEL
   ===================================================================== */
function penDots(){
  var box = h('div');
  [0,1].forEach(function(s){
    var row = h('div',{class:'dots'}, h('b',{text:m.teams[s].code}));
    var n = Math.max(5, m.pen.log[s].length);
    for(var i=0;i<n;i++){ var r = m.pen.log[s][i]; row.appendChild(h('i',{class: r===1?'s':(r===0?'x':'')})); }
    box.appendChild(row); });
  return box;
}
function setPanelMode(pop){
  var p = m.panel, want = m.phase==='replay' ? 'hide' : (pop ? 'pop' : 'tick');
  if(p.getAttribute('data-mode')!==want){ p.setAttribute('data-mode', want); p.className = 'mpanel '+want; }
  if(pop && p.getAttribute('data-qn')!==String(m.qn)){ p.setAttribute('data-qn', String(m.qn)); p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop'); }
  if(!pop) p.removeAttribute('data-qn');
  m.el.back.className = 'mback'+(pop?' on':'');
}
function renderPanel(){
  if(!m) return; var p = m.panel; p.innerHTML = ''; m.timerEl = null;
  var popup = (m.phase==='question' || m.phase==='reveal') && !!m.q; setPanelMode(popup);
  if(m.pen) p.appendChild(penDots());
  if(popup){ p.appendChild(questionView()); updateHud(); return; }
  p.appendChild(h('div',{class:'mp-head',text:m.pen?'Penalty shootout':ZONE_NAMES[m.zone]}));
  p.appendChild(h('div',{class:'mp-idle',text:m.status||'Get ready...'}));
  if(!m.pen && m.phase!=='intro'){
    p.appendChild(h('div',{class:'small muted',style:'margin-top:10px',text:'Streaks: '+m.teams[0].code+' '+m.stats[0].cur+' / '+m.teams[1].code+' '+m.stats[1].cur+'. Correct answers move the ball forward; reach the penalty area and answer once more to shoot.'}));
  }
}
function questionView(){
  var q = m.q, side = m.qSide, rev = m.phase==='reveal', mine = human(side), box = h('div');
  var kindText = KIND_LABEL[m.qKind];
  box.appendChild(h('div',{class:'mp-head',text:kindText+' - '+m.teams[side].label}));
  box.appendChild(h('div',null, h('span',{class:'chip gold',text:WFF.Topics.name(q.category)}), h('span',{class:'chip',text:q.difficulty}), h('span',{class:'chip',text:ZONE_NAMES[Math.min(5,m.zone)]})));
  if(m.qMax>0){ var bar = h('div',{class:'mtimer'}, h('i')); m.timerEl = bar.firstChild; box.appendChild(bar); } else box.appendChild(h('div',{style:'height:12px'}));
  box.appendChild(h('div',{class:'mq-text',text:q.text}));
  if(q.img){ var qim = h('img',{class:'mqimg',alt:'Question diagram'}); WFF.ImgStore.get(q.img).then(function(u){ if(u) qim.src = u; else qim.style.display = 'none'; }); box.appendChild(qim); }
  var og = h('div',{class:'mopts'}); box.appendChild(og);
  q.options.forEach(function(o,i){
    var cls = 'mopt'; if(m.elim.indexOf(i)>=0) cls += ' gone';
    if(rev){ if(i===q.correct) cls += ' right'; else if(i===m.picked) cls += ' wrong'; }
    var key = q.type==='tf' ? (i===0?'T':'F') : String(i+1);
    og.appendChild(h('button',{class:cls,type:'button',disabled:rev,onClick:function(){ answer(i); }}, h('kbd',{text:key}), h('span',{text:o})));
  });
  if(rev){
    var msg = m.picked<0 ? 'Time is up! ' : (m.picked===q.correct ? 'Correct! ' : 'Not quite. ');
    box.appendChild(h('div',{class:'mexp'}, h('b',{text:msg}), q.explanation||''));
  } else {
    if(m.hintShown && q.hint) box.appendChild(h('div',{class:'mhint',text:'Hint: '+q.hint}));
    if(S.get('hints') && q.hint && !m.hintShown){
      box.appendChild(h('button',{class:'btn small',type:'button',disabled:m.hintUsed,text:m.hintUsed?'Hint used this possession':'Show hint',onClick:function(){ m.hintUsed = true; m.hintShown = true; renderPanel(); }}));
    }
    if(S.get('powerups')){
      var row = h('div',{class:'mpow'}), pw = m.pow[side];
      POWERS.forEach(function(P){
        var off = pw[P.id]<=0 || (P.id==='double' && (m.qKind!=='attack' || m.dbl[side])) || (P.id==='fifty' && (q.type!=='mc' || q.options.length-m.elim.length<=2));
        row.appendChild(h('button',{class:'btn small',type:'button',disabled:off,title:P.id==='double'?'Next correct attacking answer moves the ball two zones':'',text:P.label+' ('+pw[P.id]+')',onClick:function(){ usePow(P.id); }}));
      });
      box.appendChild(row);
    }
  }
  if(!mine){ box.appendChild(h('div',{class:'small muted',style:'margin-top:8px',text:'CPU is thinking...'})); }
  return box;
}

/* ---------------- asking and answering ---------------- */
function ask(side, kind, dIdx, cb){
  var q = m.pool.next(DIFFS[dIdx]);
  if(!q){ cb(false); return; }
  m.q = q; m.qn++; m.qSide = side; m.qKind = kind; m.qDiff = DIFFS[dIdx]; m.cb = cb; m.picked = -1; m.elim = []; m.hintShown = false;
  var t = Number(S.get('timer')) || 0; m.qMax = t; m.qLeft = t;
  m.phase = 'question'; renderPanel();
}
function answer(i){
  if(!m || m.phase!=='question') return;
  var q = m.q, ok = (i===q.correct), side = m.qSide;
  m.picked = i; m.phase = 'reveal'; m.timerEl = null;
  recordAnswer(side, ok); WFF.Audio.play(ok?'correct':'wrong');
  renderPanel();
  var cb = m.cb; later(1900 + (q.explanation?1500:0), function(){ cb(ok); });
}
function recordAnswer(side, ok){
  var st = m.stats[side];
  if(ok){
    st.correct++; st.cur++; if(st.cur>st.streak) st.streak = st.cur;
    if(S.get('superShot')) m.meter[side] = Math.min(SUPER_MAX, m.meter[side]+1);
    if(S.get('powerups') && human(side) && st.cur%3===0) earn(side);
  } else { st.wrong++; st.cur = 0; m.meter[side] = 0; }
}
function earn(side){
  var P = POWERS[Math.floor(Math.random()*POWERS.length)]; m.pow[side][P.id]++;
  UI.toast(m.teams[side].code+' earned a power-up: '+P.label);
}
function usePow(id){
  if(!m || m.phase!=='question' || !S.get('powerups')) return;
  var side = m.qSide, pw = m.pow[side]; if(!human(side) || pw[id]<=0) return;
  if(id==='fifty'){
    var keep = m.q.options.length - m.elim.length, rem = Math.min(2, keep-2); if(rem<=0) return;
    var wrong = U.shuffle(m.q.options.map(function(_,i){return i;}).filter(function(i){ return i!==m.q.correct && m.elim.indexOf(i)<0; }));
    for(var k=0;k<rem;k++) m.elim.push(wrong[k]);
  } else if(id==='skip'){
    var nq = m.pool.next(m.qDiff); if(!nq) return;
    m.q = nq; m.elim = []; m.hintShown = false; m.qLeft = m.qMax;
  } else if(id==='time'){
    if(m.qMax>0){ m.qLeft += 10; if(m.qLeft>m.qMax) m.qMax = m.qLeft; } else { m.clock += 15; if(m.clock>0) m.timeUp = false; }
  } else if(id==='double'){
    if(m.qKind!=='attack' || m.dbl[side]) return; m.dbl[side] = true; UI.toast('Double Zone armed: a correct answer moves the ball two zones');
  }
  pw[id]--; WFF.Audio.play('powerup'); renderPanel();
}

/* ---------------- CPU brain ---------------- */
function cpuRoll(side, kind, dI){
  var base = {easy:.45, normal:.62, hard:.8}[S.get('cpuLevel')] || .62;
  var me = m.teams[side].rating, opp = m.teams[1-side].rating;
  var p = base + U.clamp((me-opp)/260, -.12, .12) - dI*.05 - (kind==='defense'?.05:0);
  return Math.random() < U.clamp(p, .12, .93);
}
function cpuStep(side, kind, dI, cb){
  m.phase = 'cpu'; m.q = null;
  say(nm(side)+(kind==='defense'?' defend...':(kind==='shot'||kind==='penalty'?' line up a shot...':' have the ball...')));
  later(1500+Math.random()*900, function(){
    var ok = cpuRoll(side, kind, dI); recordAnswer(side, ok);
    say(nm(side)+(ok?' answered correctly.':' got it wrong.')); WFF.Audio.play(ok?'correct':'wrong');
    later(1500, function(){ cb(ok); });
  });
}
function actor(side, kind, dI, cb){      // a side answers a question: human sees it, CPU simulates
  if(human(side)) gate(side, function(){ ask(side, kind, dI, cb); });
  else cpuStep(side, kind, dI, cb);
}

/* =====================================================================
   GAME FLOW
   ===================================================================== */
function setBall(side){ var tx = absX(m.poss, ZONE_FRAC[m.zone]), dist = Math.abs(tx-m.ball.x); kickTo(tx, .5, .8+dist*2.6, Math.min(.45, dist*1.2), 'out', side, true); }
function kickoff(side){
  m.poss = side; m.zone = 2; m.hintUsed = false; m.hintShown = false; m.q = null; setBall();
  m.phase = 'ready'; say(nm(side)+' kick off from midfield.'); updateHud();
  later(2000, turn);
}
function walkout(){
  m.phase = 'walkout'; m.zone = 2; m.poss = 0; m.cheer = 3; m.cheerSide = -1; say('The teams walk out. What an atmosphere!'); renderPanel(); WFF.Audio.play('whistle');
  later(4600, function(){ WFF.Audio.play('whistle'); kickoff(0); });
}
function turn(){
  if(!m || m.over) return;
  if(m.timeUp) return endHalf();
  var a = m.poss;
  if(m.zone>=5) return shotStep(a);
  say(nm(a)+' attack: '+ZONE_NAMES[m.zone]+'.');
  actor(a, 'attack', diffIdx(m.zone), function(ok){ attackDone(a, ok); });
}
function attackDone(a, ok){
  if(!ok) return turnover('Possession lost! '+nm(1-a)+' win the ball.');
  var d = 1-a, step = m.dbl[a] ? 2 : 1; m.dbl[a] = false;
  var tz = Math.min(5, m.zone+step);
  if(Math.random() < DEF_CHANCE[Math.min(4,m.zone)]) defend(a, d, tz); else advance(tz);
}
function defend(a, d, tz){
  say(nm(d)+' must defend this attack!');
  actor(d, 'defense', diffIdx(m.zone, 0), function(ok){
    if(ok){ turnover('Great tackle! '+nm(d)+' stop the attack.'); m.slideT = .75; m.slideS = d; } else advance(tz);
  });
}
function advance(tz){
  m.zone = tz; m.hintUsed = false; setBall(); m.phase = 'anim'; WFF.Audio.play('kick');
  say(nm(m.poss)+' move into the '+ZONE_NAMES[tz].toLowerCase()+'.');
  later(2400, turn);
}
function turnover(msg){
  var oldZone = m.zone, d = 1-m.poss;
  m.poss = d; m.zone = oldZone>=5 ? 0 : U.clamp(4-oldZone, 0, 3); m.hintUsed = false; m.hintShown = false; m.q = null;
  setBall(); m.phase = 'anim'; WFF.Audio.play('kick'); say(msg);
  later(2900, turn);
}
function keeperSave(a, extra){
  var d = 1-a, lvl = {easy:-.04, normal:0, hard:.05}[S.get('cpuLevel')] || 0;
  var p = .14 + (extra||0) + U.clamp((m.teams[d].rating-m.teams[a].rating)/400, -.08, .12) + (human(d)?0:lvl);
  return Math.random() < U.clamp(p, .04, .38);
}
function shotStep(a){
  if(S.get('superShot') && m.meter[a]>=SUPER_MAX){
    m.meter[a] = 0; m.superFx = 2; WFF.Audio.play('supershot'); say('SUPER SHOT! '+nm(a)+' unleash an unstoppable strike!');
    m.phase = 'anim'; return later(2000, function(){ resolveShot(a, 'goal', true); });
  }
  say(nm(a)+' have a shot on goal!');
  actor(a, 'shot', diffIdx(5), function(ok){
    if(!ok) resolveShot(a, 'wide'); else resolveShot(a, keeperSave(a)?'save':'goal');
  });
}
function resolveShot(a, res, sup){
  var d = 1-a; m.phase = 'anim'; m.q = null; var goalX = a===0 ? 1.03 : -0.03, ty = .45+Math.random()*.1;
  m.kyT[d] = res==='goal' && !sup ? (ty<.5 ? .62 : .38) : (res==='save' ? ty : .5);
  WFF.Audio.play('kick');
  if(res==='goal'){ m.shotGt = m.gt; kickTo(goalX, ty, sup?.7:.95, .14, 'lin', a); m.slowT = .9; later(950, function(){ goal(a, sup); }); }
  else if(res==='save'){ kickTo(absX(a,.955), ty, .85, .1, 'lin', a); say('Saved by the keeper!'); WFF.Audio.play('groan');
    later(900, function(){ kickTo(absX(a,.78), .3+Math.random()*.4, 1.2, .5, 'out', d); });
    later(3000, function(){ m.poss = d; m.zone = 0; m.hintUsed = false; m.kyT[d] = .5; setBall(d); say(nm(d)+' restart from their box.'); later(1800, turn); }); }
  else { kickTo(absX(a,1.05), Math.random()<.5 ? .2 : .8, 1.0, .28, 'lin', a); say('Shot goes wide!'); WFF.Audio.play('groan'); later(2700, function(){ m.poss = d; m.zone = 0; m.hintUsed = false; setBall(d); say(nm(d)+' restart from their box.'); later(1800, turn); }); }
}
function goal(a, sup){
  m.rpFrames = m.rec.filter(function(f){ return f.gt >= m.shotGt-.8; }); m.rpLive = true; m.rpEnd = m.gt+.9;
  m.score[a]++; m.stats[a].goals++; m.cheer = 3; m.cheerSide = a; m.netT[1-a] = 1; m.flash = S.get('reduceMotion')?0:1; m.shake = S.get('reduceMotion')?0:.6;
  m.banner = {text:sup?'SUPER GOAL!':'GOAL!', sub:nm(a)+'  '+m.score[0]+' - '+m.score[1], t:0, dur:3.2};
  WFF.Audio.play('goal'); say('GOAL for '+nm(a)+'!');
  if(!S.get('reduceMotion')) for(var i=0;i<150;i++) m.fx.push({x:.5, y:.3, vx:(Math.random()-.5)*1.4, vy:-Math.random()*1.2-.2, c:[m.teams[a].c1,m.teams[a].c2,'#00e5ff','#ff2fd1','#fff'][i%5], life:2+Math.random()});
  later(4000, function(){ startReplay(a); });
}
/* ---------------- goal replay: the last moments of the move, replayed in slow motion ---------------- */
function startReplay(a){
  if(!m || m.over) return;
  var fr = m.rpFrames;
  if(!fr || fr.length<8 || S.get('reduceMotion')){ m.kyT = [.5,.5]; kickoff(1-a); return; }
  m.phase = 'replay'; m.rpT = 0; m.rpI = 0; m.rpA = a; m.banner = null; m.fx = []; m.cheer = 0; m.flash = 0; m.slowT = 0; m.trail = [];
  m.el.skip.style.display = 'block'; renderPanel();
}
function endReplay(){
  if(!m || m.phase!=='replay') return;
  var a = m.rpA; m.el.skip.style.display = 'none'; m.rpFrames = null; m.rpLive = false; m.kyT = [.5,.5]; m.netT = [0,0]; m.ky = [.5,.5]; m.dv = [0,0]; m.kd = [0,0]; m.cheer = 0;
  m.phase = 'ready'; kickoff(1-a);
}
function rec(){
  var b = m.ball, f = {gt:m.gt, bx:b.x, by:b.y, bh:b.h, br:b.rot||0, on:b.on, lin:b.ease==='lin', cam:m.cam, vw:m.viewW, ky:m.ky.slice(), dv:m.dv.slice(), kdir:m.kdir.slice(), net:m.netT.slice(),
    ref:[m.ref.x,m.ref.y,m.ref.ph,m.ref.face,m.ref.spd], pl:[[],[]]};
  for(var s=0;s<2;s++) m.pl[s].forEach(function(p){ f.pl[s].push([p.x,p.y,p.ph,p.face,p.spd,p.kick,p.jump,p.cel?1:0]); });
  m.rec.push(f); while(m.rec.length && m.rec[0].gt < m.gt-4) m.rec.shift();
  if(m.rpLive){ m.rpFrames.push(f); if(m.gt>m.rpEnd) m.rpLive = false; }
}
function replayStep(dt){
  var fr = m.rpFrames; if(!fr || !fr.length) return endReplay();
  m.rpT += dt*.7; var t = fr[0].gt + m.rpT, last = fr[fr.length-1];
  if(t >= last.gt+.5) return endReplay();
  while(m.rpI < fr.length-1 && fr[m.rpI+1].gt <= t) m.rpI++;
  var f = fr[m.rpI], b = m.ball, s, i;
  b.x = f.bx; b.y = f.by; b.h = f.bh; b.rot = f.br; b.on = f.on; b.ease = f.lin ? 'lin' : 'out'; b.tx = b.x; b.ty = b.y;
  m.cam = f.cam; m.viewW = f.vw; m.ref.x = f.ref[0]; m.ref.y = f.ref[1]; m.ref.ph = f.ref[2]; m.ref.face = f.ref[3]; m.ref.spd = f.ref[4];
  for(s=0;s<2;s++){ m.ky[s] = f.ky[s]; m.dv[s] = f.dv[s]; m.kdir[s] = f.kdir[s]; m.netT[s] = f.net[s];
    for(i=0;i<4;i++){ var p = m.pl[s][i], a = f.pl[s][i]; p.x = a[0]; p.y = a[1]; p.ph = a[2]; p.face = a[3]; p.spd = a[4]; p.kick = a[5]; p.jump = a[6]; p.cel = !!a[7]; } }
  m.trail = b.on && b.ease==='lin' ? m.trail.concat([{x:b.x,y:b.y,h:b.h,a:.5}]).slice(-8) : [];
}

/* ---------------- half time / full time ---------------- */
function endHalf(){
  m.timeUp = false; WFF.Audio.play('whistle');
  if(m.half===1){
    m.phase = 'break';
    showOverlay('Half time', [ h('div',{class:'bigscore',text:m.score[0]+' - '+m.score[1]}), h('p',{text:m.teams[0].label+'  vs  '+m.teams[1].label}), h('p',{class:'muted small',text:'Correct so far: '+m.stats[0].correct+' / '+m.stats[1].correct}) ],
      [{label:'Start second half', kind:'primary', fn:function(){ hideOverlay(); m.half = 2; m.clock = m.halfLen; m.zone = 2; kickoffSecond(); }}]);
  } else {
    if(m.score[0]===m.score[1]){
      m.phase = 'break';
      showOverlay('Full time: level!', [ h('div',{class:'bigscore',text:m.score[0]+' - '+m.score[1]}), h('p',{text:'It goes to a penalty shootout.'}) ],
        [{label:'Start shootout', kind:'primary', fn:function(){ hideOverlay(); startShootout(); }}]);
    } else finish();
  }
}
function kickoffSecond(){ kickoff(1); }

/* ---------------- penalty shootout ---------------- */
function startShootout(){
  m.pen = {n:[0,0], g:[0,0], log:[[],[]], next:0}; m.paused = false; m.timeUp = false;
  m.zone = 5; m.kyT = [.5,.5]; penaltyTurn();
}
function penWinner(){
  var n = m.pen.n, g = m.pen.g, ra = Math.max(0,5-n[0]), rb = Math.max(0,5-n[1]);
  if(n[0]<5 || n[1]<5){ if(g[0]>g[1]+rb) return 0; if(g[1]>g[0]+ra) return 1; return -1; }
  if(n[0]===n[1]){ if(g[0]!==g[1]) return g[0]>g[1]?0:1; if(n[0]>=12) return Math.random()<.5?0:1; }
  return -1;
}
function penaltyTurn(){
  if(!m || m.over) return;
  var w = penWinner(); if(w>=0) return finish();

    if(tx){ var lead = en.match(/^\s*/)[0], trail = en.match(/\s*$/)[0], out = lead + tx + trail; if(cur !== out) node.nodeValue = out; node.__wffEn = en; node.__wffTr = out; }
    else if(node.__wffTr !== undefined && en !== cur){ node.nodeValue = en; node.__wffTr = undefined; node.__wffEn = undefined; }
  });
}
function enhanceA11y(root){
  try{
    var q = function(s){ return (root||document).querySelectorAll(s); }, i, els;
    els = q('.overlay:not([role]), .mover:not([role])'); for(i=0;i<els.length;i++){ els[i].setAttribute('role','dialog'); els[i].setAttribute('aria-modal','true'); }
    els = q('canvas:not([aria-label])'); for(i=0;i<els.length;i++){ els[i].setAttribute('role','img'); els[i].setAttribute('aria-label','Football pitch'); }
    els = q('.switch input:not([aria-label])'); for(i=0;i<els.length;i++){ var lb = els[i].closest('.setrow'); els[i].setAttribute('aria-label', lb ? lb.textContent.slice(0,40) : 'toggle'); }
    els = q('.optrow input[type=radio]:not([aria-label])'); for(i=0;i<els.length;i++) els[i].setAttribute('aria-label','Correct answer');
    var tr0 = document.getElementById('toast-root'); if(tr0 && !tr0.getAttribute('aria-live')) tr0.setAttribute('aria-live','polite');
  }catch(e){}
}
var pending = false;
WFF.I18n.apply = function(){
  if(busy) return; busy = true;
  try{
    var rtl = WFF.I18n.lang()==='ar'; var app = $('#app'); if(app){ if(rtl) app.setAttribute('dir','rtl'); else app.removeAttribute('dir'); }
    var mr = $('#modal-root'); if(mr){ if(rtl) mr.setAttribute('dir','rtl'); else mr.removeAttribute('dir'); }
    document.documentElement.setAttribute('lang', WFF.I18n.lang());
    ['#app','#modal-root','#toast-root'].forEach(function(s){ translateTree($(s)); });
    enhanceA11y();
  }finally{ busy = false; }
};
function schedule(){ if(pending) return; pending = true; (window.requestAnimationFrame||setTimeout)(function(){ pending = false; WFF.I18n.apply(); }); }
try{
  var mo = new MutationObserver(function(){ if(!busy) schedule(); });
  ['#app','#modal-root','#toast-root'].forEach(function(s){ var el = $(s); if(el) mo.observe(el, {childList:true, subtree:true, characterData:true}); });
}catch(e){}
WFF.Bus.on('settings', function(d){ if(d.reset || d.key==='language') WFF.I18n.apply(); });

/* =====================================================================
   5. BOOT-TIME POLISH : tutorial on first launch, re-render menu, music hint
   ===================================================================== */
WFF.onReady(function(){
  WFF.Menu.render(); if(WFF.Router.current!=='menu') {}
  WFF.I18n.apply();
  if(!WFF.Store.get('tutorialSeen', false)){
    WFF.Store.set('tutorialSeen', true);
    setTimeout(function(){ if(WFF.Router.current==='menu') WFF.Menu.howTo(); }, 350);
  }
});
if(WFF.booted){ WFF.Menu.render(); WFF.I18n.apply(); }
})();

Wrong answers or a timeout hand the ball over. Keys: 1-4 to answer, T/F on true/false,

THE QUESTION BANK IS EMPTY ON PURPOSE.  There are no built-in topics. In Settings, create a
topic (Topics tab), then either type questions (Custom Questions: multiple choice with 2-4

Cambridge MCQ past paper (Import PDF tab: question paper + mark scheme; options A-D, answer
key, diagrams and scanned pages are handled; you review and edit before importing). The PDF
tools (pdf.js, tesseract.js) are fetched from a CDN on first use, so that tab needs internet.
Use Backup to export or import everything as JSON (version 2 also carries topics and pictures):
  { "topics":[ {"id":"t1","name":"IGCSE Physics"} ],
    "questions":[ { "type":"mc", "category":"t1", "difficulty":"easy",

category is a topic id (older files that use "personal" or "business" import as topics named
Personal Finance / Small Business); difficulty "easy", "medium" or "hard"; type "tf" questions
use "correct":0 for True or 1 for False. Questions are kept in your browser (localStorage,
pictures in IndexedDB), so use Backup before clearing site data. Aim for 10+ per topic and
difficulty. If a difficulty is empty the nearest one is used.

MATCH SCREEN  The match is a full-screen stadium (Full screen button for true fullscreen).
Questions appear as pop-ups over the pitch; goals are followed by a slow-motion replay.

  Part 1: namespace WFF, store, settings, countries and teams, question bank, menu, setup,
