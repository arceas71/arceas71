name: Render Video Short

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy scipy opencv-python-headless

      - name: Generate MP4
        run: |
          python generate.py

      - name: Convert to web-compatible H.264
        run: |
          ffmpeg -y -i short_chaos.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart final_chaos.mp4

      - name: Publish Direct MP4 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-render
          name: "Latest Chaos Render"
          files: final_chaos.mp4
