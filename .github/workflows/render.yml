name: Render Video Short

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy scipy opencv-python-headless

      - name: Run Chaos Simulation
        run: |
          python generate.py

      - name: Transcode to H.264
        run: |
          ffmpeg -y -i short_chaos.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart final_chaos.mp4

      - name: Upload Direct MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: magnetic-chaos-short
          path: final_chaos.mp4
          retention-days: 7

      - name: Publish Direct Release (Single-click MP4)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-magnetic-render
          name: "Magnetic Chaos Render"
          files: final_chaos.mp4
