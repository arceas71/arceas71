<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>H.I.D.E.A.</title>

<style>

/* ==================================================
   THEME VARIABLES
================================================== */

:root {

    --background: #ffffff;

    --primary: #14213d;

    --secondary: #1e3a5f;

    --text: #202b3c;

    --muted: #8b95a5;

    --globe-line: #b7bec7;

    --border: #d8dee8;

    --button-background: #ffffff;

    --blue: #4285f4;

    --blue-light: #4da9ed;

    --blue-dark: #174f9c;

    --error: #d62828;
}


/* ==================================================
   AUTOMATIC DARK MODE
================================================== */

@media (prefers-color-scheme: dark) {

    :root {

        --background: #101216;

        --primary: #f1f3f5;

        --secondary: #dce7f5;

        --text: #e7ebf0;

        --muted: #9299a5;

        --globe-line: #59616d;

        --border: #343a44;

        --button-background: #181b21;

        --blue: #5b9df9;

        --blue-light: #67b5f4;

        --blue-dark: #2865b5;

        --error: #ff5555;
    }
}


/* ==================================================
   BASE
================================================== */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

    user-select: none;
}


html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background:
        var(--background);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    transition:
        background .25s ease,
        color .25s ease;
}


body {

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}


/* ==================================================
   SPLASH SCREEN
================================================== */

#splash {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        var(--background);

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        splashOut
        .65s
        ease
        4.8s
        forwards;

    transition:
        background .25s ease;
}


.logo {

    width: 72vw;

    max-width: 300px;

    overflow: visible;

    animation:
        logoZoomOut
        .8s
        cubic-bezier(.16,1,.3,1)
        3.1s
        forwards;
}


@keyframes logoZoomOut {

    0% {

        transform:
            scale(1);
    }

    100% {

        transform:
            scale(.72);
    }
}


/* ==================================================
   GLOBE
================================================== */

.globe {

    opacity: 0;

    transform-origin:
        250px 225px;

    animation:

        globeIn
        1s
        cubic-bezier(.16,1,.3,1)
        .15s
        forwards,

        globeFloat
        2.5s
        ease-in-out
        1.2s
        infinite;
}


@keyframes globeIn {

    0% {

        opacity: 0;

        transform:
            scale(.55)
            rotate(-15deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.05)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes globeFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-4px);
    }
}


/* ==================================================
   GLOBE LINES
================================================== */

.globeLines {

    opacity: 0;

    stroke-dasharray: 500;

    animation:
        linesIn
        .8s
        ease
        .65s
        forwards;
}


@keyframes linesIn {

    from {

        opacity: 0;

        stroke-dashoffset:
            500;
    }

    to {

        opacity: 1;

        stroke-dashoffset:
            0;
    }
}


/* ==================================================
   CARDINAL MARKERS
================================================== */

.cardinal {

    opacity: 0;

    transform-origin:
        center;

    animation:
        cardinalIn
        .65s
        cubic-bezier(.16,1,.3,1)
        forwards;

    stroke:
        var(--primary);
}


.cardinal.east {

    animation-delay:
        1.08s;
}


.cardinal.south {

    animation-delay:
        1.21s;
}


.cardinal.west {

    animation-delay:
        1.34s;
}


@keyframes cardinalIn {

    0% {

        opacity: 0;

        transform:
            scale(.3);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.12);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* ==================================================
   NAVIGATION ARROW
================================================== */

.navArrow {

    opacity: 0;

    transform-origin:
        250px 210px;

    animation:

        arrowIn
        .8s
        cubic-bezier(.16,1,.3,1)
        .85s
        forwards,

        arrowFloat
        2.5s
        ease-in-out
        1.5s
        infinite;
}


@keyframes arrowIn {

    0% {

        opacity: 0;

        transform:
            scale(.35)
            rotate(-35deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.07)
            rotate(3deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes arrowFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-5px);
    }
}


/* ==================================================
   H.I.D.E.A. LETTERS
================================================== */

.letter {

    opacity: 0;

    filter:
        blur(7px);

    fill:
        var(--primary);

    animation:
        letterFloatIn
        .9s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


.l1 { animation-delay: 1.45s; }
.l2 { animation-delay: 1.58s; }
.l3 { animation-delay: 1.71s; }
.l4 { animation-delay: 1.84s; }
.l5 { animation-delay: 1.97s; }
.l6 { animation-delay: 2.10s; }
.l7 { animation-delay: 2.23s; }
.l8 { animation-delay: 2.36s; }
.l9 { animation-delay: 2.49s; }


@keyframes letterFloatIn {

    0% {

        opacity: 0;

        filter:
            blur(7px);

        transform:
            translateY(20px)
            scale(.82);
    }

    55% {

        opacity: 1;

        filter:
            blur(1px);

        transform:
            translateY(-4px)
            scale(1.04);
    }

    100% {

        opacity: 1;

        filter:
            blur(0);

        transform:
            translateY(0)
            scale(1);
    }
}


/* ==================================================
   SPLASH EXIT
================================================== */

@keyframes splashOut {

    to {

        opacity: 0;

        visibility: hidden;
    }
}


/* ==================================================
   MAIN APP
================================================== */

#app {

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100vh;

    background:
        var(--background);

    opacity: 0;

    animation:
        appIn
        .7s
        ease
        4.85s
        forwards;

    transition:
        background .25s ease;
}


@keyframes appIn {

    to {

        opacity: 1;
    }
}


/* ==================================================
   COORDINATES
================================================== */

.coordinates {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -76px);

    text-align: center;

    color:
        var(--text);

    font-size:
        14px;

    line-height:
        1.65;

    font-weight:
        500;

    white-space:
        nowrap;

    transition:
        color .25s ease;
}


/* ==================================================
   LOCATION MARKER
================================================== */

.location-marker {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 56px;

    height: 56px;

    transform:
        translate(-50%, -50%);
}


/* ==================================================
   ACCURACY CIRCLE
================================================== */

.accuracy {

    position: absolute;

    inset: 0;

    border-radius:
        50%;

    background:
        rgba(66,133,244,.055);

    border:
        1px solid
        rgba(66,133,244,.12);
}


/* ==================================================
   DIRECTION TRIANGLE
================================================== */

.heading {

    position: absolute;

    left: 50%;

    top: 3px;

    width: 0;

    height: 0;

    transform:
        translateX(-50%);

    transform-origin:
        50% 50%;

    border-left:
        5px solid transparent;

    border-right:
        5px solid transparent;

    border-bottom:
        18px solid var(--blue);

    filter:
        drop-shadow(
            0 1px 2px
            rgba(0,0,0,.12)
        );

    transition:
        transform .12s linear;
}


.heading::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 6px;

    width: 0;

    height: 0;

    transform:
        translateX(-50%);

    border-left:
        1.5px solid transparent;

    border-right:
        1.5px solid transparent;

    border-bottom:
        7px solid var(--background);
}


/* ==================================================
   BLUE DOT
================================================== */

.dot {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 11px;

    height: 11px;

    transform:
        translate(-50%, -50%);

    border-radius:
        50%;

    background:
        var(--blue);

    border:
        2px solid
        var(--background);

    box-shadow:
        0 1px 4px
        rgba(0,0,0,.22);

    z-index: 2;

    transition:
        background .25s ease,
        border-color .25s ease;
}


/* ==================================================
   ALTITUDE
================================================== */

.altitude {

    position: absolute;

    top:
        calc(
            18px +
            env(safe-area-inset-top)
        );

    right:
        calc(
            18px +
            env(safe-area-inset-right)
        );

    text-align:
        right;
}


.altitude-label {

    font-size:
        9px;

    letter-spacing:
        .9px;

    color:
        var(--muted);

    transition:
        color .25s ease;
}


.altitude-value {

    margin-top:
        2px;

    font-size:
        18px;

    font-weight:
        600;

    color:
        var(--secondary);

    transition:
        color .25s ease;
}


/* ==================================================
   ERROR SCREEN
================================================== */

#error {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    background:
        var(--background);

    text-align:
        center;

    padding:
        30px;

    padding-top:
        calc(
            30px +
            env(safe-area-inset-top)
        );

    padding-bottom:
        calc(
            30px +
            env(safe-area-inset-bottom)
        );

    transition:
        background .25s ease;
}


/* ==================================================
   ERROR ICON
================================================== */

.wifi {

    width:
        96px;

    height:
        96px;

    margin-bottom:
        22px;
}


/* ==================================================
   ERROR TEXT
================================================== */

#errorText {

    color:
        var(--error);

    font-size:
        30px;

    font-weight:
        600;

    margin-bottom:
        26px;
}


/* ==================================================
   ERROR BUTTONS
================================================== */

.error-buttons {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

    width:
        min(280px, 82vw);
}


.error-button {

    width:
        100%;

    min-height:
        50px;

    padding:
        0 16px;

    border-radius:
        12px;

    border:
        1px solid
        var(--border);

    background:
        var(--button-background);

    color:
        var(--secondary);

    font-size:
        16px;

    font-weight:
        600;

    cursor:
        pointer;

    transition:

        transform .12s,

        background .25s,

        color .25s,

        border-color .25s;
}


.error-button:active {

    transform:
        scale(.97);
}


.error-button.primary {

    background:
        var(--secondary);

    color:
        var(--background);

    border:
        none;
}


/* ==================================================
   ERROR HELP
================================================== */

#errorHelp {

    margin-top:
        17px;

    max-width:
        300px;

    color:
        var(--muted);

    font-size:
        12px;

    line-height:
        1.5;
}

</style>

</head>


<body>


<!-- ==================================================
     SPLASH SCREEN
================================================== -->

<div id="splash">

<svg
    class="logo"
    viewBox="0 0 500 570"
    xmlns="http://www.w3.org/2000/svg"
>


<!-- GLOBE -->

<g class="globe">

    <circle
        cx="250"

        stroke="var(--primary)"

    />

</g>


<!-- GLOBE LINES -->

<g
    class="globeLines"
    fill="none"
    stroke="var(--globe-line)"
    stroke-width="2"
>

    <ellipse
        cx="250"
        cy="285"
        rx="105"
        ry="35"
    />

    <ellipse
        cx="250"
        cy="285"
        rx="50"
        ry="35"
    />

    <path
        d="M145 285 Q250 250 355 285"
    />

    <path
        d="M150 300 Q250 330 350 300"
    />

    <path
        d="M250 250 Q215 285 250 320"
    />

    <path
        d="M250 250 Q285 285 250 320"
    />

</g>


<!-- EAST -->

<g
    class="cardinal east"
    stroke-width="5"
    stroke-linecap="round"
>

    <line
        x1="405"
        y1="225"
        x2="387"
        y2="225"
    />

</g>


<!-- SOUTH -->

<g
    class="cardinal south"
    stroke-width="5"
    stroke-linecap="round"
>

    <line
        x1="250"
        y1="380"
        x2="250"
        y2="362"
    />

</g>


<!-- WEST -->

<g
    class="cardinal west"
    stroke-width="5"
    stroke-linecap="round"
>

    <line
        x1="95"
        y1="225"
        x2="113"
        y2="225"
    />

</g>


<!-- NAVIGATION ARROW -->

<g class="navArrow">

    <path
        d="
        M250 125
        L315 300
        L250 260
        L185 300
        Z
        "
        fill="var(--blue-light)"
    />

    <path
        d="
        M250 125
        L315 300
        L250 260
        Z
        "
        fill="var(--blue-dark)"
    />

    <path
        d="
        M250 55
        L261 92
        L250 108
        L239 92
        Z
        "
        fill="var(--primary)"
    />

</g>


<!-- H.I.D.E.A. -->

<g
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="62"
    font-weight="500"
>

    <text
        class="letter l1"
        x="95"
        y="475"
    >H</text>

    <text
        class="letter l2"
        x="135"
        y="475"
    >.</text>

    <text
        class="letter l3"
        x="165"
        y="475"
    >I</text>

    <text
        class="letter l4"
        x="195"
        y="475"
    >.</text>

    <text
        class="letter l5"
        x="235"
        y="475"
    >D</text>

    <text
        class="letter l6"
        x="285"
        y="475"
    >.</text>

    <text
        class="letter l7"
        x="325"
        y="475"
    >E</text>

    <text
        class="letter l8"
        x="370"
        y="475"
    >.</text>

    <text
        class="letter l9"
        x="410"
        y="475"
    >A</text>

</g>


</svg>

</div>



<!-- ==================================================
     MAIN APP
================================================== -->

<div id="app">


<!-- COORDINATES -->

<div class="coordinates">

    <div id="latitude">
        --
    </div>

    <div id="longitude">
        --
    </div>

</div>


<!-- LOCATION MARKER -->

<div class="location-marker">

    <div class="accuracy"></div>

    <div
        class="heading"
        id="heading"
    ></div>

    <div class="dot"></div>

</div>


<!-- ALTITUDE -->

<div class="altitude">

    <div class="altitude-label">
        ALT
    </div>

    <div
        class="altitude-value"
        id="altitude"
    >
        --
    </div>

</div>



<!-- ==================================================
     LOCATION ERROR
================================================== -->

<div id="error">


<!-- RED WIFI ICON -->

<svg
    class="wifi"
    viewBox="0 0 100 100"
    xmlns="http://www.w3.org/2000/svg"
>

    <path
        d="M10 35 Q50 5 90 35"
        fill="none"
        stroke="var(--error)"
        stroke-width="10"
        stroke-linecap="round"
    />

    <path
        d="M23 52 Q50 30 77 52"
        fill="none"
        stroke="var(--error)"
        stroke-width="10"
        stroke-linecap="round"
    />

    <path
        d="M37 69 Q50 58 63 69"
        fill="none"
        stroke="var(--error)"
        stroke-width="10"
        stroke-linecap="round"
    />

    <circle
        cx="50"
        cy="84"
        r="6"
        fill="var(--error)"
    />

    <line
        x1="18"
        y1="15"
        x2="82"
        y2="85"
        stroke="var(--error)"
        stroke-width="9"
        stroke-linecap="round"
    />

</svg>


<div id="errorText">
    Location unavailable
</div>


<div class="error-buttons">


    <button
        class="error-button primary"
        id="allowButton"
    >
        Allow Location
    </button>


    <button
        class="error-button"
        id="settingsButton"
    >
        Open Location Settings
    </button>


</div>


<div id="errorHelp">

    Location permission is required
    for H.I.D.E.A. to determine your
    position and altitude.

</div>


</div>


</div>



<script>

/* ==================================================
   VARIABLES
================================================== */

let locationWatch = null;

let compassStarted = false;


/* ==================================================
   SHOW ERROR
================================================== */

function showLocationError() {

    document.getElementById(
        "error"
    ).style.display = "flex";

}


/* ==================================================
   HIDE ERROR
================================================== */

function hideLocationError() {

    document.getElementById(
        "error"
    ).style.display = "none";

}


/* ==================================================
   UPDATE LOCATION
================================================== */

function updateLocation(position) {

    const c =
        position.coords;


    document.getElementById(
        "latitude"
    ).textContent =

        c.latitude.toFixed(6)
        + "°";


    document.getElementById(
        "longitude"
    ).textContent =

        c.longitude.toFixed(6)
        + "°";


    if (

        c.altitude !== null &&

        Number.isFinite(
            c.altitude
        )

    ) {

        document.getElementById(
            "altitude"
        ).textContent =

            c.altitude.toFixed(1)
            + " m";

    }

    else {

        document.getElementById(
            "altitude"
        ).textContent =
            "--";

    }


    hideLocationError();

}


/* ==================================================
   GPS WATCH
================================================== */

function startLocationWatch() {

    if (
        locationWatch !== null
    ) {

        navigator.geolocation.clearWatch(
            locationWatch
        );

    }


    locationWatch =

        navigator.geolocation.watchPosition(

            updateLocation,

            function() {

                showLocationError();

            },

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    15000

            }

        );

}


/* ==================================================
   REQUEST LOCATION
================================================== */

function requestLocation() {

    if (
        !navigator.geolocation
    ) {

        showLocationError();

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            updateLocation(
                position
            );

            startLocationWatch();

            startCompass();

        },

        function() {

            showLocationError();

        },

        {

            enableHighAccuracy:
                true,

            maximumAge:
                0,

            timeout:
                15000

        }

    );

}


/* ==================================================
   OPEN ANDROID LOCATION SETTINGS
================================================== */

function openLocationSettings() {

    const intent =

        "intent://settings/location" +

        "#Intent;" +

        "scheme=android-app;" +

        "package=com.android.settings;" +

        "end";


    try {

        window.location.href =
            intent;

    }

    catch (error) {

        requestLocation();

    }

}


/* ==================================================
   COMPASS
================================================== */

function handleCompass(event) {

    let heading;


    if (

        event.webkitCompassHeading
        !== undefined

    ) {

        heading =
            event.webkitCompassHeading;

    }

    else if (

        event.alpha !== null

    ) {

        heading =
            360 - event.alpha;

    }

    else {

        return;

    }


    heading =
        (heading + 360) % 360;


    document.getElementById(
        "heading"
    ).style.transform =

        "translateX(-50%) rotate("
        + heading
        + "deg)";

}


/* ==================================================
   START COMPASS
================================================== */

function startCompass() {

    if (
        compassStarted
    ) {

        return;

    }


    compassStarted = true;


    if (

        typeof DeviceOrientationEvent
        !== "undefined"

        &&

        typeof DeviceOrientationEvent
        .requestPermission
        === "function"

    ) {

        DeviceOrientationEvent

            .requestPermission()

            .then(

                function(permission) {

                    if (
                        permission ===
                        "granted"
                    ) {

                        window.addEventListener(

                            "deviceorientation",

                            handleCompass,

                            true

                        );

                    }

                }

            )

            .catch(

                function() {}

            );

    }

    else {

        window.addEventListener(

            "deviceorientationabsolute",

            handleCompass,

            true

        );


        window.addEventListener(

            "deviceorientation",

            handleCompass,

            true

        );

    }

}


/* ==================================================
   ALLOW LOCATION
================================================== */

document.getElementById(
    "allowButton"
).addEventListener(

    "click",

    function() {

        requestLocation();

    }

);


/* ==================================================
   OPEN SETTINGS
================================================== */

document.getElementById(
    "settingsButton"
).addEventListener(

    "click",

    function() {

        openLocationSettings();

    }

);


/* ==================================================
   INITIAL LOCATION REQUEST
================================================== */

setTimeout(

    function() {

        requestLocation();

    },

    500

);


/* ==================================================
   FIRST TOUCH
================================================== */

document.addEventListener(

    "touchstart",

    function() {

        startCompass();

    },

    {

        once: true,

        passive: true

    }

);

</script>

</body>

</html>
