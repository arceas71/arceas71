<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>H.I.D.E.A</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    color: #14213d;
}


/* ========================================
   SPLASH SCREEN
======================================== */

#splash {
    position: fixed;
    inset: 0;

    background: white;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 1000;

    animation: splashOut 0.7s ease 2.4s forwards;
}


/* LOGO */

.logo {
    width: clamp(150px, 45vw, 260px);

    opacity: 0;

    transform: scale(0.75);

    animation:
        logoIn 0.8s cubic-bezier(.2,.8,.2,1) .15s forwards,
        logoPulse 1.2s ease 1s;
}


/* LOGO ENTRANCE */

@keyframes logoIn {

    from {
        opacity: 0;
        transform: scale(0.75);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* SMALL PULSE */

@keyframes logoPulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.025);
    }

    100% {
        transform: scale(1);
    }

}


/* SPLASH EXIT */

@keyframes splashOut {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
        visibility: hidden;
    }

}


/* ========================================
   MAIN SCREEN
======================================== */

#app {
    position: relative;

    width: 100vw;
    height: 100vh;

    opacity: 0;

    animation: appIn 0.7s ease 2.5s forwards;
}


@keyframes appIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* ========================================
   COORDINATES
======================================== */

.coordinates {

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    white-space: nowrap;

    font-size:
        clamp(12px, 2.2vw, 18px);

    line-height: 1.65;

    font-weight: 500;

    color: #202b3c;
}


/* ========================================
   PERSON
======================================== */

.person {

    position: absolute;

    top: 50%;
    left: 50%;

    width:
        clamp(32px, 7vw, 58px);

    height:
        clamp(58px, 13vw, 100px);

    transform:
        translate(-50%, 18%)
        rotate(0deg);

    transform-origin: center;

    transition:
        transform 0.12s linear;
}


/* HEAD */

.head {

    position: absolute;

    width: 25%;

    aspect-ratio: 1;

    left: 50%;
    top: 0;

    transform:
        translateX(-50%);

    background: #1e5a91;

    border-radius: 50%;
}


/* BODY */

.body {

    position: absolute;

    width: 34%;
    height: 43%;

    left: 50%;
    top: 25%;

    transform:
        translateX(-50%);

    background: #1e5a91;

    border-radius:
        40% 40% 15% 15%;
}


/* ARMS */

.arm {

    position: absolute;

    width: 10%;
    height: 40%;

    top: 29%;

    background: #1e5a91;

    border-radius: 10px;
}


.arm.left {

    left: 27%;

    transform:
        rotate(10deg);
}


.arm.right {

    right: 27%;

    transform:
        rotate(-10deg);
}


/* LEGS */

.leg {

    position: absolute;

    width: 11%;
    height: 38%;

    top: 64%;

    background: #1e5a91;

    border-radius: 10px;
}


.leg.left {

    left: 39%;

    transform:
        rotate(4deg);
}


.leg.right {

    right: 39%;

    transform:
        rotate(-4deg);
}


/* ========================================
   DIRECTION
======================================== */

.direction {

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, 95px);

    color: #9ca3af;

    font-size:
        clamp(10px, 1.6vw, 14px);

    white-space: nowrap;
}


/* ========================================
   ALTITUDE
======================================== */

.altitude {

    position: absolute;

    top:
        clamp(14px, 2.5vw, 25px);

    right:
        clamp(14px, 2.5vw, 25px);

    text-align: right;
}


.altitude-label {

    font-size:
        clamp(8px, 1.2vw, 11px);

    letter-spacing: .7px;

    color: #9ca3af;
}


.altitude-value {

    margin-top: 2px;

    font-size:
        clamp(16px, 3vw, 23px);

    font-weight: 600;

    color: #1e3a5f;
}


/* ========================================
   LOCATION ERROR
======================================== */

#error {

    position: absolute;

    left: 50%;

    bottom:
        clamp(40px, 7vw, 65px);

    transform:
        translateX(-50%);

    display: none;

    padding:
        9px 14px;

    border:
        1px solid #efcaca;

    border-radius: 7px;

    background: #fff5f5;

    color: #b42318;

    font-size:
        clamp(10px, 1.5vw, 13px);

    white-space: nowrap;
}


/* ========================================
   STATUS
======================================== */

#status {

    position: absolute;

    bottom:
        clamp(12px, 2vw, 20px);

    left: 50%;

    transform:
        translateX(-50%);

    color: #c1c7cf;

    font-size:
        clamp(8px, 1.2vw, 11px);

    white-space: nowrap;
}


</style>
</head>


<body>


<!-- ========================================
     SPLASH LOGO
======================================== -->

<div id="splash">

    <svg
        class="logo"
        viewBox="0 0 500 570"
        xmlns="http://www.w3.org/2000/svg"
    >

        <!-- OUTER CIRCLE -->

        <circle
            cx="250"
            cy="225"
            r="150"
            fill="white"
            stroke="#14213d"
            stroke-width="7"
        />


        <!-- COMPASS MARKERS -->

        <g
            stroke="#14213d"
            stroke-width="5"
            stroke-linecap="round"
        >

            <line
                x1="250"
                y1="70"
                x2="250"
                y2="88"
            />

            <line
                x1="405"
                y1="225"
                x2="387"
                y2="225"
            />

            <line
                x1="250"
                y1="380"
                x2="250"
                y2="362"
            />

            <line
                x1="95"
                y1="225"
                x2="113"
                y2="225"
            />

        </g>


        <!-- GLOBE -->

        <g
            fill="none"
            stroke="#b7bec7"
            stroke-width="2"
        >

            <ellipse
                cx="250"
                cy="285"
                rx="105"
                ry="35"
            />

            <ellipse
                cx="250"
                cy="285"
                rx="50"
                ry="35"
            />

            <path
                d="M145 285 Q250 250 355 285"
            />

            <path
                d="M150 300 Q250 330 350 300"
            />

            <path
                d="M250 250 Q215 285 250 320"
            />

            <path
                d="M250 250 Q285 285 250 320"
            />

        </g>


        <!-- NAVIGATION SYMBOL -->

        <path
            d="
                M250 125
                L315 300
                L250 260
                L185 300
                Z
            "
            fill="#4da9ed"
        />

        <path
            d="
                M250 125
                L315 300
                L250 260
                Z
            "
            fill="#174f9c"
        />


        <!-- NORTH -->

        <path
            d="
                M250 55
                L261 92
                L250 108
                L239 92
                Z
            "
            fill="#14213d"
        />


        <!-- NAME -->

        <text
            x="250"
            y="475"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="62"
            font-weight="500"
            letter-spacing="10"
            fill="#14213d"
        >
            H.I.D.E.A
        </text>

    </svg>

</div>



<!-- ========================================
     MAIN APP
======================================== -->

<div id="app">


    <!-- COORDINATES -->

    <div class="coordinates">

        <div id="latitude">
            --
        </div>

        <div id="longitude">
            --
        </div>

    </div>



    <!-- PERSON -->

    <div
        class="person"
        id="person"
    >

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>

        <div class="arm right"></div>

        <div class="leg left"></div>

        <div class="leg right"></div>

    </div>



    <!-- DIRECTION -->

    <div
        class="direction"
        id="direction"
    >
        --
    </div>



    <!-- ALTITUDE -->

    <div class="altitude">

        <div class="altitude-label">
            ALT
        </div>

        <div
            class="altitude-value"
            id="altitude"
        >
            --
        </div>

    </div>



    <!-- ERROR -->

    <div id="error">
        Location not available
    </div>



    <!-- STATUS -->

    <div id="status">
        Initializing...
    </div>


</div>



<script>

/* ========================================
   GPS
======================================== */

function startGPS() {

    if (!navigator.geolocation) {

        showLocationError();

        return;

    }


    navigator.geolocation.watchPosition(

        function(position) {

            const c =
                position.coords;


            /* LATITUDE */

            document.getElementById(
                "latitude"
            ).textContent =

                c.latitude.toFixed(6)
                + "°";


            /* LONGITUDE */

            document.getElementById(
                "longitude"
            ).textContent =

                c.longitude.toFixed(6)
                + "°";


            /* ALTITUDE */

            if (
                c.altitude !== null &&
                Number.isFinite(c.altitude)
            ) {

                document.getElementById(
                    "altitude"
                ).textContent =

                    c.altitude.toFixed(1)
                    + " m";

            }

            else {

                document.getElementById(
                    "altitude"
                ).textContent =
                    "--";

            }


            /* HIDE ERROR */

            document.getElementById(
                "error"
            ).style.display =
                "none";


            document.getElementById(
                "status"
            ).textContent =
                "GPS active";

        },


        function() {

            showLocationError();

        },


        {

            enableHighAccuracy: true,

            maximumAge: 1000,

            timeout: 10000

        }

    );

}


/* ========================================
   LOCATION ERROR
======================================== */

function showLocationError() {

    document.getElementById(
        "error"
    ).style.display =
        "block";


    document.getElementById(
        "status"
    ).textContent =
        "Location unavailable";

}


/* ========================================
   COMPASS
======================================== */

function startCompass() {

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"
    ) {

        DeviceOrientationEvent
            .requestPermission()

            .then(
                function(permission) {

                    if (
                        permission ===
                        "granted"
                    ) {

                        window.addEventListener(
                            "deviceorientation",
                            handleCompass,
                            true
                        );

                    }

                }
            )

            .catch(
                function() {

                    document.getElementById(
                        "direction"
                    ).textContent =
                        "--";

                }
            );

    }

    else {

        window.addEventListener(
            "deviceorientationabsolute",
            handleCompass,
            true
        );

        window.addEventListener(
            "deviceorientation",
            handleCompass,
            true
        );

    }

}


/* ========================================
   COMPASS DATA
======================================== */

function handleCompass(event) {

    let heading;


    /* iPhone */

    if (
        event.webkitCompassHeading !==
        undefined
    ) {

        heading =
            event.webkitCompassHeading;

    }


    /* Android */

    else if (
        event.alpha !== null
    ) {

        heading =
            360 - event.alpha;

    }


    else {

        return;

    }


    heading =
        (heading + 360) % 360;


    /* ROTATE PERSON */

    document.getElementById(
        "person"
    ).style.transform =

        "translate(-50%, 18%) " +
        "rotate(" +
        heading +
        "deg)";


    /* DISPLAY DIRECTION */

    document.getElementById(
        "direction"
    ).textContent =

        heading.toFixed(0)
        + "° "
        + getDirection(heading);

}


/* ========================================
   CARDINAL DIRECTION
======================================== */

function getDirection(degrees) {

    if (
        degrees >= 337.5 ||
        degrees < 22.5
    ) {

        return "N";

    }


    if (degrees < 67.5) {

        return "NE";

    }


    if (degrees < 112.5) {

        return "E";

    }


    if (degrees < 157.5) {

        return "SE";

    }


    if (degrees < 202.5) {

        return "S";

    }


    if (degrees < 247.5) {

        return "SW";

    }


    if (degrees < 292.5) {

        return "W";

    }


    return "NW";

}


/* ========================================
   START GPS
======================================== */

startGPS();


/* ========================================
   START COMPASS AFTER TOUCH
======================================== */

function enableCompass() {

    startCompass();

}


document.addEventListener(
    "click",
    enableCompass,
    { once: true }
);


document.addEventListener(
    "touchstart",
    enableCompass,
    { once: true }
);

</script>

</body>
</html>
