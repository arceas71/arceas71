name: Build Bus Alert APK

on:
  push:
    branches: [busalert-app]
    paths:
      - 'busalert/**'
      - '.github/workflows/build-busalert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: busalert
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: busalert-apk
          path: busalert/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: busalert-latest
          name: "Bus Alert (latest APK)"
          target_commitish: ${{ github.sha }}
          files: busalert/app/build/outputs/apk/debug/app-debug.apk
