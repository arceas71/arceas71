<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChronoTrade</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']},colors:{bgdark:'#0b0e14',card:'#151922',mint:'#00d09c',coral:'#ff5252'}}}}
</script>
<style>
body{background:#0b0e14;color:#f1f5f9}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#262d3d;border-radius:3px}
input:focus-visible,button:focus-visible{outline:2px solid #00d09c;outline-offset:2px}
</style>
</head>
<body class="min-h-screen font-sans antialiased">

<!-- HEADER -->
<header class="border-b border-slate-800 bg-bgdark/90 backdrop-blur sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="font-bold text-lg text-white flex items-center gap-2">
      <span class="w-8 h-8 rounded-lg bg-mint text-black flex items-center justify-center text-sm">⚡</span>ChronoTrade
    </div>

    <div class="flex flex-wrap items-center gap-2 bg-card border border-slate-800 rounded-2xl px-3 py-1.5 text-xs font-mono">
      <span id="clock" class="text-white font-semibold">2026-11-08 09:30:00</span>
      <span id="speedBtns" class="flex gap-1"></span>
    </div>

    <div class="flex items-center gap-2 bg-card border border-slate-800 rounded-2xl px-3 py-1.5">
      <div id="avatar" class="w-7 h-7 rounded-full bg-mint/20 text-mint font-bold text-xs flex items-center justify-center">?</div>
      <button onclick="openName()" class="text-left" title="Change username">
        <div id="uname" class="text-xs font-semibold text-white leading-tight">Pick a username</div>
        <div id="status" class="text-[10px] font-mono text-slate-500">● connecting</div>
      </button>
      <button id="googleBtn" onclick="signInGoogle()" class="ml-1 px-2.5 py-1.5 rounded-lg bg-white text-slate-900 text-[11px] font-semibold">Save with Google</button>
      <button id="outBtn" onclick="signOutUser()" class="hidden ml-1 text-[11px] text-slate-400 hover:text-coral">Sign out</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

  <!-- LEFT -->
  <section class="lg:col-span-8 space-y-5">
    <div class="bg-card border border-slate-800 rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="text-xs text-slate-400">Total value</div>
        <div id="nw" class="text-3xl sm:text-4xl font-bold font-mono">$100,000.00</div>
        <div id="profit" class="text-xs font-mono font-semibold text-mint mt-1">+$0.00 (0.00%)</div>
      </div>
      <div class="text-right text-xs text-slate-400 space-y-2">
        <div>Cash <span id="cash" class="font-mono font-bold text-white">$100,000.00</span></div>
        <button onclick="resetAccount()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-coral/20 hover:text-coral transition">Reset</button>
      </div>
    </div>

    <div id="pills" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5"></div>

    <div class="bg-card border border-slate-800 rounded-3xl p-6">
      <div class="flex items-start justify-between mb-4 gap-3">
        <div>
          <div class="flex items-center gap-2"><h2 id="cName" class="text-lg font-bold">Bitcoin</h2><span id="cTick" class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">BTC</span></div>
          <div class="flex items-baseline gap-2 mt-1"><span id="cPrice" class="text-2xl font-bold font-mono">$0</span><span id="cChg" class="text-xs font-mono font-semibold">0%</span></div>
        </div>
        <div id="cOwn" class="text-right font-mono text-xs text-slate-400"></div>
      </div>
      <div class="relative w-full h-[280px] select-none">
        <canvas id="chart" class="w-full h-full cursor-crosshair"></canvas>
        <div id="hover" class="hidden absolute top-2 left-2 bg-bgdark/90 border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-mono pointer-events-none"></div>
      </div>
    </div>
  </section>

  <!-- RIGHT -->
  <aside class="lg:col-span-4 space-y-5">
    <div class="bg-card border border-slate-800 rounded-3xl p-6">
      <div class="grid grid-cols-2 gap-2 p-1 bg-bgdark rounded-2xl mb-5">
        <button id="tabBuy" onclick="setSide('BUY')" class="py-2.5 rounded-xl font-bold text-xs">Buy</button>
        <button id="tabSell" onclick="setSide('SELL')" class="py-2.5 rounded-xl font-bold text-xs">Sell</button>
      </div>
      <label for="amt" class="block text-xs text-slate-400 mb-1.5">Amount in USD</label>
      <div class="relative mb-3">
        <span class="absolute left-4 top-3 font-mono text-slate-400 text-lg">$</span>
        <input id="amt" type="number" value="1000" min="1" step="any" oninput="preview()" onkeydown="if(event.key==='Enter')trade()" class="w-full bg-bgdark border border-slate-800 rounded-2xl pl-9 pr-4 py-3 font-mono text-xl font-bold focus:outline-none focus:border-mint">
      </div>
      <div class="grid grid-cols-4 gap-2 mb-4 font-mono text-xs">
        <button onclick="frac(.25)" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700">25%</button>
        <button onclick="frac(.5)" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700">50%</button>
        <button onclick="frac(.75)" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700">75%</button>
        <button onclick="maxAmt()" class="py-2 rounded-xl bg-mint/15 hover:bg-mint/25 text-mint font-bold">Max</button>
      </div>
      <div class="flex justify-between text-xs text-slate-400 mb-4 px-1"><span>You get</span><span id="est" class="font-mono text-white font-semibold">0</span></div>
      <button id="go" onclick="trade()" class="w-full py-3.5 rounded-2xl font-bold text-sm">Buy BTC</button>
    </div>

    <div class="bg-card border border-slate-800 rounded-3xl p-5">
      <div class="grid grid-cols-3 gap-2 p-1 bg-bgdark rounded-2xl mb-4 text-xs font-bold">
        <button id="tabBoard" onclick="setTab('board')" class="py-2 rounded-xl">Leaderboard</button>
        <button id="tabHold" onclick="setTab('hold')" class="py-2 rounded-xl">Holdings</button>
        <button id="tabLog" onclick="setTab('log')" class="py-2 rounded-xl">History</button>
      </div>
      <div id="listBox" class="space-y-2 max-h-[420px] overflow-y-auto"></div>
    </div>
  </aside>
</main>

<!-- USERNAME MODAL -->
<div id="nameModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">
  <div class="w-full max-w-sm bg-card border border-slate-700 rounded-3xl p-6">
    <h2 class="text-lg font-bold">Choose your username</h2>
    <p class="text-xs text-slate-400 mt-1 mb-4">This is the name other traders see on the leaderboard. Your Google name is never shown.</p>
    <input id="nameInput" maxlength="16" autocomplete="off" placeholder="e.g. moon_trader" onkeydown="if(event.key==='Enter')submitName()" class="w-full bg-bgdark border border-slate-800 rounded-2xl px-4 py-3 font-mono font-bold focus:outline-none focus:border-mint">
    <div id="nameErr" class="text-xs text-coral mt-2 min-h-[1rem]"></div>
    <div class="flex gap-2 mt-3">
      <button id="nameCancel" onclick="closeName()" class="hidden flex-1 py-3 rounded-2xl bg-slate-800 text-sm font-semibold">Cancel</button>
      <button id="nameOk" onclick="submitName()" class="flex-1 py-3 rounded-2xl bg-mint text-black text-sm font-bold">Start trading</button>
    </div>
    <p class="text-[11px] text-slate-500 mt-3">3–16 characters: letters, numbers, underscore.</p>
  </div>
</div>

<div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithCredential,linkWithPopup,signInAnonymously,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,set,get,onValue,query,orderByChild,limitToLast,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app=initializeApp({
  apiKey:"AIzaSyD47CV7A3CBN8WprDT190YBoja77HG6NJY",
  authDomain:"advait-bd3da.firebaseapp.com",
  databaseURL:"https://advait-bd3da-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"advait-bd3da",
  storageBucket:"advait-bd3da.firebasestorage.app",
  messagingSenderId:"816232706393",
  appId:"1:816232706393:web:5aaa150277498ce2591c48"
});
const auth=getAuth(app), db=getDatabase(app), gp=new GoogleAuthProvider();
const $=id=>document.getElementById(id);

/* ---------- SHARED MARKET ----------
   Prices are a fixed function of simulated time, so every player sees the
   same price at the same moment and the leaderboard is fair. */
const START=100000, YEAR=31557600, T0=Date.UTC(2026,10,8,9,30,0)/1000, LS='chronotrade_v3';
const ASSETS=[
  {s:'BTC',n:'Bitcoin',p:76400,d:.15,v:.6},{s:'ETH',n:'Ethereum',p:2920,d:.12,v:.65},
  {s:'SOL',n:'Solana',p:198.5,d:.15,v:.75},{s:'NVDA',n:'NVIDIA',p:138.6,d:.15,v:.42},
  {s:'AAPL',n:'Apple',p:228.5,d:.08,v:.24},{s:'TSLA',n:'Tesla',p:254.2,d:.1,v:.52}
];
const A=Object.fromEntries(ASSETS.map(a=>[a.s,a]));
const PER=[11,47,420,3600,21600,86400,345600,1382400,5184000,17280000,63072000];
const WT=[.004,.008,.03,.05,.07,.08,.09,.1,.1,.1,.1];
const rnd=seed=>()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const f=(a,t)=>a.d*(t-T0)/YEAR+PER.reduce((s,P,i)=>s+a.v*WT[i]*Math.sin(6.2832*t/P+a.ph[i]),0);
ASSETS.forEach(a=>{let h=7;for(const c of a.s)h=Math.imul(h^c.charCodeAt(0),16777619);const r=rnd(h);a.ph=PER.map(()=>r()*6.2832);a.f0=f(a,T0)});
const priceAt=(a,t)=>a.p*Math.exp(f(a,t)-a.f0);

/* ---------- STATE ---------- */
const SPEEDS=[[0,'⏸'],[1,'1s'],[60,'1m'],[3600,'1h'],[86400,'1d']];
const S={uid:null,name:'',online:false,google:false,ready:false,cash:START,start:START,t:T0,speed:60,span:7200,
  sel:'BTC',side:'BUY',tab:'board',hold:{},log:[],board:[]};
let hoverIdx=null;

/* ---------- HELPERS ---------- */
const money=v=>(v<0?'-':'')+'$'+Math.abs(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>(v>=0?'+':'')+v.toFixed(2)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=t=>new Date(Math.floor(t)*1000).toISOString().slice(0,19).replace('T',' ');
const setHTML=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h}};
const px=sym=>priceAt(A[sym],S.t);
const netWorth=()=>S.cash+Object.entries(S.hold).reduce((s,[k,h])=>s+h.qty*px(k),0);
function topStr(){
  const e=Object.entries(S.hold).map(([k,h])=>[k,h.qty*px(k)]).sort((a,b)=>b[1]-a[1]);
  const tot=e.reduce((s,x)=>s+x[1],0)+S.cash;
  return e.length?e.slice(0,3).map(([k,v])=>`${k} ${Math.round(v/tot*100)}%`).join(' · '):'All cash';
}
function toast(msg,bad){
  const el=document.createElement('div');
  el.className=`px-4 py-2.5 rounded-2xl bg-card border ${bad?'border-coral/50 text-coral':'border-mint/50 text-mint'} text-xs font-medium shadow-xl`;
  el.textContent=msg;$('toasts').appendChild(el);setTimeout(()=>el.remove(),3000);
}

/* ---------- SAVE / SYNC ---------- */
async function save(){
  localStorage.setItem(LS,JSON.stringify({uid:S.uid,username:S.name,cash:S.cash,start:S.start,t:Math.floor(S.t),hold:S.hold,log:S.log}));
  if(!S.online||!S.name||!S.ready)return;
  const nw=netWorth(),now=Date.now();
  try{
    await Promise.all([
      set(ref(db,'players/'+S.uid),{username:S.name,cash:S.cash,start:S.start,t:Math.floor(S.t),hold:S.hold,log:S.log,updatedAt:now}),
      set(ref(db,'leaderboard/'+S.uid),{username:S.name,netWorth:Math.round(nw*100)/100,profitPct:Math.round((nw/S.start-1)*10000)/100,simSec:Math.floor(S.t),top:topStr(),updatedAt:now})
    ]);
    setStatus(true);
  }catch(e){setStatus(false)}
}
function setStatus(ok){
  const el=$('status');
  el.textContent=ok?'● online':'● offline (saved locally)';
  el.className='text-[10px] font-mono '+(ok?'text-mint':'text-amber-400');
}

let boardOn=false;
function listenBoard(){
  if(boardOn)return;boardOn=true;
  onValue(query(ref(db,'leaderboard'),orderByChild('netWorth'),limitToLast(30)),snap=>{
    const rows=[];snap.forEach(c=>{rows.push({uid:c.key,...c.val()})});S.board=rows;
  },()=>{});
}

/* ---------- AUTH + USERNAME ---------- */
onAuthStateChanged(auth,async user=>{
  if(!user){try{await signInAnonymously(auth)}catch(e){boot(null);toast('Guest mode is off in Firebase. Sign in with Google to play online.',true)}return}
  boot(user);
});

async function boot(user){
  S.ready=false;
  S.uid=user?user.uid:(localStorage.getItem('ct_guest')||(()=>{const g='guest_'+Math.random().toString(36).slice(2,10);localStorage.setItem('ct_guest',g);return g})());
  S.online=!!user;
  S.google=!!user?.providerData?.some(p=>p.providerId==='google.com');
  let d=null,migrated=false;
  if(user){try{const s=await get(ref(db,'players/'+S.uid));if(s.exists())d=s.val()}catch(e){S.online=false}}
  if(!d){try{const l=JSON.parse(localStorage.getItem(LS));if(l&&(l.uid===S.uid||(user&&String(l.uid).startsWith('guest_')))){d=l;migrated=l.uid!==S.uid}}catch(e){}}
  Object.assign(S,{cash:d?.cash??START,start:d?.start??START,t:d?.t??T0,hold:d?.hold||{},log:d?.log||[],name:d?.username||''});
  if(migrated&&S.online&&S.name){const n=S.name;S.name='';const r=await claim(n);S.name=r.ok?n:''}
  S.ready=true;
  if(S.online){listenBoard();setStatus(true)}else setStatus(false);
  updateAuthUI();render();
  if(!S.name)openName();else save();
}

function updateAuthUI(){
  $('uname').textContent=S.name||'Pick a username';
  $('avatar').textContent=(S.name||'?')[0].toUpperCase();
  $('googleBtn').classList.toggle('hidden',S.google);$('googleBtn').textContent=S.online?'Save with Google':'Sign in with Google';
  $('outBtn').classList.toggle('hidden',!S.google);
}

window.signInGoogle=async()=>{
  try{
    if(auth.currentUser?.isAnonymous){
      await linkWithPopup(auth.currentUser,gp); // keeps your account, adds Google login
      S.google=true;updateAuthUI();toast('Google linked. Your progress is safe.');
    }else await signInWithPopup(auth,gp);
  }catch(e){
    if(e.code==='auth/credential-already-in-use'){
      const c=GoogleAuthProvider.credentialFromError(e);
      if(S.name){set(ref(db,'usernames/'+S.name.toLowerCase()),null).catch(()=>{});set(ref(db,'leaderboard/'+S.uid),null).catch(()=>{})}
      try{await signInWithCredential(auth,c)}catch(err){toast(err.message,true)}
    }else if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)){
      toast(e.code==='auth/unauthorized-domain'?'Add this domain in Firebase Console → Auth → Authorized domains.':e.message,true);
    }
  }
};
window.signOutUser=async()=>{try{await signOut(auth)}catch(e){}toast('Signed out.')};

window.openName=()=>{
  const m=$('nameModal');m.classList.remove('hidden');m.classList.add('flex');
  $('nameInput').value=S.name;$('nameErr').textContent='';
  $('nameCancel').classList.toggle('hidden',!S.name);
  $('nameOk').textContent=S.name?'Save username':'Start trading';
  setTimeout(()=>$('nameInput').focus(),50);
};
window.closeName=()=>{$('nameModal').classList.add('hidden');$('nameModal').classList.remove('flex')};

async function claim(name){
  if(!S.online)return{ok:true};
  try{
    const r=await runTransaction(ref(db,'usernames/'+name.toLowerCase()),cur=>(cur===null||cur===S.uid)?S.uid:undefined);
    if(!r.committed)return{ok:false,err:'That username is taken. Try another.'};
    if(S.name&&S.name.toLowerCase()!==name.toLowerCase())set(ref(db,'usernames/'+S.name.toLowerCase()),null).catch(()=>{});
    return{ok:true};
  }catch(e){S.online=false;setStatus(false);toast('Server unreachable. Playing offline.',true);return{ok:true}}
}
window.submitName=async()=>{
  const v=$('nameInput').value.trim(),err=m=>{$('nameErr').textContent=m};
  if(!/^[A-Za-z0-9_]{3,16}$/.test(v))return err('Use 3–16 letters, numbers or underscores.');
  if(v===S.name)return closeName();
  $('nameOk').disabled=true;
  const r=await claim(v);
  $('nameOk').disabled=false;
  if(!r.ok)return err(r.err);
  S.name=v;closeName();updateAuthUI();render();save();toast('Welcome, '+v+'!');
};

/* ---------- TRADING ---------- */
const TAB_ON='py-2.5 rounded-xl font-bold text-xs ',TAB_OFF='text-slate-400 hover:text-white';
window.setSide=side=>{
  S.side=side;
  $('tabBuy').className=TAB_ON+(side==='BUY'?'bg-mint text-black':TAB_OFF);
  $('tabSell').className=TAB_ON+(side==='SELL'?'bg-coral text-white':TAB_OFF);
  $('go').className='w-full py-3.5 rounded-2xl font-bold text-sm transition '+(side==='BUY'?'bg-mint text-black':'bg-coral text-white');
  preview();
};
window.setTab=t=>{S.tab=t;render()};
window.quick=n=>{$('amt').value=n;preview()};
window.maxAmt=()=>{
  const q=S.hold[S.sel]?.qty||0;
  $('amt').value=Math.floor((S.side==='BUY'?S.cash:q*px(S.sel))*100)/100;preview();
};
window.frac=f=>{const q=S.hold[S.sel]?.qty||0;$('amt').value=Math.floor((S.side==='BUY'?S.cash:q*px(S.sel))*f*100)/100;preview()};
window.preview=()=>{
  const d=Math.max(0,parseFloat($('amt').value)||0);
  $('est').textContent=(d/px(S.sel)).toFixed(4)+' '+S.sel;
  $('go').textContent=(S.side==='BUY'?'Buy ':'Sell ')+S.sel;
};
window.trade=()=>{
  const d=parseFloat($('amt').value),sym=S.sel,p=px(sym);
  if(!d||d<=0)return toast('Enter an amount.',true);
  if(S.side==='BUY'){
    if(d>S.cash+.01)return toast('Not enough cash.',true);
    const spend=Math.min(S.cash,d),u=spend/p;
    S.cash-=spend;
    const h=S.hold[sym]||(S.hold[sym]={qty:0,avgCost:0});
    h.avgCost=(h.qty*h.avgCost+spend)/(h.qty+u);h.qty+=u;
    toast(`Bought ${money(spend)} of ${sym}`);logT('BUY',sym,spend,p);
  }else{
    const h=S.hold[sym],val=(h?.qty||0)*p;
    if(val<.01)return toast(`You don't own any ${sym}.`,true);
    const sell=Math.min(val,d);
    h.qty-=sell/p;S.cash+=sell;
    if(h.qty<=1e-6)delete S.hold[sym];
    toast(`Sold ${money(sell)} of ${sym}`);logT('SELL',sym,sell,p);
  }
  render();save();
};
const logT=(side,sym,usd,p)=>{S.log.unshift({t:Math.floor(S.t),side,sym,usd:Math.round(usd*100)/100,p:Math.round(p*100)/100});S.log=S.log.slice(0,30)};
window.resetAccount=()=>{
  if(!confirm('Reset your cash, investments and date? Your username stays.'))return;
  Object.assign(S,{cash:START,start:START,t:T0,hold:{},log:[]});render();save();toast('Portfolio reset.');
};
function setSpeed(v){
  S.speed=v;if(v>0)S.span=Math.max(3600,v*120);
  $('speedBtns').innerHTML=SPEEDS.map(([s,l])=>`<button data-sp="${s}" class="px-2.5 py-1 rounded-lg ${s===v?'bg-mint text-black font-bold':'bg-slate-800 text-slate-400 hover:text-white'}" title="${s?'1 real second = '+({1:'1 second',60:'1 minute',3600:'1 hour',86400:'1 day'}[s]):'Pause'}">${s?'1s = '+l:l}</button>`).join('');
}

/* ---------- RENDER ---------- */
const chg=a=>(priceAt(a,S.t)/priceAt(a,S.t-S.span)-1)*100;
const pillCls=on=>'p-3 rounded-2xl border text-left transition '+(on?'bg-slate-800 border-mint':'bg-card border-slate-800 hover:border-slate-700');

function render(){
  $('clock').textContent=fmtT(S.t);
  const nw=netWorth(),pr=nw-S.start,up=pr>=0;
  $('nw').textContent=money(nw);$('cash').textContent=money(S.cash);
  $('profit').textContent=`${up?'+':''}${money(pr)} (${pct(pr/S.start*100)})`;
  $('profit').className='text-xs font-mono font-semibold mt-1 '+(up?'text-mint':'text-coral');

  ASSETS.forEach(a=>{
    const c=chg(a);
    $('pill-'+a.s).className=pillCls(a.s===S.sel);
    $('pc-'+a.s).textContent=money(priceAt(a,S.t));
    $('pp-'+a.s).textContent=pct(c);
    $('pp-'+a.s).className='text-[10px] font-mono '+(c>=0?'text-mint':'text-coral');
  });

  const a=A[S.sel],c=chg(a),own=S.hold[S.sel]?.qty||0;
  $('cName').textContent=a.n;$('cTick').textContent=a.s;
  $('cPrice').textContent=money(priceAt(a,S.t));
  $('cChg').textContent=pct(c);$('cChg').className='text-xs font-mono font-semibold '+(c>=0?'text-mint':'text-coral');
  $('cOwn').innerHTML=`You own <span class="text-white font-semibold">${own.toFixed(4)} ${a.s}</span><br>${money(own*priceAt(a,S.t))}`;
  preview();

  $('tabBoard').className='py-2 rounded-xl '+(S.tab==='board'?'bg-slate-700 text-white':TAB_OFF);
  $('tabHold').className='py-2 rounded-xl '+(S.tab==='hold'?'bg-slate-700 text-white':TAB_OFF);
  $('tabLog').className='py-2 rounded-xl '+(S.tab==='log'?'bg-slate-700 text-white':TAB_OFF);
  setHTML($('listBox'),S.tab==='board'?boardHTML(nw):S.tab==='hold'?holdHTML():logHTML());
  drawChart();
}

function boardHTML(nw){
  let rows=S.board.filter(r=>r.uid!==S.uid);
  if(S.name)rows.push({uid:S.uid,username:S.name,netWorth:nw,profitPct:(nw/S.start-1)*100,simSec:S.t,top:topStr(),me:true});
  rows.sort((x,y)=>y.netWorth-x.netWorth);
  if(!rows.length)return'<div class="text-xs text-slate-500 py-8 text-center">No traders yet.</div>';
  const medal=['🥇','🥈','🥉'];
  return rows.map((r,i)=>`
    <div class="p-3 rounded-2xl border ${r.me?'bg-mint/10 border-mint/40':'bg-bgdark border-slate-800'} flex items-center gap-3">
      <div class="w-6 text-center text-sm font-mono text-slate-400">${medal[i]||i+1}</div>
      <div class="min-w-0 flex-1">
        <div class="text-sm font-bold truncate">${esc(r.username)}${r.me?' <span class="text-[10px] text-mint font-normal">you</span>':''}</div>
        <div class="text-[10px] font-mono text-slate-500 truncate">${esc(r.top||'')} · ${fmtT(r.simSec||T0).slice(0,10)}</div>
      </div>
      <div class="text-right font-mono">
        <div class="text-sm font-bold">${money(r.netWorth)}</div>
        <div class="text-[10px] ${r.profitPct>=0?'text-mint':'text-coral'}">${pct(r.profitPct||0)}</div>
      </div>
    </div>`).join('');
}

function logHTML(){
  if(!S.log.length)return'<div class="text-xs text-slate-500 py-8 text-center">No trades yet.</div>';
  return S.log.map(x=>`<div class="p-3 rounded-2xl bg-bgdark border border-slate-800 flex justify-between items-center"><div><div class="text-sm font-bold ${x.side==='BUY'?'text-mint':'text-coral'}">${x.side} ${x.sym}</div><div class="text-[10px] font-mono text-slate-500">${fmtT(x.t)}</div></div><div class="text-right font-mono"><div class="text-sm font-bold">${money(x.usd)}</div><div class="text-[10px] text-slate-400">@ ${money(x.p)}</div></div></div>`).join('');
}
function holdHTML(){
  const e=Object.entries(S.hold);
  if(!e.length)return'<div class="text-xs text-slate-500 py-8 text-center">Nothing yet. Pick an asset and buy.</div>';
  return e.map(([sym,h])=>{
    const val=h.qty*px(sym),pnl=val-h.qty*h.avgCost,pp=pnl/(h.qty*h.avgCost)*100;
    return`<div data-sym="${sym}" class="p-3 rounded-2xl bg-bgdark border border-slate-800 hover:border-slate-700 flex items-center justify-between cursor-pointer">
      <div><div class="font-bold text-sm">${sym}</div><div class="text-[11px] font-mono text-slate-400">${h.qty.toFixed(4)} units</div></div>
      <div class="text-right font-mono"><div class="text-sm font-bold">${money(val)}</div>
      <div class="text-[11px] ${pnl>=0?'text-mint':'text-coral'}">${pnl>=0?'+':''}${money(pnl)} (${pct(pp)})</div></div></div>`;
  }).join('');
}

/* ---------- CHART ---------- */
const N=90,tAt=i=>S.t-S.span*(1-i/(N-1));
function drawChart(){
  const cv=$('chart'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
  if(!r.width)return;
  cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.scale(dpr,dpr);
  const W=r.width,H=r.height,a=A[S.sel];
  const d=Array.from({length:N},(_,i)=>priceAt(a,tAt(i)));
  let min=Math.min(...d),max=Math.max(...d);if(max===min){max*=1.01;min*=.99}
  const pad=18,X=i=>i/(N-1)*W,Y=v=>pad+(H-pad*2)*(1-(v-min)/(max-min));
  const up=d[N-1]>=d[0],col=up?'#00d09c':'#ff5252';
  ctx.beginPath();d.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
  ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,up?'rgba(0,208,156,.22)':'rgba(255,82,82,.22)');g.addColorStop(1,'rgba(11,14,20,0)');
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='#64748b';ctx.font='10px "JetBrains Mono"';
  ctx.textAlign='right';ctx.fillText(money(max),W-4,12);ctx.fillText(money(min),W-4,H-4);
  ctx.textAlign='left';ctx.fillText(fmtT(tAt(0)).slice(5,16),4,H-4);
  const h=S.hold[a.s];
  if(h&&h.avgCost>=min&&h.avgCost<=max){
    const y=Y(h.avgCost);ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle='#64748b';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    ctx.fillStyle='#94a3b8';ctx.font='10px "JetBrains Mono"';ctx.fillText('Your avg '+money(h.avgCost),8,y-6);ctx.restore();
  }
  const box=$('hover');
  if(hoverIdx!==null){
    const x=X(hoverIdx),y=Y(d[hoverIdx]);
    ctx.strokeStyle='#475569';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,4.5,0,6.2832);ctx.fillStyle=col;ctx.fill();
    box.classList.remove('hidden');
    box.innerHTML=`<span class="text-white font-bold">${money(d[hoverIdx])}</span> <span class="text-slate-400">${fmtT(tAt(hoverIdx))}</span>`;
  }else box.classList.add('hidden');
}

/* ---------- INIT ---------- */
ASSETS.forEach(a=>{
  $('pills').insertAdjacentHTML('beforeend',`<button id="pill-${a.s}" data-sym="${a.s}"><div class="flex justify-between"><span class="font-bold text-xs">${a.s}</span><span id="pp-${a.s}"></span></div><div id="pc-${a.s}" class="font-mono font-semibold text-sm mt-1 truncate"></div></button>`);
});
// pointerdown (not click) so selection still works while the UI refreshes
const pick=e=>{const el=e.target.closest('[data-sym]');if(el){S.sel=el.dataset.sym;render()}};
$('pills').addEventListener('pointerdown',pick);
$('listBox').addEventListener('pointerdown',pick);
$('speedBtns').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-sp]');if(b)setSpeed(+b.dataset.sp)});

const cv=$('chart');
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();hoverIdx=Math.max(0,Math.min(N-1,Math.round((e.clientX-r.left)/r.width*(N-1))));drawChart()});
cv.addEventListener('pointerleave',()=>{hoverIdx=null;drawChart()});
window.addEventListener('resize',drawChart);

setSpeed(60);setSide('BUY');render();

let last=performance.now(),lastR=0,lastS=0;
(function loop(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(S.speed>0)S.t+=dt*S.speed;
  if(now-lastR>250){lastR=now;render()}
  if(now-lastS>10000){lastS=now;save()}
  requestAnimationFrame(loop);
})(performance.now());
window.addEventListener('beforeunload',save);
</script>
</body>
</html>
