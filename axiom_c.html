<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<style>html{color-scheme:dark;background:#07080a}[hidden]{display:none!important}img{max-width:100%}</style>
<title>AXIOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: collapsible glass sidebar + stacked glass panels; bottom nav on phones */
  --bg:#07080a; --ink:#eceef1; --silver:#c9ced6; --mute:#8c929c; --dim:#5d636d;
  --line:rgba(214,220,230,.14); --line2:rgba(214,220,230,.3);
  --glass:rgba(255,255,255,.045); --glass-hi:rgba(255,255,255,.09);
  --good:#9ccdb2; --warn:#d8bd7e; --bad:#d99a9a;
  --display:'Italiana','Cormorant Garamond',Georgia,serif;
  --body:'Jost','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 50% at 82% -5%,rgba(150,160,176,.09),transparent 70%),
  radial-gradient(55% 45% at -5% 105%,rgba(120,130,152,.08),transparent 70%),
  radial-gradient(40% 40% at 50% 45%,rgba(255,255,255,.025),transparent 70%)}
.fog{position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);background:rgba(170,178,194,.06);animation:drift 30s ease-in-out infinite alternate;pointer-events:none}
.fog.a{width:46vw;height:46vw;left:-10vw;top:10vh}
.fog.b{width:38vw;height:38vw;right:-8vw;bottom:-6vh;animation-duration:38s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(8vw,-6vh) scale(1.18)}}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .35s cubic-bezier(.3,.7,.2,1)}
.app.col{grid-template-columns:76px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%);z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 22px}
.brand svg{flex:none}
.brand b{font:400 26px/1 var(--display);letter-spacing:.2em;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:14px;border:1px solid transparent;background:none;padding:11px 12px;border-radius:12px;color:var(--mute);text-align:left;transition:.25s}
.nav button svg{flex:none;width:20px;height:20px}
.nav button:hover{color:var(--ink);background:var(--glass)}
.nav button[aria-current=page]{color:var(--ink);background:var(--glass-hi);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.nav span{white-space:nowrap;overflow:hidden}
.side .grow{flex:1}
.collapse{display:flex;align-items:center;gap:14px;border:0;background:none;color:var(--dim);padding:10px 12px;border-radius:12px}
.collapse:hover{color:var(--ink)}
.collapse svg{transition:transform .35s}
.app.col .collapse svg{transform:rotate(180deg)}
.app.col .brand div,.app.col .nav span,.app.col .collapse span,.app.col .sidenote{display:none}
.sidenote{font-size:11.5px;color:var(--dim);padding:0 10px 8px;line-height:1.4}
.acct{margin:0 0 8px}
.acctb{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:8px 10px;text-align:left;transition:.25s}
.acctb:hover{background:var(--glass-hi);border-color:var(--line2)}
.acctb .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:500 14px var(--body);font-style:normal;background:linear-gradient(145deg,#f1f3f6,#8e95a0);color:#0a0b0d}
.acctb .lbl{min-width:0}
.acctb b{display:block;font-weight:500;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctb small{display:block;font-size:11.5px;color:var(--mute);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app.col .acctb .lbl{display:none}
.app.col .acctb{padding:8px;justify-content:center}
.main{padding:28px clamp(16px,3.2vw,44px) 56px;min-width:0;max-width:1240px;width:100%;margin:0 auto}

/* glass */
.panel{position:relative;border-radius:22px;border:1px solid var(--line);padding:22px;min-width:0;background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.022) 55%,rgba(255,255,255,.04));backdrop-filter:blur(20px) saturate(125%);-webkit-backdrop-filter:blur(20px) saturate(125%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 24px 60px -20px rgba(0,0,0,.7)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 28%)}
.panel>*{position:relative}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.title{font:400 clamp(30px,4.6vw,46px)/1.08 var(--display);letter-spacing:.01em;text-wrap:balance}
.h2{font:400 22px/1.2 var(--display);letter-spacing:.03em}
.sub{color:var(--mute);font-size:14px}
.head{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g-today{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-bal{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
@media (max-width:1020px){.g-today,.g-bal,.g2{grid-template-columns:minmax(0,1fr)}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));padding:9px 16px;border-radius:12px;font-weight:500;transition:.25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.btn:hover{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.ghost{background:none;box-shadow:none;border-color:var(--line)}
.btn.ghost:hover{background:var(--glass)}
.btn.danger{border-color:rgba(217,154,154,.4);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute);transition:.2s;padding:0}
.icon:hover:not(:disabled){color:var(--ink);background:var(--glass-hi)}
.icon:disabled{opacity:.3;cursor:default}
.icon svg{width:17px;height:17px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:rgba(0,0,0,.25)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--glass-hi);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--silver);background:rgba(0,0,0,.2);white-space:nowrap}
.chip.good{color:var(--good)}.chip.bad{color:var(--bad)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.field input,.field select,.field textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--line2);outline:none;box-shadow:0 0 0 3px rgba(201,206,214,.12)}
.field .err{color:var(--bad);font-size:13px}
.field .err:empty,.err:empty{display:none}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.field textarea{font-family:var(--mono);font-size:12px;min-height:130px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
.note{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px;color:var(--mute);font-size:13.5px}

/* today */
.ringwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative}
.ring{width:168px;height:168px;flex:none}
.ring .arc{transition:stroke-dasharray 1.1s cubic-bezier(.2,.7,.2,1)}
.ringnum{position:absolute;left:0;top:0;width:168px;height:168px;display:grid;place-content:center;text-align:center;pointer-events:none}
.ringnum b{font:400 44px/1 var(--display);display:block}
.ringnum small{color:var(--mute);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.facts{display:grid;gap:12px;flex:1;min-width:140px}
.fact b{font:500 22px/1.1 var(--mono);display:block}
.fact span{font-size:12.5px;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:112px}
.wk{display:grid;grid-template-rows:1fr auto;gap:6px;border:0;background:none;padding:0;height:100%;min-width:0}
.wk i{display:block;align-self:end;border-radius:8px 8px 4px 4px;background:rgba(255,255,255,.26);min-height:4px;transition:height 1s cubic-bezier(.2,.7,.2,1),filter .2s}
.wk i.nd{background:rgba(255,255,255,.08)}
.wk:hover i{filter:brightness(1.3)}
.wk span{font-size:11.5px;color:var(--mute);text-align:center}
.wk.sel span{color:var(--ink);font-weight:600}
.wk.sel i{background:#d9dde3}
.cats{display:grid;gap:12px}
.cat{display:grid;grid-template-columns:104px 1fr 38px;gap:12px;align-items:center;font-size:14px}
.cat em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--mute);text-align:right}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;min-width:0}
.bar i{display:block;height:100%;border-radius:9px;background:rgba(222,226,232,.8);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.2);transition:.3s}
.row:hover{border-color:var(--line2);background:rgba(255,255,255,.04)}
.row.done{background:rgba(255,255,255,.055)}
.chk{width:30px;height:30px;border-radius:10px;border:1.5px solid var(--line2);background:rgba(0,0,0,.3);display:grid;place-items:center;padding:0;transition:.25s;color:transparent}
.chk svg{width:16px;height:16px}
.chk[aria-checked=true]{background:#d9dde3;color:#0a0b0d;border-color:#d9dde3}
.row .nm{font-weight:500;transition:.25s;overflow-wrap:anywhere}
.row.done .nm{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.row .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:3px}
.row .bar{margin-top:9px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:62px;text-align:center;font:500 13px var(--mono)}
.flame{color:var(--warn)}
.empty{text-align:center;padding:34px 16px;color:var(--mute);display:grid;gap:12px;justify-items:center}
.empty b{font:400 22px var(--display);color:var(--ink)}
.empty span{max-width:46ch}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* habits */
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.2)}
.reorder{display:grid;gap:4px}
.reorder .icon{width:28px;height:24px;border-radius:8px}
.strip{display:flex;gap:3px;margin-top:10px;flex-wrap:nowrap}
.strip i{flex:1;height:14px;min-width:3px;border-radius:3px;background:rgba(255,255,255,.07)}
.strip i.on{background:rgba(236,238,241,.78)}
.strip i.part{background:rgba(236,238,241,.32)}
.strip i.na{background:transparent;border:1px dashed rgba(255,255,255,.08)}
.acts{display:flex;gap:6px}
@media (max-width:560px){.hrow{grid-template-columns:auto minmax(0,1fr)}.hrow .acts{grid-column:1/-1;justify-content:flex-end}}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:rgba(255,255,255,.08);stroke-width:1}
.chart .tick{fill:var(--mute);font:11px var(--mono)}
.chart .axl{fill:var(--mute);font:11px var(--body)}
.chart .bar{fill:rgba(236,238,241,.4);transition:fill .2s}
.chart .bar.hot{fill:rgba(255,255,255,.92)}
.chart .bar:hover{fill:#fff}
.anim .chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.chart .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.anim .chart .ln{animation:draw 1.3s cubic-bezier(.4,.1,.2,1) both}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12.5px;background:none;color:var(--silver);transition:.2s}
.legend button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.legend button[aria-pressed=false]{opacity:.38}
.hbar{display:grid;grid-template-columns:minmax(80px,1.1fr) 2fr 52px;gap:12px;align-items:center;font-size:14px;margin-bottom:11px}
.hbar em{font:normal 12.5px var(--mono);color:var(--mute);text-align:right}
.hbar span{overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile b{font:400 34px/1 var(--display);display:block;margin:6px 0 4px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}

/* balance */
.radarwrap{display:grid;place-items:center}
.radar{width:100%;max-width:520px;height:auto;overflow:visible}
.radar .ring5{fill:none;stroke:rgba(255,255,255,.09)}
.radar .axis{stroke:rgba(255,255,255,.1)}
.radar .shape{fill:rgba(236,238,241,.1);stroke:#d9dde3;stroke-width:1.5;stroke-linejoin:round}
.radar .cmp{fill:none;stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 4}
.radar .nm{fill:var(--silver);font:500 12px var(--body);letter-spacing:.12em;text-transform:uppercase}
.radar .sc{fill:#fff;font:500 15px var(--mono)}
.radar .sc.off{fill:var(--dim)}
.area{display:grid;gap:7px;margin-bottom:16px}
.area .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.area b{font:500 16px var(--mono)}
.area b.off{font:400 13px var(--body);color:var(--mute)}
.area small{color:var(--mute);font-size:12.5px}
.insight{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.insight div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(0,0,0,.2);min-width:0}
.insight b{display:block;font:500 17px var(--mono)}
.insight span{font-size:12px;color:var(--mute)}
@media (max-width:480px){.insight{grid-template-columns:1fr}}
.snap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.snap:last-child{border:0}
.snap .mono{color:var(--mute);font-size:12.5px}
.snap .sub{font-size:12.5px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow b{font:500 14px var(--mono)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input[type=number],.inline input[type=text]{flex:1;min-width:110px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:8px 12px}

/* modal + toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(2,3,4,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s}
.modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:#0d0f12;animation:rise .35s cubic-bezier(.2,.7,.2,1)}
.modal .phead{margin-bottom:18px}
.mfoot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(0,0,0,.25);display:grid;gap:4px;font-size:13.5px;color:var(--mute)}
.cbox b{color:var(--ink);font-weight:500}
@media (max-width:480px){.cmpgrid{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);opacity:0;background:rgba(20,22,26,.92);border:1px solid var(--line2);padding:10px 18px;border-radius:99px;z-index:90;transition:.35s;pointer-events:none;backdrop-filter:blur(12px);font-size:14px;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.enter>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.08s}.enter>*:nth-child(3){animation-delay:.16s}.enter>*:nth-child(4){animation-delay:.24s}.enter>*:nth-child(5){animation-delay:.32s}.enter>*:nth-child(6){animation-delay:.4s}
.enter .g-today>*,.enter .g-bal>*,.enter .g2>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.enter .g-today>*:nth-child(2),.enter .g-bal>*:nth-child(2),.enter .g2>*:nth-child(2){animation-delay:.12s}

/* intro */
#splash{position:fixed;inset:0;z-index:100;background:#030304;display:grid;place-items:center;overflow:hidden;transition:opacity .9s ease .3s,visibility 0s linear 1.2s}
#splash::before{content:"";position:absolute;inset:0;background:radial-gradient(48% 40% at 50% 50%,rgba(150,160,178,.07),transparent 72%);animation:glow 3s ease-in-out both}
@keyframes glow{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(75% 65% at 50% 50%,transparent 30%,rgba(0,0,0,.85))}
.streak{position:absolute;left:0;width:100%;height:1px;opacity:0;background:linear-gradient(90deg,transparent,rgba(230,234,242,.85),transparent);animation:sweep 2.1s cubic-bezier(.5,.1,.3,1) forwards}
.s1{top:46%;animation-delay:.2s}.s2{top:56%;animation-delay:.75s}
@keyframes sweep{0%{transform:translateX(-60%) scaleX(.4);opacity:0}35%{opacity:.85}100%{transform:translateX(60%) scaleX(1);opacity:0}}
.splashc{position:relative;text-align:center;padding:0 16px;transition:opacity .6s ease,transform .8s ease,filter .6s ease}
#splash.out .splashc{opacity:0;transform:scale(1.07);filter:blur(5px)}
.wm{display:flex;justify-content:center;font:400 clamp(34px,8.5vw,64px)/1 var(--display);letter-spacing:.26em;padding-left:.26em;color:#e6e9ee}
.wm span{opacity:0;filter:blur(16px);transform:translateY(12px) scale(1.08);animation:letter 1.2s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.55s + var(--i)*.13s)}
@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
.rule{display:block;height:1px;width:min(64vw,300px);margin:24px auto 0;background:linear-gradient(90deg,transparent,rgba(224,229,238,.85),transparent);transform:scaleX(0);animation:rule 1.1s cubic-bezier(.6,.1,.2,1) 1.55s forwards}

/* phone nav */
@media (max-width:760px){
  .app,.app.col{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);border-right:0;border-top:1px solid var(--line);background:rgba(10,11,13,.82)}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
'use strict';
/* =====================================================================
   CONSTANTS AND HELPERS
   ===================================================================== */
var VERSION=2,KEY='axiom.v1',ACC='axiom.u.',BAK='axiom.backup';
var BASE=5; // display baseline (1-100 scale) for areas that have no habits yet
var DIMS=[{k:'health',n:'Health',c:'#9ec9c1'},{k:'studies',n:'Studies',c:'#a9b8e6'},{k:'career',n:'Career',c:'#d8c79f'},{k:'finances',n:'Finances',c:'#b4d29b'},{k:'relationships',n:'Relationships',c:'#dba9bf'}];
var UNC={k:'uncategorized',n:'Uncategorized',c:'#9097a2'};
var CATS=DIMS.concat([UNC]),DIM={};CATS.forEach(function(d){DIM[d.k]=d});
var VIEWS=[['today','Today'],['habits','Habits'],['analytics','Analytics'],['balance','Life Balance'],['settings','Settings']];
var SAMPLE_IDS={h1:1,h2:1,h3:1,h4:1,h5:1,h6:1,h7:1,h8:1,h9:1};
var I={
 today:'<path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/>',
 habits:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.3 1.3L7 5M3.5 12l1.3 1.3L7 11M3.5 18l1.3 1.3L7 17"/>',
 analytics:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 balance:'<path d="m12 3 8.5 6.2-3.2 10H6.7l-3.2-10L12 3Z"/><path d="M12 3v8l-5.3 8.2M12 11l5.3 8.2M12 11l8.5-1.8M12 11 3.5 9.2" opacity=".5"/>',
 settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4Z"/>',
 up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 left:'<path d="m15 6-6 6 6 6"/>',right:'<path d="m9 6 6 6-6 6"/>',
 flame:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.2 2-4 0 2 1 2.5 1.5 2.5C10 9 11 6 12 3Z"/>'
};
function ic(n,s){s=s||20;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>'}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Number.isInteger(n)?String(n):String(Math.round(n*10)/10)}
function pc(n){return Math.round(n*100)}
function pad(n){return (n<10?'0':'')+n}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(k,n){var d=pd(k);d.setDate(d.getDate()+n);return dk(d)}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function todayK(){return dk(new Date())}
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function longDate(k){return pd(k).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function shortDate(k){return pd(k).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function uid(){return 'h'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36)}
function listOf(x){return Array.isArray(x)?x.filter(Boolean):(x&&typeof x==='object'?Object.keys(x).map(function(k){return x[k]}):[])}
function num(x,d){if(x===null||x===undefined||x==='')return d;x=Number(x);return isFinite(x)?x:d}
function isKey(k){return typeof k==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(k)}

/* =====================================================================
   DATA MODULE: state shape, validation, migration, local persistence.
   Everything that touches localStorage lives here.
   State: {v,habits,log,history,savings,settings:{name},updatedAt,
           meta:{owner,dirty,base,collapsed,intro}}   (meta never leaves this device)
   ===================================================================== */
var memOnly=false;
function emptyState(owner){return {v:VERSION,habits:[],log:{},history:[],savings:[],settings:{name:''},updatedAt:0,meta:{owner:owner||null,dirty:false,base:0,collapsed:false,intro:true,copyAsked:false}}}
function isBlank(s){return !s.habits.length&&!s.history.length&&!s.savings.length&&!Object.keys(s.log).length}

/* Validate and migrate any incoming object (old local data, cloud data, imports). Never throws. */
function normalise(raw){
  var o=(raw&&typeof raw==='object')?raw:{};
  var s=emptyState(null);
  var demo=!!o.demo; // v1 builds shipped illustrative sample data; it is removed here
  var oldSet=(o.settings&&typeof o.settings==='object')?o.settings:{};
  var src=(o.log&&typeof o.log==='object')?o.log:{},log={};
  Object.keys(src).forEach(function(k){
    if(!isKey(k)||!src[k]||typeof src[k]!=='object')return;
    var d={};Object.keys(src[k]).forEach(function(id){var v=num(src[k][id],0);if(v>0)d[id]=v});
    if(Object.keys(d).length)log[k]=d;
  });
  var seen={};
  var habits=listOf(o.habits).map(function(h){
    if(!h||typeof h!=='object')return null;
    var id=String(h.id||'');
    if(!/^[A-Za-z0-9_-]{1,40}$/.test(id)||seen[id])return null;
    if(demo&&SAMPLE_IDS[id])return null;
    var name=String(h.name||'').trim().slice(0,40);if(!name)return null;
    var type=h.type==='count'?'count':'check';
    var cat=DIM[h.cat]?h.cat:'uncategorized';
    seen[id]=1;
    return {id:id,name:name,type:type,
      target:type==='count'?Math.min(9999,Math.max(1,Math.round(num(h.target,1)))):1,
      unit:type==='count'?String(h.unit||'').slice(0,14):'',
      cat:cat,created:isKey(h.created)?h.created:null};
  }).filter(Boolean);
  Object.keys(log).forEach(function(k){
    Object.keys(log[k]).forEach(function(id){if(!seen[id])delete log[k][id]});
    if(!Object.keys(log[k]).length)delete log[k];
  });
  habits.forEach(function(h){
    var first=null;Object.keys(log).forEach(function(k){if(log[k][h.id]&&(first===null||k<first))first=k});
    if(!h.created)h.created=first||todayK();
    else if(first&&first<h.created)h.created=first;
  });
  s.habits=habits;s.log=log;
  s.history=demo?[]:listOf(o.history).map(function(h){
    if(!h||!isKey(h.date)||!h.scores||typeof h.scores!=='object')return null;
    var sc={};DIMS.forEach(function(d){sc[d.k]=num(h.scores[d.k],null)});
    return {date:h.date,range:h.range===30?30:7,scores:sc,scale:h.scale===100?100:10,src:h.scale===100?'auto':'manual'};
  }).filter(Boolean).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.range-b.range});
  s.savings=demo?[]:listOf(o.savings).map(function(x){
    if(!x||!isKey(x.date))return null;var a=num(x.amount,0);return a>0?{date:x.date,amount:a}:null;
  }).filter(Boolean);
  s.settings={name:String(oldSet.name||'').slice(0,30)};
  s.updatedAt=num(o.updatedAt,0);
  if(o.scores&&typeof o.scores==='object'&&!o.legacy)s.legacy={scores:o.scores}; // old manual sliders are kept, no longer used
  else if(o.legacy)s.legacy=o.legacy;
  var m=(o.meta&&typeof o.meta==='object')?o.meta:{};
  s.meta={owner:(typeof m.owner==='string'&&m.owner)?m.owner:null,dirty:!!m.dirty,base:num(m.base,0),
    collapsed:m.collapsed!==undefined?!!m.collapsed:!!oldSet.collapsed,
    intro:m.intro!==undefined?!!m.intro:oldSet.intro!==false,copyAsked:!!m.copyAsked};
  return s;
}
function exportable(st){return {v:VERSION,habits:st.habits,log:st.log,history:st.history,savings:st.savings,settings:{name:st.settings.name},updatedAt:st.updatedAt}}
function persist(){try{localStorage.setItem(S.meta.owner?ACC+S.meta.owner:KEY,JSON.stringify(S));memOnly=false}catch(e){memOnly=true}}  // device store = KEY, account cache = ACC+uid
function loadLocal(){
  var txt=null,raw=null;
  try{txt=localStorage.getItem(KEY);if(txt)raw=JSON.parse(txt)}catch(e){raw=null}
  if(!raw||typeof raw!=='object')return {s:emptyState(null),migrated:false};
  var migrated=!(raw.v>=VERSION);
  if(migrated){try{if(!localStorage.getItem(KEY+'.pre-v2'))localStorage.setItem(KEY+'.pre-v2',txt)}catch(e){}}
  return {s:normalise(raw),migrated:migrated};
}
function loadAccount(uidv){try{var t=localStorage.getItem(ACC+uidv);return t?normalise(JSON.parse(t)):null}catch(e){return null}}
function getBackups(){try{var a=JSON.parse(localStorage.getItem(BAK)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function addBackup(label,st){try{var a=getBackups();a.unshift({at:Date.now(),label:label,data:exportable(st)});localStorage.setItem(BAK,JSON.stringify(a.slice(0,5)))}catch(e){}}
function touch(){S.updatedAt=Date.now();S.meta.dirty=true;persist();cloudPush()}   // a real data change

var boot0=loadLocal(),S=boot0.s;
if(S.meta.owner){ // an earlier build kept account data in the device slot: keep a cached copy for that account and leave the device copy in place
  try{localStorage.setItem(ACC+S.meta.owner,JSON.stringify(S))}catch(e){}
  S.meta.owner=null;S.meta.dirty=false;S.meta.base=0;persist();
}else if(boot0.migrated)persist();

/* =====================================================================
   STATS (only ever computed from recorded habits and check-ins)
   A habit counts from the day it was created. Days before that are not data.
   ===================================================================== */
function val(h,k){return (S.log[k]||{})[h.id]||0}
function done(h,k){return val(h,k)>=h.target}
function active(k){return S.habits.filter(function(h){return h.created<=k})}
function dayStat(k){var a=active(k);if(!a.length)return null;var d=a.filter(function(h){return done(h,k)}).length;return {d:d,n:a.length,p:d/a.length}}
function dayPct(k){var s=dayStat(k);return s?s.p:null}
function agg(days,end,filter){
  var d=0,n=0;
  for(var i=0;i<days;i++){var k=addDays(end,-i);
    S.habits.forEach(function(h){if(h.created<=k&&(!filter||filter(h))){n++;if(done(h,k))d++}});}
  return {d:d,n:n,p:n?d/n:null};
}
function avgPct(days,end){return agg(days,end||todayK()).p}
function rate(h,days,end){return agg(days,end||todayK(),function(x){return x===h}).p}
function catRate(cat,days,end){return agg(days,end||todayK(),function(h){return h.cat===cat}).p}
function streak(h){var k=todayK();if(!done(h,k))k=addDays(k,-1);var n=0;while(k>=h.created&&done(h,k)&&n<2000){n++;k=addDays(k,-1)}return n}
function trackedDays(){if(!S.habits.length)return 0;var f=S.habits.reduce(function(m,h){return h.created<m?h.created:m},todayK());return diffDays(f,todayK())+1}
function delta(a,b){
  if(a===null||b===null)return '<span class="chip">no comparison yet</span>';
  var p=Math.round((a-b)*100);if(p===0)return '<span class="chip">no change</span>';
  return '<span class="chip '+(p>0?'good':'bad')+'">'+(p>0?'▲ +':'▼ ')+p+' pts</span>';
}
/* Life Balance score per area: completed check-ins / eligible check-ins in the period, scaled 1-100.
   An area with no eligible check-ins is unscored (null). */
function balance(range){
  var out={};
  DIMS.forEach(function(d){
    var a=agg(range,todayK(),function(h){return h.cat===d.k});
    out[d.k]={n:a.n,d:a.d,habits:S.habits.filter(function(h){return h.cat===d.k}).length,score:a.n?Math.max(1,Math.round(a.p*100)):null};
  });
  return out;
}
function snapId(h){return h.date+'|'+h.range}
function snapVal(h,k){var v=h.scores[k];return (v===null||v===undefined)?null:(h.scale===10?v*10:v)}

/* =====================================================================
   UI STATE
   ===================================================================== */
var ui={view:'today',date:todayK(),range:7,brange:7,dims:{health:1,studies:1,career:1,finances:1,relationships:1},modal:null,confirm:'',wipe:null,lastView:'',force:false};
function routeFromHash(){var h=(location.hash||'').replace('#','');return VIEWS.some(function(v){return v[0]===h})?h:'today'}
ui.view=routeFromHash();
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2800)}

/* =====================================================================
   CHARTS (hand-drawn SVG)
   ===================================================================== */
function barChart(items,every,label){
  var W=640,H=210,L=40,R=6,T=10,B=26,pw=W-L-R,ph=H-T-B,n=items.length,g=n>14?3:10,bw=(pw-g*(n-1))/n;
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(label)+'">';
  [0,.5,1].forEach(function(v){var y=T+ph*(1-v);s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tick" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+(v*100)+'%</text>'});
  items.forEach(function(it,i){
    var x=L+i*(bw+g);
    if(it.v!==null){var h=Math.max(2,ph*it.v),y=T+ph-h;
      s+='<rect class="bar'+(it.hot?' hot':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+Math.min(4,bw/2).toFixed(1)+'" style="animation-delay:'+(i*14)+'ms"><title>'+esc(it.title)+'</title></rect>'}
    if(i%every===0)s+='<text class="axl" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(it.label)+'</text>';
  });
  return s+'</svg>';
}
function lineChart(series,labels,ymax,ytick,label){
  var W=640,H=220,L=40,R=14,T=12,B=26,pw=W-L-R,ph=H-T-B,n=series[0].pts.length;
  var X=function(i){return L+(n===1?pw/2:pw*i/(n-1))},Y=function(v){return T+ph*(1-v/ymax)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(label)+'">';
  [0,.5,1].forEach(function(f){var y=T+ph*(1-f);s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tick" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+ytick(ymax*f)+'</text>'});
  labels.forEach(function(l){s+='<text class="axl" x="'+X(l.i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(l.i===0?'start':l.i===n-1?'end':'middle')+'">'+esc(l.t)+'</text>'});
  series.forEach(function(se){
    var d='',pen=false,last=-1;
    se.pts.forEach(function(v,i){if(v===null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true;last=i});
    if(last<0)return;
    s+='<path class="ln" pathLength="1" d="'+d+'" stroke="'+se.c+'"/>';
    s+='<circle cx="'+X(last).toFixed(1)+'" cy="'+Y(se.pts[last]).toFixed(1)+'" r="4.5" fill="'+se.c+'" stroke="#07080a" stroke-width="2"><title>'+esc(se.name+': '+ytick(se.pts[last]))+'</title></circle>';
  });
  return s+'</svg>';
}
function radar(b,cmp){
  var W=460,H=380,cx=230,cy=190,R=114,N=5;
  var ang=function(i){return -Math.PI/2+i*2*Math.PI/N};
  var pt=function(i,v,r){r=r||R;return [cx+Math.cos(ang(i))*r*v/100,cy+Math.sin(ang(i))*r*v/100]};
  var show=function(d){var v=b[d.k].score;return v===null?BASE:v};
  var poly=function(f){return DIMS.map(function(d,i){return pt(i,f(d)).map(function(x){return x.toFixed(1)}).join(',')}).join(' ')};
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="radar" role="img" aria-label="Life balance radar: '+DIMS.map(function(d){return d.n+' '+(b[d.k].score===null?'not scored':b[d.k].score+' of 100')}).join(', ')+'">';
  [20,40,60,80,100].forEach(function(v){s+='<polygon class="ring5" points="'+poly(function(){return v})+'"/>'});
  DIMS.forEach(function(d,i){var p=pt(i,100);s+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'});
  if(cmp)s+='<polygon class="cmp" points="'+poly(function(d){return cmp[d.k]===null?BASE:cmp[d.k]})+'"/>';
  s+='<polygon class="shape" points="'+poly(show)+'"/>';
  DIMS.forEach(function(d,i){
    var sc=b[d.k].score,p=pt(i,show(d));
    s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5" fill="'+(sc===null?'#5d636d':d.c)+'" stroke="#07080a" stroke-width="2"/>';
    var lp=pt(i,100,R+30),c=Math.cos(ang(i)),an=Math.abs(c)<.2?'middle':c>0?'start':'end';
    var dy=Math.sin(ang(i))<-.5?-14:Math.sin(ang(i))>.5?10:0;
    s+='<text class="nm" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+dy).toFixed(1)+'" text-anchor="'+an+'">'+d.n+'</text><text class="sc'+(sc===null?' off':'')+'" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+dy+18).toFixed(1)+'" text-anchor="'+an+'">'+(sc===null?'not scored':sc+'/100')+'</text>';
  });
  return s+'</svg>';
}
function ring(p){
  var r=72,C=2*Math.PI*r;
  return '<svg viewBox="0 0 168 168" class="ring" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#6f7681"/></linearGradient></defs><circle cx="84" cy="84" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle class="arc" cx="84" cy="84" r="'+r+'" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 84 84)" stroke-dasharray="0 '+C.toFixed(1)+'" data-dash="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'"/></svg>';
}

function vToday(){
  var k=ui.date,t=todayK(),isT=k===t,hs=active(k),total=hs.length;
  var dn=hs.filter(function(h){return done(h,k)}).length,p=total?dn/total:0;
  var hr=new Date().getHours(),g=hr<5?'Still up':hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  var nm=S.settings.name?', '+esc(S.settings.name):'';
  var head='<div class="head"><div><p class="eyebrow">'+esc(longDate(k))+'</p><h1 class="title">'+(isT?g+nm:'Looking back')+'</h1>'+(S.settings.name?'':'<p class="sub" style="margin-top:6px">Add your name in <a href="#settings" style="color:var(--silver)">Settings</a> to personalise this.</p>')+'</div>'+
   '<div class="dnav"><button class="icon" data-act="day-prev" aria-label="Previous day">'+ic('left',17)+'</button>'+(isT?'':'<button class="btn sm ghost" data-act="day-today">Back to today</button>')+'<button class="icon" data-act="day-next" aria-label="Next day"'+(isT?' disabled':'')+'>'+ic('right',17)+'</button></div></div>';
  if(!S.habits.length)return head+'<div class="panel empty"><b>Start with one habit</b><span>A habit is something you want to do each day, like drinking water, studying or going to the gym. Give each one a life area and AXIOM scores your balance from what you complete.</span><button class="btn" data-act="add">'+ic('plus',16)+' Add your first habit</button></div>';
  if(!total)return head+'<div class="panel empty"><b>Nothing was tracked on this day</b><span>Habits count from the day you create them.</span><button class="btn" data-act="day-today">Back to today</button></div>';
  var best=0;S.habits.forEach(function(h){best=Math.max(best,streak(h))});
  var week='';for(var i=6;i>=0;i--){var dd=addDays(t,-i),v=dayPct(dd);week+='<button class="wk'+(dd===k?' sel':'')+'" data-act="goto" data-id="'+dd+'" aria-label="'+esc(longDate(dd))+', '+(v===null?'no data':pc(v)+' percent')+'"><i class="'+(v===null?'nd':'')+'" data-h="'+(v===null?4:Math.max(4,v*100))+'" style="height:4%"></i><span>'+WD[pd(dd).getDay()]+'</span></button>'}
  var rows=hs.map(function(h){
    var v=val(h,k),dn2=v>=h.target,s=streak(h),isC=h.type==='count';
    return '<li class="row'+(dn2?' done':'')+'"><button class="chk" role="checkbox" aria-checked="'+dn2+'" aria-label="'+esc(h.name)+'" data-act="toggle" data-id="'+h.id+'">'+ic('check',16)+'</button>'+
     '<div style="min-width:0"><div class="nm">'+esc(h.name)+'</div><div class="meta"><span>'+DIM[h.cat].n+'</span>'+(s>0?'<span class="flame">'+ic('flame',13)+' '+s+(s===1?' day':' days')+'</span>':'')+'</div>'+(isC?'<div class="bar"><i data-w="'+Math.min(100,pc(v/h.target))+'" style="width:0"></i></div>':'')+'</div>'+
     (isC?'<div class="stepper"><button class="icon" data-act="dec" data-id="'+h.id+'" aria-label="Remove one from '+esc(h.name)+'">'+ic('minus',16)+'</button><output aria-live="polite">'+fmt(v)+' / '+fmt(h.target)+'<br><small style="color:var(--mute);font-weight:400">'+esc(h.unit)+'</small></output><button class="icon" data-act="inc" data-id="'+h.id+'" aria-label="Add one to '+esc(h.name)+'">'+ic('plus',16)+'</button></div>':'')+'</li>';
  }).join('');
  return head+'<div class="grid g-today"><div class="stack">'+
   '<section class="panel"><div class="ringwrap">'+ring(p)+'<div class="ringnum"><b>'+pc(p)+'%</b><small>complete</small></div><div class="facts"><div class="fact"><b>'+dn+' of '+total+'</b><span>habits done</span></div><div class="fact"><b>'+(best?best+(best===1?' day':' days'):'–')+'</b><span>best current streak</span></div></div></div></section>'+
   '<section class="panel"><div class="phead"><h2 class="h2">This week</h2></div><div class="week">'+week+'</div></section></div>'+
   '<section class="panel"><div class="phead"><h2 class="h2">Checklist</h2><button class="btn sm" data-act="add">'+ic('plus',15)+' Add habit</button></div><ul class="list">'+rows+'</ul></section></div>';
}

function vAnalytics(){
  var head='<div class="head"><div><p class="eyebrow">From your check-ins</p><h1 class="title">Analytics</h1></div><div class="seg" role="group" aria-label="Range"><button aria-pressed="'+(ui.range===7)+'" data-act="range" data-id="7">Week</button><button aria-pressed="'+(ui.range===30)+'" data-act="range" data-id="30">Month</button></div></div>';
  if(!S.habits.length)return head+'<div class="panel empty"><b>Nothing to chart yet</b><span>Add habits and check them off. Charts fill in from your real activity.</span><button class="btn" data-act="add">Add your first habit</button></div>';
  if(trackedDays()<2)return head+'<div class="panel empty"><b>Not enough history yet</b><span>Analytics need at least two days of tracking. Keep checking in and come back tomorrow.</span><button class="btn" data-act="nav" data-id="today">Go to Today</button></div>';
  var t=todayK(),n=ui.range,items=[],haveBars=false,perfect=0,withData=0;
  for(var i=n-1;i>=0;i--){var k=addDays(t,-i),v=dayPct(k);if(v!==null){haveBars=true;withData++;if(v>=.999)perfect++}
    items.push({v:v,hot:k===t,label:n===7?WD[pd(k).getDay()]:String(pd(k).getDate()),title:longDate(k)+': '+(v===null?'no data':pc(v)+'%')})}
  var cur=avgPct(n),prev=avgPct(n,addDays(t,-n));
  var hb=S.habits.map(function(h){return {h:h,r:rate(h,n)}}).sort(function(x,y){return (y.r===null?-1:y.r)-(x.r===null?-1:x.r)}).map(function(o){return '<div class="hbar"><span>'+esc(o.h.name)+'</span><div class="bar">'+(o.r===null?'':'<i data-w="'+pc(o.r)+'" style="width:0"></i>')+'</div><em>'+(o.r===null?'–':pc(o.r)+'%')+'</em></div>'}).join('');
  return head+'<div class="stack">'+
   '<div class="tiles"><div class="panel tile"><span class="eyebrow">Average</span><b>'+(cur===null?'–':pc(cur)+'%')+'</b>'+delta(cur,prev)+'</div><div class="panel tile"><span class="eyebrow">Perfect days</span><b>'+perfect+'<span style="font-size:18px;color:var(--mute)"> / '+withData+'</span></b><span class="sub">every habit done</span></div><div class="panel tile"><span class="eyebrow">Before that</span><b>'+(prev===null?'–':pc(prev)+'%')+'</b><span class="sub">previous '+n+' days</span></div></div>'+
   '<section class="panel"><div class="phead"><h2 class="h2">Daily completion</h2></div>'+(haveBars?barChart(items,n===7?1:5,'Daily completion percentage for the last '+n+' days'):'<div class="note">No tracked days in this period yet.</div>')+'</section>'+
   '<section class="panel"><div class="phead"><h2 class="h2">By habit</h2></div>'+hb+'</section></div>';
}

function vBalance(){
  var n=ui.brange,b=balance(n),scored=DIMS.filter(function(d){return b[d.k].score!==null});
  var head='<div class="head"><div><p class="eyebrow">Calculated from your habits</p><h1 class="title">Life Balance</h1></div><div class="seg" role="group" aria-label="Scoring period"><button aria-pressed="'+(n===7)+'" data-act="brange" data-id="7">Week</button><button aria-pressed="'+(n===30)+'" data-act="brange" data-id="30">Month</button></div></div>';
  var areas=DIMS.map(function(d){var a=b[d.k];
    return '<div class="area"><div class="top"><span style="color:'+d.c+'">'+d.n+'</span>'+(a.score===null?'<b class="off">Not scored</b>':'<b>'+a.score+'/100</b>')+'</div><div class="bar">'+(a.score===null?'':'<i data-w="'+a.score+'" style="width:0;background:'+d.c+'"></i>')+'</div><small>'+(a.score===null?'No habits in this area yet.':a.d+' of '+a.n+' check-ins done')+'</small></div>'}).join('');
  var snaps=S.history.filter(function(h){return h.range===n}),trend;
  if(snaps.length<2)trend='<div class="note">Save a snapshot now and another later. A trend appears once you have two '+(n===7?'weekly':'monthly')+' snapshots.</div>';
  else{
    var ser=DIMS.filter(function(d){return ui.dims[d.k]}).map(function(d){return {name:d.n,c:d.c,pts:snaps.map(function(h){return snapVal(h,d.k)})}});
    var m=snaps.length,lab=[{i:0,t:shortDate(snaps[0].date)},{i:m-1,t:shortDate(snaps[m-1].date)}];
    trend=(ser.length?lineChart(ser,lab,100,function(v){return String(Math.round(v))},'Life balance scores over time'):'<div class="note">Turn on at least one area below.</div>')+'<div class="legend">'+DIMS.map(function(d){return '<button style="--c:'+d.c+'" aria-pressed="'+(ui.dims[d.k]?'true':'false')+'" data-act="dim" data-id="'+d.k+'"><i></i>'+d.n+'</button>'}).join('')+'</div>';
  }
  var t=todayK(),exist=S.history.filter(function(h){return h.date===t&&h.range===n}).length;
  var hist=S.history.length?'<div style="margin-top:14px">'+S.history.slice().reverse().map(function(h){return '<div class="snap"><span>'+esc(shortDate(h.date))+' · '+(h.range===30?'Month':'Week')+(h.scale===10?' <span class="chip">manual rating</span>':'')+'<br><span class="mono">'+DIMS.map(function(d){var v=snapVal(h,d.k);return v===null?'–':Math.round(v)}).join(' · ')+'</span></span><button class="icon" data-act="del-snap" data-id="'+snapId(h)+'" aria-label="Delete snapshot from '+esc(shortDate(h.date))+'">'+ic('minus',15)+'</button></div>'}).join('')+'</div>':'';
  return head+'<div class="grid g-bal"><div class="stack"><section class="panel"><div class="radarwrap">'+radar(b)+'</div>'+
   (scored.length?'':'<div class="note" style="margin-top:10px">Nothing is scored yet. Add habits and give each one a life area.</div>')+
   '<p class="sub" style="margin-top:12px">Each score is the share of that area\'s habit check-ins you completed in the last '+n+' days, from 1 to 100. Areas without habits are not scored.</p></section>'+
   '<section class="panel"><div class="phead"><h2 class="h2">History</h2></div>'+trend+hist+'</section></div>'+
   '<div class="stack"><section class="panel"><div class="phead"><h2 class="h2">By area</h2><span class="sub">Last '+n+' days</span></div>'+areas+'<button class="btn" data-act="snap"'+(scored.length?'':' disabled')+'>'+(exist?'Update today\'s snapshot':'Save snapshot')+'</button></section></div></div>';
}

  if(!isD&&!(cloud.user&&cloud.mode==='ready'))return h+'<p class="sub">Sign in to use this.</p></div>';
  if(!open)return h+'<div><button class="btn sm danger" data-act="wipe" data-id="'+kind+'">'+(isD?'Delete device data…':'Delete account data…')+'</button></div></div>';
  return h+'<div class="wipebox"><label for="wipe-text">Type DELETE to confirm. This cannot be undone.</label><input id="wipe-text" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="inline" style="margin-top:10px"><button class="btn sm danger" id="wipe-go" data-act="wipe-go" disabled>'+(isD?'Delete device data':'Delete account data')+'</button><button class="btn sm ghost" data-act="wipe-cancel">Cancel</button></div><div class="err" id="wipeerr"></div></div></div>';
}

   FIREBASE: Google sign-in + Realtime Database
   Storage is one or the other: signed out = this device, signed in = your Google account.
   The two never mix. Cloud data lives ONLY under /axiom_app_data/users/{uid}/axiom;
   nothing else in the database is read, written or deleted.
   ===================================================================== */

};
var cloud={mode:'unavailable',why:'',user:null,state:'signedout',err:'',syncedAt:0,seq:0};
var fbAuth=null,fbDb=null,pushT=null;
function axiomRef(uidv){ // the ONLY place a database reference is built
  if(!fbDb||!cloud.user||!uidv||cloud.user.uid!==uidv)throw new Error('AXIOM database reference requires the signed-in user');
  return fbDb.ref('axiom_app_data/users/'+uidv+'/axiom');
}
function cloudInit(){
  if(location.protocol==='file:'){cloud.why='This page was opened as a file. Host it on a web address (such as GitHub Pages) to use Google sign-in.';return}
  if(!window.firebase||!firebase.auth||!firebase.database){cloud.why='Firebase could not be loaded, so AXIOM is saving on this device only.';return}
  try{
    firebase.initializeApp(FB_CFG);fbAuth=firebase.auth();fbDb=firebase.database();cloud.mode='ready';
    fbAuth.onAuthStateChanged(onUser,function(e){cloud.err=authMsg(e);cloud.state='error';renderAccount()});
    var rr=fbAuth.getRedirectResult();if(rr&&rr.catch)rr.catch(function(e){toast(authMsg(e))});
  }catch(e){cloud.mode='unavailable';cloud.why='Firebase failed to start. AXIOM is saving on this device only.'}
}
function authMsg(e){
  var c=e&&e.code;
  if(c==='auth/unauthorized-domain')return 'This web address is not in Authorized domains in Firebase Authentication.';
  if(c==='auth/operation-not-allowed')return 'Google sign-in is turned off. Enable Google under Firebase Authentication, Sign-in method.';
  if(c==='auth/network-request-failed')return 'Network problem. Check your connection and try again.';
  if(c==='auth/internal-error'||c==='auth/web-storage-unsupported')return 'Sign-in is unavailable in this browser right now.';
  return 'Sign-in failed'+(c?' ('+c+')':'')+'.';
}
/* Switch stores. The device store (key axiom.v1) is never touched by signing in. */
function onUser(u){
  clearTimeout(pushT);cloud.seq++;
  var prefs={collapsed:S.meta.collapsed,intro:S.meta.intro};
  if(!u){
    cloud.user=null;cloud.err='';cloud.state='signedout';
    if(S.meta.owner){persist();var d=loadLocal().s;d.meta.collapsed=prefs.collapsed;d.meta.intro=prefs.intro;d.meta.owner=null;S=d;ui.modal=null;renderModal();ui.force=true;render()}
    renderAccount();refreshAcctPanel();return;
  }
  if(S.meta.owner&&S.meta.owner!==u.uid)persist();
  cloud.user=u;cloud.err='';
  var L=loadAccount(u.uid)||emptyState(u.uid);
  L.meta.owner=u.uid;L.meta.collapsed=prefs.collapsed;L.meta.intro=prefs.intro;
  S=L;ui.force=true;render();   // show the cached copy of this account while the cloud is checked
  loadFromCloud(u.uid);
}
function loadFromCloud(uidv){
  var token=cloud.seq;cloud.state='loading';renderAccount();refreshAcctPanel();
  axiomRef(uidv).once('value').then(function(snap){
    if(token!==cloud.seq||!cloud.user||cloud.user.uid!==uidv)return;
    var raw=snap.val(),D=raw?normalise(raw):null;
    cloud.state='ready';
    if(!D){
      if(!isBlank(S)){S.meta.dirty=true;S.updatedAt=Date.now();persist();cloudPush(true);return}  // cached edits never reached the cloud
      var dev=loadLocal().s;
      if(!isBlank(dev)&&!S.meta.copyAsked){ui.modal={type:'copy',dev:dev};renderModal()}
      renderAccount();refreshAcctPanel();return;
    }
    if(S.meta.dirty&&D.updatedAt!==S.meta.base){ // changed elsewhere while this device had unsynced edits
      addBackup('Unsynced changes from this device',S);adoptCloud(D,uidv);
      toast('Unsynced changes from this device were saved as a copy in Settings');return;
    }
    if(S.meta.dirty){cloudPush(true);return}      // cloud untouched since our last sync, so our edits are newer
    if(D.updatedAt!==S.meta.base||isBlank(S))adoptCloud(D,uidv);
    else{cloud.state='synced';cloud.syncedAt=Date.now();renderAccount();refreshAcctPanel()}
  }).catch(function(e){if(token===cloud.seq)cloudFail(e)});
}
function adoptCloud(D,uidv){
  var m=S.meta;S=D;S.meta={owner:uidv,dirty:false,base:D.updatedAt,collapsed:m.collapsed,intro:m.intro,copyAsked:true};
  persist();cloud.state='synced';cloud.syncedAt=Date.now();ui.force=true;render();renderAccount();
}
function cloudPush(now){
  if(cloud.mode!=='ready'||!cloud.user||S.meta.owner!==cloud.user.uid)return;
  if(cloud.state==='loading')return;
  clearTimeout(pushT);cloud.state='pending';renderAccount();
  if(now)flush();else pushT=setTimeout(flush,700);
}
function flush(){
  var u=cloud.user;if(!u||S.meta.owner!==u.uid)return;
  cloud.state='saving';renderAccount();
  var stamp=S.updatedAt,data=JSON.parse(JSON.stringify(exportable(S)));
  axiomRef(u.uid).set(data).then(function(){
    if(!cloud.user||cloud.user.uid!==u.uid)return;
    S.meta.base=stamp;if(S.updatedAt===stamp)S.meta.dirty=false;persist();
    cloud.state=S.meta.dirty?'pending':'synced';cloud.syncedAt=Date.now();cloud.err='';renderAccount();refreshAcctPanel();
  }).catch(cloudFail);
}
function cloudFail(e){
  cloud.state='error';var m=(e&&(e.code||e.message))||'';
  cloud.err=/permission/i.test(m)?'The database rules are blocking AXIOM. Add the axiom_app_data rule in Firebase. Your changes are kept on this device.':'Could not reach the database. Your changes are kept on this device and will retry.';
  renderAccount();refreshAcctPanel();
}
function signIn(){
  if(cloud.mode!=='ready'){toast(cloud.why||'Cloud sign-in is not available here.');return}
  var p=new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(p).catch(function(e){
    var c=e&&e.code;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment')fbAuth.signInWithRedirect(p);
    else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')toast(authMsg(e));
  });
}
function signOut(){
  if(!fbAuth)return;
  fbAuth.signOut().then(function(){toast('Signed out. You are now using the data on this device.')});
}
function timeStr(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function statusText(){
  if(cloud.mode!=='ready')return cloud.why||'Saved on this device only.';
  if(!cloud.user)return 'Saved on this device only.';
  switch(cloud.state){
    case 'loading':return 'Checking your account…';
    case 'pending':return 'Changes waiting to save…';
    case 'saving':return 'Saving…';
    case 'synced':return 'Saved to your account at '+timeStr(cloud.syncedAt);
    case 'error':return cloud.err;
    default:return 'Signed in. Your data saves here as you use AXIOM.';
  }
}
function shortStatus(){
  if(!cloud.user)return 'Signed out';
  return {loading:'Loading…',pending:'Unsaved',saving:'Saving…',synced:'Saved',error:'Not saved'}[cloud.state]||'Signed in';
}
function acctSide(){
  if(cloud.user){
    var n=cloud.user.displayName||cloud.user.email||'You';
    return '<button type="button" class="acctb" data-act="nav" data-id="settings" aria-label="Account: '+esc(n)+', '+esc(shortStatus())+'"><i class="av">'+esc(n.charAt(0).toUpperCase())+'</i><span class="lbl"><b>'+esc(n.split(' ')[0])+'</b><small>'+esc(shortStatus())+'</small></span></button>';
  }
  return '<button type="button" class="acctb" data-act="signin" aria-label="Sign in with Google"><i class="av">G</i><span class="lbl"><b>Sign in</b><small>'+(cloud.mode==='ready'?'with Google':'This device only')+'</small></span></button>';
}
function acctPanel(){
  var on=cloud.user&&cloud.mode==='ready';
  var h='<h2 class="h2" style="margin-bottom:14px">Storage</h2>';
  h+='<div class="mrow"><span>Saving to</span><b style="font-family:var(--body)">'+(on?'Your Google account':'This device only')+'</b></div>';
  if(on)h+='<div class="mrow"><span>Account</span><b style="font-family:var(--body)">'+esc(cloud.user.email||cloud.user.displayName||'Signed in')+'</b></div>';
  h+='<div class="mrow"><span>Status</span><b style="font-family:var(--body);text-align:right;max-width:62%;'+(cloud.state==='error'&&on?'color:var(--bad)':'')+'">'+esc(statusText())+'</b></div>';
  h+='<div class="inline" style="margin:14px 0 10px">'+(on?'<button class="btn sm" data-act="syncnow">Save now</button><button class="btn sm ghost" data-act="signout">Sign out</button>':'<button class="btn" data-act="signin">Sign in with Google</button>')+'</div>';
  h+='<p class="sub">'+(on?'Your data is saved to your Google account. The data on this device is kept separately and comes back when you sign out.':'Your data is saved on this device only. Signing in switches to your Google account, which has its own data.')+'</p>';
  return h;
}
function renderAccount(){
  var a=$('#acct');if(a)a.innerHTML=acctSide();
  var n=$('#sidenote');if(n)n.textContent=cloud.user?(cloud.state==='synced'?'Saved to your Google account.':shortStatus()+'.'):'Saved on this device only.';
}
function refreshAcctPanel(){var p=$('#acctpanel');if(p)p.innerHTML=acctPanel()}

/* Deletes. Each is separate and only runs after the user types DELETE. */
function wipeDevice(){
  var m=S.meta;
  try{
    var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&(k===KEY||k.indexOf(KEY+'.')===0||k.indexOf(ACC)===0||k===BAK))keys.push(k)}
    keys.forEach(function(k){localStorage.removeItem(k)});
  }catch(e){}
  var fresh=emptyState(m.owner);fresh.meta.collapsed=m.collapsed;fresh.meta.intro=m.intro;
  S=fresh;persist();ui.wipe=null;ui.force=true;render();
  if(cloud.user&&cloud.mode==='ready'&&m.owner===cloud.user.uid)loadFromCloud(cloud.user.uid); // cloud data is untouched, so reload it
  toast('Data on this device deleted');
}
function wipeAccount(){
  var u=cloud.user;
  if(!u||cloud.mode!=='ready'||S.meta.owner!==u.uid){toast('Sign in to delete account data.');return}
  clearTimeout(pushT);cloud.state='saving';renderAccount();
  axiomRef(u.uid).remove().then(function(){
    var m=S.meta,fresh=emptyState(u.uid);fresh.meta.collapsed=m.collapsed;fresh.meta.intro=m.intro;fresh.meta.copyAsked=true;
    S=fresh;persist();cloud.state='ready';ui.wipe=null;ui.force=true;render();toast('Account data deleted');
  }).catch(cloudFail);
}

/* =====================================================================
   RENDER + ACTIONS
   ===================================================================== */
function renderNav(){
  $('#nav').innerHTML=VIEWS.map(function(v){return '<button type="button" data-act="nav" data-id="'+v[0]+'"'+(ui.view===v[0]?' aria-current="page"':'')+'>'+ic(v[0],20)+'<span>'+v[1]+'</span></button>'}).join('');
  $('#app').classList.toggle('col',!!S.meta.collapsed);
}
function render(){
  var changed=ui.lastView!==ui.view||ui.force;ui.force=false;
  var ae=document.activeElement,fa=ae&&ae.dataset&&ae.dataset.act?ae.dataset.act:null,fi=ae&&ae.dataset?ae.dataset.id:null;
  var fn={today:vToday,habits:vHabits,analytics:vAnalytics,balance:vBalance,settings:vSettings}[ui.view];
  $('#view').innerHTML='<div class="'+(changed?'enter anim':'')+'">'+fn()+'</div>';
  ui.lastView=ui.view;renderNav();renderAccount();
  var go=function(){$$('[data-w]').forEach(function(e){e.style.width=e.dataset.w+'%'});$$('[data-h]').forEach(function(e){e.style.height=e.dataset.h+'%'});$$('[data-dash]').forEach(function(e){e.setAttribute('stroke-dasharray',e.dataset.dash)})};
  if(changed)requestAnimationFrame(function(){requestAnimationFrame(go)});else{$$('.arc,.bar i,.wk i').forEach(function(e){e.style.transition='none'});go()}
  if(fa&&fi){var n=$('[data-act="'+fa+'"][data-id="'+fi+'"]');if(n&&!n.disabled)n.focus()}
}
function commit(){touch();render()}
function setView(v){ui.view=v;ui.confirm='';ui.wipe=null;if(location.hash!=='#'+v)location.hash=v;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){var v=routeFromHash();if(v!==ui.view){ui.view=v;ui.confirm='';ui.wipe=null;render()}});

function move(id,dir){var i=S.habits.findIndex(function(h){return h.id===id}),j=i+dir;if(i<0||j<0||j>=S.habits.length)return;var t=S.habits[i];S.habits[i]=S.habits[j];S.habits[j]=t;commit()}
function setVal(h,k,v){S.log[k]=S.log[k]||{};if(v<=0){delete S.log[k][h.id];if(!Object.keys(S.log[k]).length)delete S.log[k]}else S.log[k][h.id]=v}
function saveSnapshot(){
  var b=balance(ui.brange),sc={},any=false;
  DIMS.forEach(function(d){sc[d.k]=b[d.k].score;if(b[d.k].score!==null)any=true});
  if(!any){toast('Nothing to save yet. Add habits first.');return}
  var t=todayK(),ex=S.history.filter(function(h){return h.date===t&&h.range===ui.brange})[0];
  if(ex){ex.scores=sc;ex.scale=100;ex.src='auto'}else S.history.push({date:t,range:ui.brange,scores:sc,scale:100,src:'auto'});
  S.history.sort(function(a,b2){return a.date<b2.date?-1:a.date>b2.date?1:a.range-b2.range});
  commit();toast(ex?'Snapshot updated':'Snapshot saved');
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='scrim'){if(ev.target!==el)return;ui.modal=null;ui.confirm='';renderModal();return}
  var h=id?S.habits.filter(function(x){return x.id===id})[0]:null;
  switch(a){
   case 'nav':setView(id);break;
   case 'collapse':S.meta.collapsed=!S.meta.collapsed;persist();renderNav();break;
   case 'toggle':if(h){setVal(h,ui.date,done(h,ui.date)?0:h.target);commit()}break;
   case 'inc':if(h){setVal(h,ui.date,val(h,ui.date)+1);commit()}break;
   case 'dec':if(h){setVal(h,ui.date,Math.max(0,val(h,ui.date)-1));commit()}break;
   case 'day-prev':ui.date=addDays(ui.date,-1);ui.force=true;render();break;
   case 'day-next':if(ui.date<todayK()){ui.date=addDays(ui.date,1);ui.force=true;render()}break;
   case 'day-today':ui.date=todayK();ui.force=true;render();break;
   case 'goto':ui.date=id;render();break;
   case 'add':ui.modal={id:null};ui.confirm='';renderModal();break;
   case 'edit':ui.modal={id:id};ui.confirm='';renderModal();break;
   case 'close':ui.modal=null;ui.confirm='';renderModal();break;
   case 'del':ui.confirm='del';ui.modal.draft=readForm();ui.modal.noFocus=1;renderModal();break;
   case 'del-no':ui.confirm='';ui.modal.noFocus=1;renderModal();break;
   case 'del-yes':var gone=ui.modal.id;S.habits=S.habits.filter(function(x){return x.id!==gone});Object.keys(S.log).forEach(function(k){delete S.log[k][gone];if(!Object.keys(S.log[k]).length)delete S.log[k]});ui.modal=null;ui.confirm='';renderModal();commit();toast('Habit deleted');break;
   case 'up':move(id,-1);break;
   case 'down':move(id,1);break;
   case 'range':ui.range=+id;ui.force=true;render();break;
   case 'brange':ui.brange=+id;ui.force=true;render();break;
   case 'dim':ui.dims[id]=ui.dims[id]?0:1;render();break;
   case 'snap':saveSnapshot();break;
   case 'del-snap':S.history=S.history.filter(function(x){return snapId(x)!==id});commit();toast('Snapshot deleted');break;
   case 'signin':signIn();break;
   case 'signout':signOut();break;
   case 'syncnow':
     if(cloud.mode!=='ready'||!cloud.user)toast('Sign in to save to your account.');
     else if(cloud.state==='loading')toast('Still checking your account. Try again in a moment.');
     else cloudPush(true);
     break;
   case 'copy-yes':
     var dev=ui.modal&&ui.modal.dev,u=cloud.user;
     if(dev&&u){var pm=S.meta;S=normalise(dev);S.meta={owner:u.uid,dirty:true,base:0,collapsed:pm.collapsed,intro:pm.intro,copyAsked:true};S.updatedAt=Date.now();ui.modal=null;renderModal();persist();ui.force=true;render();cloudPush(true);toast('Copied to your account')}
     break;
   case 'copy-no':S.meta.copyAsked=true;persist();ui.modal=null;renderModal();break;
   case 'copyexp':var ta=$('#exp'),ok=function(){toast('Backup copied')},no=function(){ta.focus();ta.select();toast('Selected. Use your keyboard to copy.')};
     try{navigator.clipboard.writeText(ta.value).then(ok,no)}catch(e){no()}break;
   case 'import':
     try{var o=JSON.parse($('#imp').value);if(!o||typeof o!=='object'||!(Array.isArray(o.habits)||(o.habits&&typeof o.habits==='object'))||typeof o.log!=='object')throw 0;
       var n2=normalise(o),m=S.meta;addBackup('Before importing a backup',S);S=n2;S.meta=m;commit();toast('Backup restored')}
     catch(e){$('#imperr').textContent='That text is not a valid AXIOM backup. Copy the whole export and try again.'}break;
   case 'restore':var bs=getBackups(),bk=bs[+id];if(bk){addBackup('Before restoring a saved copy',S);var m2=S.meta;S=normalise(bk.data);S.meta=m2;commit();toast('Saved copy restored')}break;
   case 'wipe':ui.wipe=id;render();var wi=$('#wipe-text');if(wi)wi.focus();break;
   case 'wipe-cancel':ui.wipe=null;render();break;
   case 'wipe-go':
     var wt=$('#wipe-text');
     if(!ui.wipe||!wt||wt.value!=='DELETE'){var we=$('#wipeerr');if(we)we.textContent='Type DELETE exactly, in capitals, to continue.';break}
     if(ui.wipe==='device')wipeDevice();else wipeAccount();
     break;
  }
});

document.addEventListener('submit',function(ev){
  ev.preventDefault();var f=ev.target.id;
  if(f==='hform'){
    var d=readForm(),e={},isC=d.type==='count',tg=Number(d.target);
    if(!d.name)e.name='Give the habit a name.';
    else if(S.habits.some(function(x){return x.name.toLowerCase()===d.name.toLowerCase()&&x.id!==ui.modal.id}))e.name='You already have a habit with this name.';
    if(isC){if(!(tg>=1)||Math.floor(tg)!==tg)e.target='Enter a whole number of 1 or more.';else if(tg>9999)e.target='Keep the target under 10,000.';
      if(!d.unit)e.unit='Add a unit, like glasses or pages.'}
    if(Object.keys(e).length){ui.modal.draft=d;ui.modal.errors=e;ui.modal.noFocus=1;renderModal();var bad=$('#hform .err:not(:empty)');if(bad&&bad.previousElementSibling)bad.previousElementSibling.focus();return}
    var rec={name:d.name,cat:d.cat,type:d.type,target:isC?tg:1,unit:isC?d.unit:''};
    if(ui.modal.id){var hh=S.habits.filter(function(x){return x.id===ui.modal.id})[0];Object.assign(hh,rec);toast('Habit updated')}
    else{rec.id=uid();rec.created=todayK();S.habits.push(rec);toast('Habit added')}
    ui.modal=null;ui.confirm='';renderModal();commit();
  }else if(f==='nameform'){
    var nn=$('#nm').value.trim();if(nn.length>30){$('#nmerr').textContent='Keep it under 30 characters.';return}
    S.settings.name=nn;commit();toast('Name saved');
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='f-type'){$('#countfields').hidden=t.value!=='count'}
  else if(t.id==='introset'){S.meta.intro=t.checked;persist()}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='wipe-text'){var g=$('#wipe-go');if(g)g.disabled=t.value!=='DELETE';var we=$('#wipeerr');if(we)we.textContent=''}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&ui.modal&&!ui.modal.type){ui.modal=null;ui.confirm='';renderModal()}});
window.addEventListener('online',function(){if(cloud.user&&S.meta.dirty&&cloud.state==='error')cloudPush(true)});

/* =====================================================================
   INTRO + BOOT
   ===================================================================== */
function endSplash(){
  var s=$('#splash');if(s.classList.contains('out'))return;
  s.classList.add('out');$('#app').removeAttribute('inert');
  ui.force=true;render();
  setTimeout(function(){s.hidden=true},1600);
}
render();cloudInit();renderAccount();
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce||!S.meta.intro){$('#splash').hidden=true}
else{$('#app').setAttribute('inert','');setTimeout(endSplash,3000)}
})();
</script>
</body>
