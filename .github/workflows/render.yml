name: Render Circle Escape Short

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy opencv-python-headless

      - name: Run Simulation
        run: |
          python generate.py

      - name: Transcode to H.264 MP4
        run: |
          ffmpeg -y -i circle_escape.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart final_escape.mp4

      - name: Publish Direct Release (No Zips)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-escape-render
          name: "Circle Escape Render"
          files: final_escape.mp4
