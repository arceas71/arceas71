<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>H.I.D.E.A.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
>

<style>

/* ==================================================
   H.I.D.E.A. COLOUR SYSTEM
================================================== */

:root {

    --background: #D3D3D3;
    --primary: #282828;
    --secondary: #282828;
    --text: #282828;
    --muted: #666666;
    --globe-line: #8f8f8f;
    --border: #aaaaaa;
    --button-background: #D3D3D3;

    --blue: #4285f4;
    --blue-light: #4da9ed;
    --blue-dark: #174f9c;

    --error: #b51f1f;

    --player-color: #4285f4;

    --font-heading:
        "Space Grotesk",
        Arial,
        Helvetica,
        sans-serif;

    --font-mono:
        "JetBrains Mono",
        "Courier New",
        monospace;
}


@media (prefers-color-scheme: dark) {

    :root {

        --background: #282828;
        --primary: #D3D3D3;
        --secondary: #D3D3D3;
        --text: #D3D3D3;
        --muted: #999999;
        --globe-line: #686868;
        --border: #555555;
        --button-background: #282828;

        --blue: #5b9df9;
        --blue-light: #67b5f4;
        --blue-dark: #2865b5;

        --error: #ff5c5c;
    }
}


/* ==================================================
   BASE
================================================== */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

    user-select: none;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        var(--background);

    color:
        var(--text);

    font-family:
        var(--font-heading);

    transition:
        background .25s ease,
        color .25s ease;
}


body {

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}


/* ==================================================
   SPLASH SCREEN
================================================== */

#splash {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        var(--background);

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        splashOut
        .65s
        ease
        4.8s
        forwards;

    transition:
        background .25s ease;
}


.logo {

    width: 72vw;

    max-width: 300px;

    overflow: visible;

    animation:
        logoZoomOut
        .8s
        cubic-bezier(.16,1,.3,1)
        3.1s
        forwards;
}


@keyframes logoZoomOut {

    0% {

        transform:
            scale(1);
    }

    100% {

        transform:
            scale(.72);
    }
}


/* ==================================================
   GLOBE
================================================== */

.globe {

    opacity: 0;

    transform-origin:
        250px 225px;

    animation:

        globeIn
        1s
        cubic-bezier(.16,1,.3,1)
        .15s
        forwards,

        globeFloat
        2.5s
        ease-in-out
        1.2s
        infinite;
}


@keyframes globeIn {

    0% {

        opacity: 0;

        transform:
            scale(.55)
            rotate(-15deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.05)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes globeFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-4px);
    }
}


/* ==================================================
   GLOBE LINES
================================================== */

.globeLines {

    opacity: 0;

    stroke-dasharray: 500;

    animation:
        linesIn
        .8s
        ease
        .65s
        forwards;
}


@keyframes linesIn {

    from {

        opacity: 0;

        stroke-dashoffset:
            500;
    }

    to {

        opacity: 1;

        stroke-dashoffset:
            0;
    }
}


/* ==================================================
   CARDINAL MARKERS
================================================== */

.cardinal {

    opacity: 0;

    transform-origin:
        center;

    animation:
        cardinalIn
        .65s
        cubic-bezier(.16,1,.3,1)
        forwards;

    stroke:
        var(--primary);
}


.cardinal.east {

    animation-delay:
        1.08s;
}


.cardinal.south {

    animation-delay:
        1.21s;
}


.cardinal.west {

    animation-delay:
        1.34s;
}


@keyframes cardinalIn {

    0% {

        opacity: 0;

        transform:
            scale(.3);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.12);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* ==================================================
   NAVIGATION ARROW
================================================== */

.navArrow {

    opacity: 0;

    transform-origin:
        250px 210px;

    animation:

        arrowIn
        .8s
        cubic-bezier(.16,1,.3,1)
        .85s
        forwards,

        arrowFloat
        2.5s
        ease-in-out
        1.5s
        infinite;
}


@keyframes arrowIn {

    0% {

        opacity: 0;

        transform:
            scale(.35)
            rotate(-35deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.07)
            rotate(3deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


@keyframes arrowFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-5px);
    }
}


/* ==================================================
   H.I.D.E.A. LETTERS
================================================== */

.letter {

    opacity: 0;

    filter:
        blur(7px);

    fill:
        var(--primary);

    animation:
        letterFloatIn
        .9s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


.l1 { animation-delay: 1.45s; }
.l2 { animation-delay: 1.58s; }
.l3 { animation-delay: 1.71s; }
.l4 { animation-delay: 1.84s; }
.l5 { animation-delay: 1.97s; }
.l6 { animation-delay: 2.10s; }
.l7 { animation-delay: 2.23s; }
.l8 { animation-delay: 2.36s; }
.l9 { animation-delay: 2.49s; }


@keyframes letterFloatIn {

    0% {

        opacity: 0;

        filter:
            blur(7px);

        transform:
            translateY(20px)
            scale(.82);
    }

    55% {

        opacity: 1;

        filter:
            blur(1px);

        transform:
            translateY(-4px)
            scale(1.04);
    }

    100% {

        opacity: 1;

        filter:
            blur(0);

        transform:
            translateY(0)
            scale(1);
    }
}


/* ==================================================
   SPLASH EXIT
================================================== */

@keyframes splashOut {

    to {

        opacity: 0;

        visibility: hidden;
    }
}


/* ==================================================
   MAIN APP
================================================== */

#app {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background:
        var(--background);

    opacity: 0;

    animation:
        appIn
        .7s
        ease
        4.85s
        forwards;

    transition:
        background .25s ease;
}


@keyframes appIn {

    to {

        opacity: 1;
    }
}


/* ==================================================
   GRID BACKDROP (default — no network tile fetching,
   just a panning grid that proves you're moving)
================================================== */

#grid {

    position: absolute;

    inset: 0;

    z-index: 0;

    background-color:
        var(--background);

    background-image:
        linear-gradient(
            var(--border) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            var(--border) 1px,
            transparent 1px
        );

    background-size:
        44px 44px;

    background-position:
        0px 0px;

    opacity: .45;

    transition:
        opacity .2s ease;
}


/* ==================================================
   LIVE MAP (optional — real OpenStreetMap tiles,
   only fetched once the user switches it on)
================================================== */

#map {

    position: absolute;

    inset: 0;

    z-index: 0;

    background:
        var(--background);

    display: none;
}


#app.map-mode #map {

    display: block;
}


#app.map-mode #grid {

    display: none;
}


/* mono-tone the tiles so the map matches the
   grayscale H.I.D.E.A. look */
#map .leaflet-tile-pane {

    filter:
        grayscale(1)
        contrast(1.05)
        brightness(1.02);
}


@media (prefers-color-scheme: dark) {

    #map .leaflet-tile-pane {

        filter:
            grayscale(1)
            contrast(1.05)
            brightness(.55)
            invert(1)
            hue-rotate(180deg);
    }
}


/* ==================================================
   MAP TOGGLE BUTTON
================================================== */

.map-toggle {

    position: absolute;

    top:
        calc(
            18px +
            env(safe-area-inset-top)
        );

    left:
        calc(
            18px +
            env(safe-area-inset-left)
        );

    z-index: 3;

    height: 34px;

    padding: 0 14px;

    border-radius: 17px;

    border:
        1px solid
        var(--border);

    background:
        var(--button-background);

    color:
        var(--text);

    font-family:
        var(--font-heading);

    font-size: 11px;

    font-weight: 600;

    letter-spacing: .4px;

    cursor: pointer;
}


/* ==================================================
   RECENTER BUTTON (appears once you've dragged
   the map away from your live position)
================================================== */

.recenter-btn {

    position: absolute;

    top:
        calc(
            18px +
            env(safe-area-inset-top)
        );

    left: 50%;

    transform:
        translateX(-50%)
        scale(.6);

    z-index: 3;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    border:
        1px solid
        var(--border);

    background:
        var(--button-background);

    color:
        var(--blue);

    font-size: 16px;

    line-height: 1;

    cursor: pointer;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .18s ease,
        transform .18s ease;
}


.recenter-btn.visible {

    opacity: 1;

    pointer-events: auto;

    transform:
        translateX(-50%)
        scale(1);
}


#app > *:not(#map):not(#grid):not(#gridPlayers) {

    position: absolute;

    z-index: 1;
}


.location-marker,
.player-name,
.altitude,
.map-toggle {

    z-index: 2;
}


/* ==================================================
   AVATAR SYSTEM (shared visual language for every
   player — self and everyone else — used on both
   the grid backdrop and the real map)
================================================== */

.avatar-badge {

    position: relative;

    width: 40px;
    height: 40px;

    transform:
        translate(-50%, -50%);
}


.avatar-circle {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 30px;
    height: 30px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        var(--avatar-color, var(--blue));

    border:
        2.5px solid
        var(--background);

    box-shadow:
        0 2px 6px
        rgba(0,0,0,.25);

    display: flex;

    align-items: center;

    justify-content: center;

    color: #fff;

    font-family:
        var(--font-heading);

    font-weight: 700;

    font-size: 12px;

    letter-spacing: .2px;
}


.avatar-pointer {

    position: absolute;

    left: 50%;

    top: -3px;

    width: 0;
    height: 0;

    transform-origin:
        50% 23px;

    border-left:
        4.5px solid transparent;

    border-right:
        4.5px solid transparent;

    border-bottom:
        10px solid
        var(--avatar-color, var(--blue));

    filter:
        drop-shadow(
            0 1px 1px
            rgba(0,0,0,.2)
        );
}


.avatar-name {

    position: absolute;

    left: 50%;

    top: -6px;

    transform:
        translate(-50%, -100%);

    color:
        var(--text);

    font-family:
        var(--font-heading);

    font-size: 11px;

    font-weight: 600;

    white-space: nowrap;

    background:
        color-mix(
            in srgb,
            var(--background) 80%,
            transparent
        );

    padding: 2px 7px;

    border-radius: 7px;

    box-shadow:
        0 1px 3px
        rgba(0,0,0,.12);
}


/* container for other players rendered directly
   on the grid backdrop (non-map mode) */
#gridPlayers {

    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;
}


#gridPlayers .avatar-badge {

    position: absolute;
}


/* ==================================================
   GAME CODE (join / create a shared session)
================================================== */

.gamecode-row {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 22px;
}


#gameCode {

    width: 176px;

    height: 44px;

    border:
        1px solid
        var(--border);

    border-radius: 11px;

    outline: none;

    background:
        var(--button-background);

    color:
        var(--text);

    text-align: center;

    text-transform: uppercase;

    letter-spacing: 2px;

    font-size: 15px;
}


#newCodeButton {

    height: 44px;

    padding: 0 14px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background:
        var(--button-background);

    color:
        var(--text);

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;
}


.gamecode-hint {

    color:
        var(--muted);

    font-size: 11px;

    margin-top: -14px;

    margin-bottom: 22px;
    text-align: center;
    max-width: 280px;
}


/* ==================================================
   SETUP
================================================== */

#setup {

    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        var(--background);

    transition:
        background .25s ease;
}


.setup-title {

    font-size: 29px;

    font-weight: 600;

    letter-spacing: 1px;

    margin-bottom: 7px;
}


.setup-subtitle {

    color:
        var(--muted);

    font-size: 13px;

    margin-bottom: 25px;
}


#username {

    width: 280px;

    height: 48px;

    border:
        1px solid
        var(--border);

    border-radius: 11px;

    outline: none;

    background:
        var(--button-background);

    color:
        var(--text);

    text-align: center;

    font-size: 16px;

    margin-bottom: 22px;
}


/* ==================================================
   COLOUR CHOOSER
================================================== */

.colors {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    margin-bottom: 25px;
}


.color {

    width: 27px;
    height: 27px;

    padding: 0;

    border-radius: 50%;

    border:
        2px solid
        transparent;

    cursor: pointer;
}


.color.selected {

    border-color:
        var(--text);

    transform:
        scale(1.12);
}


.color1 {
    background: #4285f4;
}

.color2 {
    background: #e53935;
}

.color3 {
    background: #43a047;
}

.color4 {
    background: #8e44ad;
}

.color5 {
    background: #f39c12;
}

.color6 {
    background: #00acc1;
}


.custom-color {

    position: relative;

    width: 27px;
    height: 27px;

    border-radius: 50%;

    border:
        2px solid
        var(--muted);

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        var(--text);

    font-size: 20px;

    cursor: pointer;
}


.custom-color input {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    opacity: 0;

    cursor: pointer;
}


/* ==================================================
   START BUTTON
================================================== */

#startButton {

    width: 280px;

    height: 48px;

    border: none;

    border-radius: 11px;

    background:
        var(--secondary);

    color:
        var(--background);

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;
}


#startButton:active {

    transform:
        scale(.97);
}


/* ==================================================
   LOCATION MARKER (self — uses the shared avatar
   system: circle + initial, heading pointer, name)
================================================== */

.location-marker {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 56px;
    height: 56px;

    transform:
        translate(-50%, -50%);
}


/* ==================================================
   ACCURACY CIRCLE
================================================== */

.accuracy {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 56px;
    height: 56px;

    transform:
        translate(-50%, -50%);

    border-radius:
        50%;

    background:
        color-mix(
            in srgb,
            var(--player-color) 6%,
            transparent
        );

    border:
        1px solid
        color-mix(
            in srgb,
            var(--player-color) 15%,
            transparent
        );

    transition:
        width .3s ease,
        height .3s ease;
}


/* ==================================================
   EXPLORER HEADING POINTER
================================================== */

.heading {

    position: absolute;

    left: 50%;

    top: 3px;

    width: 0;
    height: 0;

    transform:
        translateX(-50%);

    transform-origin:
        50% 25px;

    border-left:
        5px solid transparent;

    border-right:
        5px solid transparent;

    border-bottom:
        14px solid
        var(--player-color);

    filter:
        drop-shadow(
            0 1px 2px
            rgba(0,0,0,.15)
        );

    transition:
        transform .12s linear;
}


/* ==================================================
   SELF AVATAR CIRCLE
================================================== */

.self-avatar {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 30px;
    height: 30px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        var(--player-color);

    border:
        2.5px solid
        var(--background);

    box-shadow:
        0 2px 6px
        rgba(0,0,0,.25);

    display: flex;

    align-items: center;

    justify-content: center;

    color: #fff;

    font-family:
        var(--font-heading);

    font-weight: 700;

    font-size: 12px;

    z-index: 2;
}


/* ==================================================
   USERNAME
================================================== */

.player-name {

    position: absolute;

    left: 50%;

    top: calc(50% - 52px);

    transform:
        translate(-50%, -100%);

    color:
        var(--text);

    font-family:
        var(--font-heading);

    font-size: 13px;

    font-weight: 600;

    letter-spacing: .3px;

    white-space: nowrap;

    background:
        color-mix(
            in srgb,
            var(--background) 80%,
            transparent
        );

    padding: 2px 8px;

    border-radius: 7px;

    text-align: center;

    z-index: 10;
}


/* ==================================================
   GAME CODE BADGE (always visible so friends
   know what to type in to join you)
================================================== */

.gamecode-badge {

    position: absolute;

    bottom:
        calc(
            22px +
            env(safe-area-inset-bottom)
        );

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 3;

    display: flex;

    align-items: center;

    gap: 7px;

    height: 34px;

    padding: 0 14px;

    border-radius: 17px;

    border:
        1px solid
        var(--border);

    background:
        var(--button-background);

    cursor: pointer;
}


.gamecode-badge .gc-label {

    font-family:
        var(--font-heading);

    font-size: 9px;

    letter-spacing: .6px;

    color:
        var(--muted);
}


.gamecode-badge .gc-value {

    font-family:
        var(--font-mono);

    font-size: 14px;

    font-weight: 600;

    letter-spacing: 1.5px;

    color:
        var(--text);
}


/* ==================================================
   ALTITUDE
================================================== */

.altitude {

    position: absolute;

    top:
        calc(
            18px +
            env(safe-area-inset-top)
        );

    right:
        calc(
            18px +
            env(safe-area-inset-right)
        );

    text-align:
        right;
}


.altitude-label {

    font-size:
        9px;

    letter-spacing:
        .9px;

    color:
        var(--muted);
}


.altitude-value {

    margin-top:
        2px;

    font-size:
        18px;

    font-weight:
        600;

    color:
        var(--secondary);
}


/* ==================================================
   ERROR SCREEN
================================================== */

#error {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    background:
        var(--background);

    text-align:
        center;

    padding:
        30px;
}


.wifi {

    width:
        96px;

    height:
        96px;

    margin-bottom:
        22px;
}


#errorText {

    color:
        var(--error);

    font-size:
        30px;

    font-weight:
        600;

    margin-bottom:
        26px;
}


.error-buttons {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

    width:
        min(280px, 82vw);
}


.error-button {

    width:
        100%;

    min-height:
        50px;

    padding:
        0 16px;

    border-radius:
        12px;

    border:
        1px solid
        var(--border);

    background:
        var(--button-background);

    color:
        var(--secondary);

    font-size:
        16px;

    font-weight:
        600;

    cursor:
        pointer;
}


.error-button.primary {

    background:
        var(--secondary);

    color:
        var(--background);

    border:
        none;
}


#errorHelp {

    margin-top:
        17px;

    max-width:
        300px;

    color:
        var(--muted);

    font-size:
        12px;

    line-height:
        1.5;
}

</style>


<!-- Leaflet (map tiles) -->

/* ==================================================
   UPDATE LOCATION
================================================== */

function updateLocation(position) {

    const c =
        position.coords;

    const rawAccuracy =
        Number.isFinite(c.accuracy)
            ? c.accuracy
            : 30;


    if (
        c.altitude !== null
        &&
        Number.isFinite(
            c.altitude
        )
    ) {

        document.getElementById(
            "altitude"
        ).textContent =

            c.altitude.toFixed(1)
            + " m";

    }

    else {

        document.getElementById(
            "altitude"
        ).textContent =
            "--";

    }


    hideLocationError();


    /* ---- reject / smooth the fix. Raw GPS fixes
       jitter by several metres even standing still;
       we filter that out instead of drawing every
       raw sample. This can't beat your device's own
       GPS hardware accuracy, but it stops the on-
       screen jumpiness that isn't real movement. ---- */

    const filtered =
        filterPosition(
            c.latitude,
            c.longitude,
            rawAccuracy
        );

    myLastLat = filtered.lat;

    myLastLng = filtered.lng;

    updateAccuracyCircle(rawAccuracy);


    /* ---- move the backdrop so it looks like the
       world scrolls under you. Grid mode needs no
       network fetch at all; map mode (opt-in) uses
       real tiles. ---- */

    if (mapModeOn) {

        if (!mapReady) {

            initMap(myLastLat, myLastLng);

        }

        else if (followMe) {

            leafletMap.panTo(
                [myLastLat, myLastLng],
                { animate: true, duration: .4 }
            );

            hideSelfMapMarker();

        }

        else {

            /* they've dragged away — keep a real
               marker on the map showing where they
               actually are, since the fixed centre
               dot no longer represents that */
            showSelfMapMarker(
                myLastLat,
                myLastLng
            );
        }
    }

    else {

        panGrid(myLastLat, myLastLng);
    }


    /* ---- refresh everyone else's position on
       screen using the coordinates we just got ---- */

    renderOtherPlayers(lastPlayersSnapshot);


    /* ---- push my (smoothed) position to the
       shared game, so other players see the same
       jitter-free position we do ---- */

    sendMyPosition({
        latitude: myLastLat,
        longitude: myLastLng
    });
}


/* ==================================================
   GPS SMOOTHING
   Blends new fixes toward the previous position
   instead of snapping to every raw sample, and
   ignores fixes worse than 75m. The blend weight
   depends on how confident the new fix is.
================================================== */

let filteredLat = null;

let filteredLng = null;


function filterPosition(lat, lng, accuracy) {

    if (filteredLat === null) {

        filteredLat = lat;

        filteredLng = lng;

        return { lat: lat, lng: lng };
    }

    /* a fix this bad (patchy signal, indoors, etc.)
       tells us almost nothing — hold position */
    if (accuracy > 75) {

        return {
            lat: filteredLat,
            lng: filteredLng
        };
    }

    const movedMeters =
        Math.hypot(
            metersEastWest(
                filteredLat,
                filteredLng,
                lng
            ),
            metersNorthSouth(
                filteredLat,
                lat
            )
        );

    /* GPS noise floor scales with reported accuracy —
       treat tiny "movement" smaller than that as
       standing still, not a real step */
    const noiseFloor =
        Math.max(accuracy * .5, 3);

    if (movedMeters < noiseFloor) {

        return {
            lat: filteredLat,
            lng: filteredLng
        };
    }

    /* trust sharper fixes more; blend toward them
       instead of teleporting straight to them */
    const alpha =
        accuracy < 10 ? .9 :
        accuracy < 25 ? .6 :
                        .3;

    filteredLat +=
        (lat - filteredLat) * alpha;

    filteredLng +=
        (lng - filteredLng) * alpha;

    return {
        lat: filteredLat,
        lng: filteredLng
    };
}


function updateAccuracyCircle(accuracy) {

    const el =
        document.getElementById(
            "accuracyCircle"
        );

    if (!el) {

        return;
    }

    const px =
        Math.min(
            Math.max(
                accuracy *
                2 *
                GRID_PX_PER_METER,
                40
            ),
            260
        );

    el.style.width = px + "px";

    el.style.height = px + "px";
}

/* ==================================================
   SELF MARKER ON THE REAL MAP
   (only used once the person has dragged away
   from "follow me" mode)
================================================== */

function showSelfMapMarker(lat, lng) {

    document.querySelector(
        ".location-marker"
    ).style.visibility =
        "hidden";

    document.getElementById(
        "playerName"
    ).style.visibility =
        "hidden";

    const icon =
        L.divIcon({
            html: avatarHTML(
                playerName.textContent,
                selectedColor,
                lastHeadingDeg
            ),
            className: "",
            iconSize: [40, 40]
        });

    if (selfMapMarker) {

        selfMapMarker.setLatLng(
            [lat, lng]
        );

        selfMapMarker.setIcon(icon);

    }

    else {

        selfMapMarker =
            L.marker(
                [lat, lng],
                { icon: icon }
            ).addTo(leafletMap);
    }
}


function hideSelfMapMarker() {

    document.querySelector(
        ".location-marker"
    ).style.visibility =
        "visible";

    document.getElementById(
        "playerName"
    ).style.visibility =
        "visible";

    if (selfMapMarker && leafletMap) {

        leafletMap.removeLayer(
            selfMapMarker
        );

        selfMapMarker = null;
    }
}


function panGrid(lat, lng) {

    const grid =
        document.getElementById("grid");

    if (!grid) {

        return;
    }

    if (gridOriginLat === null) {

        gridOriginLat = lat;

        gridOriginLng = lng;

        return;
    }

    const dx =
        metersEastWest(
            gridOriginLat,
            gridOriginLng,
            lng
        );

    const dy =
        metersNorthSouth(
            gridOriginLat,
            lat
        );

    /* moving north/east should scroll the grid
       south/west beneath the fixed centre dot */
    const px =
        -dx * GRID_PX_PER_METER;

    const py =
        dy * GRID_PX_PER_METER;

    grid.style.backgroundPosition =
        px + "px " + py + "px";
}


function metersEastWest(lat, lng1, lng2) {

    const R = 6371000;

    const rad =
        lat * Math.PI / 180;

    return (
        (lng2 - lng1) * Math.PI / 180
    ) * R * Math.cos(rad);
}


function metersNorthSouth(lat1, lat2) {

    const R = 6371000;

    return (
        (lat2 - lat1) * Math.PI / 180
    ) * R;
}


/* ==================================================
   MAP TOGGLE (turns real tile fetching on/off)
================================================== */

function setMapMode(on) {

    mapModeOn = on;

    app.classList.toggle(
        "map-mode",
        on
    );

    mapToggle.textContent =
        on ? "HIDE MAP" : "SHOW MAP";

    localStorage.setItem(
        "hidea_mapmode",
        on ? "1" : "0"
    );


    /* grid mode has no concept of dragging away,
       so always reset to "following" when we
       leave the real map */
    followMe = true;

    recenterBtn.classList.remove(
        "visible"
    );

    hideSelfMapMarker();


    if (on) {

        if (
            !mapReady &&
            myLastLat !== null
        ) {

            initMap(myLastLat, myLastLng);

        }

        else {

            renderOtherPlayers(
                lastPlayersSnapshot
            );
        }

    }

    else {

        renderOtherPlayers(
            lastPlayersSnapshot
        );
    }
}

/* ==================================================
   LIVE MAP INIT
================================================== */

function initMap(lat, lng) {

    if (
        typeof L === "undefined"
        ||
        !document.getElementById("map")
    ) {

        return;
    }

    leafletMap = L.map(
        "map",
        {
            zoomControl: true,
            attributionControl: true,
            dragging: true,
            scrollWheelZoom: true,
            doubleClickZoom: true,
            touchZoom: true,
            boxZoom: true,
            keyboard: true
        }
    ).setView([lat, lng], 18);

    leafletMap.zoomControl.setPosition(
        "bottomright"
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(leafletMap);


    /* if the person drags/zooms the map away from
       their live position, drop out of follow mode
       — same pattern as Google Maps' blue dot */
    leafletMap.on(
        "dragstart",
        function() {

            followMe = false;

            recenterBtn.classList.add(
                "visible"
            );
        }
    );

    mapReady = true;

    renderOtherPlayers(lastPlayersSnapshot);
}


recenterBtn.addEventListener(
    "click",
    function() {

        followMe = true;

        recenterBtn.classList.remove(
            "visible"
        );

        hideSelfMapMarker();

        if (
            mapReady
            &&
            myLastLat !== null

            leafletMap.panTo(
                [myLastLat, myLastLng],
                { animate: true }
            );
        }
    }
);


/* ==================================================
   MULTIPLAYER — JOIN / SEND / RECEIVE
================================================== */

function joinGame() {

    if (!db || !myGameCode) {

        return;
    }

    playersRef =
        db.ref(
            "games/" + myGameCode + "/players"
        );

    const myRef =
        playersRef.child(myUid);

    /* remove me automatically if I close the tab */
    myRef.onDisconnect().remove();

    /* listen for everyone else's positions */
    playersRef.on(
        "value",
        function(snapshot) {

            renderOtherPlayers(
                snapshot.val() || {}
            );
        }
    );
}


function sendMyPosition(coords) {

    if (!db || !myGameCode) {

        return;
    }

    db.ref(
        "games/" + myGameCode +
        "/players/" + myUid
    ).set({

        name: playerName.textContent,
        color: selectedColor,
        lat: coords.latitude,
        lng: coords.longitude,
        heading: lastHeadingDeg,
        updatedAt:
            firebase.database.ServerValue
                .TIMESTAMP

    });
}


/* ==================================================
   SHARED AVATAR MARKUP
   Same visual language everywhere a player (other
   than "me while following") is rendered.
================================================== */

function avatarHTML(name, color, headingDeg) {

    const initial =
        (name || "Explorer")
            .trim()
            .charAt(0)
            .toUpperCase();

    const rotation =
        typeof headingDeg === "number"
            ? headingDeg
            : 0;

    return (
        '<div class="avatar-badge" style="--avatar-color:' +
        (color || "#4285f4") +
        '">' +
        '<div class="avatar-name">' +
        escapeHtml(name || "Explorer") +
        '</div>' +
        '<div class="avatar-pointer" style="transform:rotate(' +
        rotation +
        'deg)"></div>' +
        '<div class="avatar-circle">' +
        escapeHtml(initial) +
        '</div>' +
        '</div>'
    );
}


/* ==================================================
   OTHER PLAYERS — DISPATCH (map vs grid rendering)
================================================== */

function renderOtherPlayers(players) {

    lastPlayersSnapshot = players || {};

    if (mapModeOn) {

        renderMapPlayers(lastPlayersSnapshot);

        clearGridPlayers();

    }

    else {

        renderGridPlayers(lastPlayersSnapshot);

        clearMapPlayers();
    }
}


function livePlayerList(players) {

    const staleAfter = 30000; // 30s
    const now = Date.now();
    const list = [];

    Object.keys(players).forEach(
        function(uid) {

            if (uid === myUid) {

                return;
            }

            const p = players[uid];

            if (
                !p ||
                typeof p.lat !== "number" ||
                typeof p.lng !== "number"
            ) {

                return;
            }

            if (
                p.updatedAt &&
                (now - p.updatedAt) > staleAfter
            ) {

                return;
            }

            list.push(
                Object.assign({ uid: uid }, p)
            );
        }
    );

    return list;
}


/* ---- rendering on the real Leaflet map ---- */

function renderMapPlayers(players) {

    if (!mapReady) {

        return;
    }

    const live = livePlayerList(players);
    const seen = {};

    live.forEach(
        function(p) {

            seen[p.uid] = true;

            const icon =
                L.divIcon({
                    html: avatarHTML(
                        p.name,
                        p.color,
                        p.heading
                    ),
                    className: "",
                    iconSize: [40, 40]
                });

            if (othersLayer[p.uid]) {

                othersLayer[p.uid].setLatLng(
                    [p.lat, p.lng]
                );

                othersLayer[p.uid]
                    .setIcon(icon);

            }

            else {

                othersLayer[p.uid] =
                    L.marker(
                        [p.lat, p.lng],
                        { icon: icon }
                    ).addTo(leafletMap);
            }
        }
    );

    Object.keys(othersLayer).forEach(
        function(uid) {

            if (!seen[uid]) {

                leafletMap.removeLayer(
                    othersLayer[uid]
                );

                delete othersLayer[uid];
            }
        }
    );
}


function clearMapPlayers() {

    Object.keys(othersLayer).forEach(
        function(uid) {

            if (leafletMap) {

                leafletMap.removeLayer(
                    othersLayer[uid]
                );
            }
        }
    );

    othersLayer = {};
}


/* ---- rendering on the grid backdrop, placed
   relative to your own live position (no map,
   no network fetch needed) ---- */

function renderGridPlayers(players) {

    if (
        myLastLat === null ||
        myLastLng === null
    ) {

        return;
    }

    const live = livePlayerList(players);
    const seen = {};

    live.forEach(
        function(p) {

            seen[p.uid] = true;

            const dx =
                metersEastWest(
                    myLastLat,
                    myLastLng,
                    p.lng
                );

            const dy =
                metersNorthSouth(
                    myLastLat,
                    p.lat
                );

            const px =
                dx * GRID_PX_PER_METER;

            const py =
                -dy * GRID_PX_PER_METER;

            let el = othersGridEls[p.uid];

            if (!el) {

                el =
                    document.createElement(
                        "div"
                    );

                el.className =
                    "avatar-badge";

                gridPlayersEl
                    .appendChild(el);

                othersGridEls[p.uid] = el;
            }

            el.style.left =
                "calc(50% + " + px + "px)";

            el.style.top =
                "calc(50% + " + py + "px)";

            el.style.setProperty(
                "--avatar-color",
                p.color || "#4285f4"
            );

            el.innerHTML =
                '<div class="avatar-name">' +
                escapeHtml(p.name || "Explorer") +
                '</div>' +
                '<div class="avatar-pointer" style="transform:rotate(' +
                (typeof p.heading === "number"
                    ? p.heading
                    : 0) +
                'deg)"></div>' +
                '<div class="avatar-circle">' +
                escapeHtml(
                    (p.name || "Explorer")
                        .trim()
                        .charAt(0)
                        .toUpperCase()
                ) +
                '</div>';
        }
    );

    Object.keys(othersGridEls).forEach(
        function(uid) {

            if (!seen[uid]) {

                othersGridEls[uid].remove();

                delete othersGridEls[uid];
            }
        }
    );
}


function clearGridPlayers() {

    Object.keys(othersGridEls).forEach(
        function(uid) {

            othersGridEls[uid].remove();
        }
    );

    othersGridEls = {};
}


function escapeHtml(str) {

    const div =
        document.createElement("div");

    div.textContent = str;

    return div.innerHTML;
}


/* ==================================================
   GPS WATCH
================================================== */

function startLocationWatch() {

    if (
        locationWatch !== null
    ) {

        navigator.geolocation
            .clearWatch(
                locationWatch
            );

    }


    locationWatch =
        navigator.geolocation
            .watchPosition(

                updateLocation,

                function() {

                    showLocationError();

                },

                {

                    enableHighAccuracy:
                        true,

                    maximumAge:
                        1000,

                    timeout:
                        15000

                }

            );
}


/* ==================================================
   REQUEST LOCATION
================================================== */

function requestLocation() {

    if (
        !navigator.geolocation
    ) {

        showLocationError();

        return;
    }


    navigator.geolocation
        .getCurrentPosition(

            function(position) {

                updateLocation(
                    position
                );

                startLocationWatch();

                startCompass();

            },

            function() {

                showLocationError();

            },

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    0,

                timeout:
                    15000

            }

        );
}


/* ==================================================
   OPEN ANDROID LOCATION SETTINGS
================================================== */

function openLocationSettings() {

    const intent =
        "intent://settings/location" +
        "#Intent;" +
        "scheme=android-app;" +
        "package=com.android.settings;" +
        "end";


    try {

        window.location.href =
            intent;

    }

    catch (error) {

        requestLocation();

    }
}


/* ==================================================
   COMPASS
================================================== */

function handleCompass(event) {

    let direction;


    if (
        event.webkitCompassHeading
        !== undefined
    ) {

        direction =
            event.webkitCompassHeading;

    }

    else if (
        event.alpha !== null
    ) {

        direction =
            360 - event.alpha;

    }

    else {

        return;

    }


    direction =
        (direction + 360) % 360;


    lastHeadingDeg = direction;


    heading.style.transform =

        "translateX(-50%) rotate("
        +
        direction
        +
        "deg)";
}


/* ==================================================
   START COMPASS
================================================== */

function startCompass() {

    if (
        compassStarted
    ) {

        return;
    }


    compassStarted = true;


    if (

        typeof DeviceOrientationEvent
        !== "undefined"

        &&

        typeof DeviceOrientationEvent
            .requestPermission
        === "function"

    ) {

        DeviceOrientationEvent
            .requestPermission()
            .then(

                function(permission) {

                    if (
                        permission ===
                        "granted"
                    ) {

                        window
                            .addEventListener(
                                "deviceorientation",
                                handleCompass,
                                true
                            );

                    }

                }

            )
            .catch(
                function() {}
            );

    }

    else {

        window
            .addEventListener(
                "deviceorientationabsolute",
                handleCompass,
                true
            );


        window
            .addEventListener(
                "deviceorientation",
                handleCompass,
                true
            );

    }
}


/* ==================================================
   ALLOW LOCATION BUTTON
================================================== */

document
    .getElementById("allowButton")
    .addEventListener(
        "click",
        function() {

            requestLocation();

        }
    );


/* ==================================================
   SETTINGS BUTTON
================================================== */

document
    .getElementById("settingsButton")
    .addEventListener(
        "click",
        function() {

            openLocationSettings();

        }
    );


/* ==================================================
   START COMPASS ON TOUCH
================================================== */

document.addEventListener(

    "touchstart",

    function() {

        startCompass();

    },

    {

        once: true,

        passive: true

    }

);

</script>
