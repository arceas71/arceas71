<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Ad Muter</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #status {
        font-size: 14px;
        opacity: 0.7;
    }

    #dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #777;
        margin-right: 7px;
    }
</style>
</head>

<body>

<div id="status">
    <span id="dot"></span>
    <span id="text">Waiting</span>
</div>

<script>
let adActive = false;
let eventCount = 0;

const dot = document.getElementById("dot");
const text = document.getElementById("text");

function setStatus(message, active = false) {
    text.textContent = message;
    dot.style.background = active ? "#ff4444" : "#777";
}

// Called by the Android wrapper when a Spotify notification arrives.
window.spotifyNotification = function(notificationText) {

    eventCount++;

    const textReceived = String(notificationText || "").toLowerCase();

    if (textReceived.includes("advertisement")) {

        if (!adActive) {
            adActive = true;

            // Tell Android to save volume and mute.
            if (window.Android && Android.muteForAd) {
                Android.muteForAd();
            }

            setStatus("Ad detected", true);
        }

    } else {

        if (adActive) {
            adActive = false;

            // Tell Android to restore the saved volume.
            if (window.Android && Android.restoreVolume) {
                Android.restoreVolume();
            }

            setStatus("Restored");
        }
    }
};

// Lets the native wrapper tell us that it is connected.
window.androidReady = function() {
    setStatus("Listening");
};
</script>

</body>
</html>
